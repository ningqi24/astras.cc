<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NS投稿协议</title>
    <style>
        /* 全局重置：完全透明背景，纯黑文字，无任何特效 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: transparent !important;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            color: #000000;
            line-height: 1.7;
        }

        .protocol-container {
            width: 100%;
            min-height: 100vh;
            padding: 40px 24px;
            background: transparent !important;
            display: flex;
            flex-direction: column;
        }

        /* 头部：纯黑，无emoji */
        .protocol-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
            background: transparent;
        }

        .protocol-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #000000;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .protocol-meta {
            font-size: 14px;
            color: #000000;
            text-align: right;
            white-space: nowrap;
        }
        .protocol-meta .version {
            font-weight: 600;
        }

        /* 正文 */
        .protocol-body {
            flex: 1;
            font-size: 15px;
            color: #000000;
            overflow-y: auto;
            padding-right: 4px;
            background: transparent;
        }

        .protocol-body p {
            margin: 0.8em 0;
        }

        .protocol-body h2 {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            margin: 1.6em 0 0.5em 0;
        }

        .protocol-body h3 {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            margin: 1em 0 0.3em 0;
        }

        .protocol-body ul,
        .protocol-body ol {
            padding-left: 1.6em;
            margin: 0.4em 0 0.8em 0;
        }
        .protocol-body li {
            margin: 0.25em 0;
        }

        .protocol-body .code-block {
            background: transparent;
            padding: 10px 16px;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 13px;
            color: #000000;
            border-left: 3px solid rgba(0, 0, 0, 0.3);
            margin: 0.6em 0 1em 0;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .protocol-body .divider {
            border: none;
            height: 1px;
            background: rgba(0, 0, 0, 0.15);
            margin: 1.8em 0;
        }

        .protocol-body a {
            color: #000000;
            text-decoration: underline;
        }
        .protocol-body a:hover {
            text-decoration: none;
        }

        .protocol-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.15);
            font-size: 14px;
            color: #000000;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 16px;
            background: transparent;
        }
        .protocol-footer .signature {
            font-weight: 500;
        }

        .loading-tip {
            text-align: center;
            color: #000000;
            font-size: 14px;
            padding: 4px 0;
            display: none;
        }
        .loading-tip.show {
            display: block;
        }

        @media (max-width: 600px) {
            .protocol-container {
                padding: 24px 16px;
            }
            .protocol-header h1 {
                font-size: 22px;
            }
            .protocol-meta {
                white-space: normal;
                text-align: left;
            }
            .protocol-body {
                font-size: 14px;
            }
            .protocol-body h2 {
                font-size: 17px;
            }
            .protocol-footer {
                flex-direction: column;
                gap: 4px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="protocol-container">
        <div class="protocol-header">
            <h1>NS投稿协议</h1>
        </div>

        <div class="protocol-body" id="protocolBody">
            <!-- 动态注入 -->
        </div>

        <div class="protocol-footer">
            <span>提交即视为同意</span>
        </div>

        <div class="loading-tip" id="loadingTip">正在加载最新投稿协议…</div>
    </div>

    <script>
        // ============================================================
        // 配置：优先从 GitHub 仓库获取协议内容
        // ============================================================
        const PROTOCOL_URL = 'https://ghproxy.net/https://raw.githubusercontent.com/ningqi24/COLID-CE-NS/main/cse/README.md';

        // ============================================================
        // 内置备用协议正文（当网络获取失败时使用）
        // ============================================================
        const FALLBACK_HTML = `
<h2>NS 投稿协议（app.sprite3 / .cse）</h2><p><strong>投稿渠道：</strong> https://github.com/ningqi24/COLID-CE-NS/issues  <br />（仓库名保留历史，但本协议中所指作品统称 <strong>NS</strong>）</p><hr class="divider" /><ul><li><strong>投稿内容</strong>  </li></ul><br />   您提交的 <code>cse</code> 文件（即 <code>app.sprite3</code>Scratch角色文件，<code>cse应用</code>本体文件）、 <code>cse.json</code>文件（即您提交的<code>cse应用</code>的介绍文件，格式请参照此仓库<code>./cse.json</code>）及相关说明、素材，均为自愿向 <strong>NS</strong> 项目投稿。</p><ul><li><strong>版权归属</strong>  </li></ul><br /><ul><li>您保留投稿内容的原始版权，但须保证不侵犯任何第三方权益。  </li></ul><br /><ul><li>您授予项目作者 <strong>ningqi</strong> 及 <strong>COLID Studio</strong> 永久、非独占、免版税的使用权，包括修改、合并、发布。</li></ul><ul><li><strong>署名</strong>  </li></ul><br />   采纳后我们将标注您的贡献者名称（可要求匿名），但不得篡改 <strong>COLID OS</strong> 原始署名。</p><ul><li><strong>合规</strong>  </li></ul><br />   禁止包含色情、暴力、政治敏感内容；禁止利用 Bug 恶意操作；禁止甩锅官方。</p><ul><li><strong>处理</strong>  </li></ul><br />   维护者有权决定是否采纳，无需额外说明。未采纳的投稿可自行处置。</p><ul><li><strong>免责</strong>  </li></ul><br />   投稿引发的一切法律纠纷由投稿人自行承担，项目方不作任何担保。</p><hr class="divider" /><p><strong>提交即视为同意本协议。</strong>  </p><p>—— NS 作者 ningqi & COLID Studio<br /></p>
        `;

        // ============================================================
        // 加载逻辑：优先从 GitHub 获取，失败则使用备用
        // ============================================================
                (function loadProtocol() {
            const bodyEl = document.getElementById('protocolBody');
            const tipEl = document.getElementById('loadingTip');

            // 秒开：先立即显示内置内容，不等待网络
            bodyEl.innerHTML = FALLBACK_HTML;
            tipEl.classList.remove('show');

            // 将 Markdown 风格的纯文本转换为 HTML
            function renderMarkdown(rawText) {
                let html = rawText
                    // 分隔线
                    .replace(/^---+$/gm, '<hr class="divider" />')
                    // 标题（### / ## / #）
                    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
                    // 行内代码（`xxx`）
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    // 加粗（**文本**）
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    // 链接（[文本](url)）
                    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>')
                    // 有序列表（数字. 开头）
                    .replace(/^(\d+)\.\s+(.+)$/gm, '<li>$2</li>')
                    // 无序列表（- 开头）
                    .replace(/^-\s+(.+)$/gm, '<li>$1</li>')
                    // 缩进子项（含前导空格的 - 开头）
                    .replace(/^\s+-\s+(.+)$/gm, '<li>$1</li>')
                    // 段落（连续两行换行分隔）
                    .replace(/\n\n/g, '</p><p>')
                    // 换行
                    .replace(/\n/g, '<br />');

                // 包装成完整段落
                html = '<p>' + html + '</p>';

                // 修复列表：将连续的 <li> 包装到 <ul> 中
                html = html.replace(/(<li>.*?<\/li>)+/g, function(match) {
                    return '<ul>' + match + '</ul>';
                });

                // 清理多余的 <p><ul> 和 </ul></p>
                html = html.replace(/<p><ul>/g, '<ul>');
                html = html.replace(/<\/ul><\/p>/g, '</ul>');
                html = html.replace(/<p><\/p>/g, '');
                html = html.replace(/<p><hr class="divider" \/><\/p>/g, '<hr class="divider" />');
                html = html.replace(/<p><h3>/g, '<h3>');
                html = html.replace(/<\/h3><\/p>/g, '</h3>');
                html = html.replace(/<p><h2>/g, '<h2>');
                html = html.replace(/<\/h2><\/p>/g, '</h2>');

                bodyEl.innerHTML = html;
                tipEl.classList.remove('show');
            }

            // 依次尝试多个地址：代理优先，失败自动回退直连；全失败则保留内置内容
            const urlList = [
                PROTOCOL_URL,
                'https://raw.githubusercontent.com/ningqi24/COLID-CE-NS/main/cse/README.md'
            ];

            (function tryFetch(i) {
                if (i >= urlList.length) {
                    // 全部失败：保留秒开的内置内容
                    tipEl.classList.remove('show');
                    return;
                }

                fetch(urlList[i], {
                    method: 'GET',
                    headers: { 'Accept': 'text/plain' },
                    cache: 'no-cache'
                })
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.text();
                })
                .then(rawText => renderMarkdown(rawText))
                .catch(() => tryFetch(i + 1));
            })(0);
        })();
    </script>
</body>
</html>
