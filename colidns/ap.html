<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NS 使用协议</title>
    <style>
        /* 全局透明背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            /* 完全透明背景 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }

        /* 半透明卡片 —— 保持“背景透明”的同时让文字可读 */
        .protocol-card {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            background: rgba(18, 22, 30, 0.88);
            /* 深色半透明，可见后方内容 */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 44px 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
            color: #eaeef5;
            line-height: 1.7;
            transition: all 0.2s ease;
        }

        /* 标题区 */
        .protocol-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 10px 20px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .protocol-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #f0f4ff 0%, #a8c0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1.2;
        }

        .protocol-meta {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            text-align: right;
            white-space: nowrap;
        }
        .protocol-meta span {
            display: block;
        }
        .protocol-meta .version {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
        }

        /* 正文样式 */
        .protocol-body {
            font-size: 15px;
            color: #d6dee9;
        }

        .protocol-body p {
            margin: 1em 0;
        }

        .protocol-body h2 {
            font-size: 18px;
            font-weight: 600;
            color: #f0f4ff;
            margin: 1.8em 0 0.6em 0;
            padding-top: 0.2em;
            letter-spacing: 0.3px;
        }
        .protocol-body h2:first-of-type {
            margin-top: 0.2em;
        }

        .protocol-body h3 {
            font-size: 16px;
            font-weight: 600;
            color: #d0dbf0;
            margin: 1.2em 0 0.4em 0;
        }

        .protocol-body ul,
        .protocol-body ol {
            padding-left: 1.6em;
            margin: 0.5em 0 1em 0;
        }
        .protocol-body li {
            margin: 0.35em 0;
        }

        .protocol-body .highlight {
            color: #9bbaff;
            font-weight: 500;
        }

        .protocol-body .code-block {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 8px;
            padding: 10px 16px;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 13px;
            color: #c8d6f0;
            border-left: 3px solid #5b7fc7;
            margin: 0.6em 0 1.2em 0;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .protocol-body .divider {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            margin: 2em 0;
        }

        /* 脚注 */
        .protocol-footer {
            margin-top: 32px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.45);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
        }
        .protocol-footer .signature {
            color: rgba(255, 255, 255, 0.65);
            font-weight: 500;
        }

        /* 加载提示 */
        .loading-tip {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            padding: 10px 0;
            display: none;
        }
        .loading-tip.show {
            display: block;
        }

        /* 小屏适配 */
        @media (max-width: 600px) {
            body {
                padding: 16px 12px;
            }
            .protocol-card {
                padding: 28px 20px;
                border-radius: 20px;
            }
            .protocol-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .protocol-header h1 {
                font-size: 22px;
            }
            .protocol-meta {
                text-align: left;
                white-space: normal;
            }
            .protocol-body {
                font-size: 14px;
            }
            .protocol-body h2 {
                font-size: 17px;
            }
            .protocol-footer {
                flex-direction: column;
                gap: 4px;
            }
        }

        /* 滚动条美观 */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body>

        // ============================================================
        // 3. 核心逻辑：尝试从 GitHub 加载，失败则使用内置备用
        // ============================================================
        (function loadProtocol() {
            const bodyEl = document.getElementById('protocolBody');
            const tipEl = document.getElementById('loadingTip');

            // 如果未配置 URL 或 URL 为空，直接使用内置
            if (!PROTOCOL_URL || PROTOCOL_URL.trim() === '') {
                bodyEl.innerHTML = FALLBACK_HTML;
                return;
            }

            // 显示加载提示
            tipEl.classList.add('show');
            tipEl.textContent = '正在从 GitHub 加载最新协议…';

            fetch(PROTOCOL_URL, {
                method: 'GET',
                headers: { 'Accept': 'text/html' },
                cache: 'no-cache'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.text();
            })
            .then(html => {
                // 成功获取，替换正文内容
                bodyEl.innerHTML = html;
                tipEl.classList.remove('show');
                console.log('✅ 协议已从 GitHub 加载');
            })
            .catch(err => {
                // 网络错误或文件不存在，使用内置备用
                bodyEl.innerHTML = FALLBACK_HTML;
                tipEl.classList.remove('show');
                console.warn('⚠️ 无法从 GitHub 加载协议，使用内置备用内容。', err);
            });
        })();
