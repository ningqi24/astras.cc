                (function loadProtocol() {
            const bodyEl = document.getElementById('protocolBody');
            const tipEl = document.getElementById('loadingTip');

            // 秒开：先立即显示内置内容，不等待网络
            bodyEl.innerHTML = FALLBACK_HTML;
            tipEl.classList.remove('show');

            // 将 Markdown 风格的纯文本转换为 HTML
            function renderMarkdown(rawText) {
                let html = rawText
                    // 分隔线
                    .replace(/^---+$/gm, '<hr class="divider" />')
                    // 标题（### / ## / #）
                    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
                    // 行内代码（`xxx`）
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    // 加粗（**文本**）
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    // 链接（[文本](url)）
                    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>')
                    // 有序列表（数字. 开头）
                    .replace(/^(\d+)\.\s+(.+)$/gm, '<li>$2</li>')
                    // 无序列表（- 开头）
                    .replace(/^-\s+(.+)$/gm, '<li>$1</li>')
                    // 缩进子项（含前导空格的 - 开头）
                    .replace(/^\s+-\s+(.+)$/gm, '<li>$1</li>')
                    // 段落（连续两行换行分隔）
                    .replace(/\n\n/g, '</p><p>')
                    // 换行
                    .replace(/\n/g, '<br />');

                // 包装成完整段落
                html = '<p>' + html + '</p>';

                // 修复列表：将连续的 <li> 包装到 <ul> 中
                html = html.replace(/(<li>.*?<\/li>)+/g, function(match) {
                    return '<ul>' + match + '</ul>';
                });

                // 清理多余的 <p><ul> 和 </ul></p>
                html = html.replace(/<p><ul>/g, '<ul>');
                html = html.replace(/<\/ul><\/p>/g, '</ul>');
                html = html.replace(/<p><\/p>/g, '');
                html = html.replace(/<p><hr class="divider" \/><\/p>/g, '<hr class="divider" />');
                html = html.replace(/<p><h3>/g, '<h3>');
                html = html.replace(/<\/h3><\/p>/g, '</h3>');
                html = html.replace(/<p><h2>/g, '<h2>');
                html = html.replace(/<\/h2><\/p>/g, '</h2>');

                bodyEl.innerHTML = html;
                tipEl.classList.remove('show');
            }

            // 依次尝试多个地址：代理优先，失败自动回退直连；全失败则保留内置内容
            const urlList = [
                PROTOCOL_URL,
                'https://raw.githubusercontent.com/ningqi24/COLID-CE-NS/main/README.md'
            ];

            (function tryFetch(i) {
                if (i >= urlList.length) {
                    // 全部失败：保留秒开的内置内容
                    tipEl.classList.remove('show');
                    return;
                }

                fetch(urlList[i], {
                    method: 'GET',
                    headers: { 'Accept': 'text/plain' },
                    cache: 'no-cache'
                })
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.text();
                })
                .then(rawText => renderMarkdown(rawText))
                .catch(() => tryFetch(i + 1));
            })(0);
        })();
