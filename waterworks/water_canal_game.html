<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>水渠大亨 - Water Canal Tycoon</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --gold: #f0c040;
    --accent: #4da6ff;
    --danger: #e74c3c;
    --text: #e0e0e0;
    --text-dim: #999;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background: var(--bg);
    font-family: 'PingFang SC', 'Heiti SC', 'Microsoft YaHei', sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    display:flex; flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:8px;
    gap:8px;
  }

  /* 顶部状态栏 */
  .status-bar {
    display:flex; align-items:center; justify-content:space-between;
    width:100%; max-width:420px;
    padding:8px 12px;
    background: var(--surface);
    border-radius:12px;
    gap:8px;
    flex-shrink:0;
  }
  .stat-item {
    display:flex; align-items:center; gap:4px;
    color: var(--text); font-size:14px; font-weight:600;
  }
  .stat-icon { font-size:18px; }
  .stat-value { color: var(--gold); font-size:16px; }
  .income-badge {
    color: #4ecca3; font-size:12px;
    background: rgba(78,204,163,0.15);
    padding:2px 8px; border-radius:10px;
  }

  /* Canvas容器 */
  .canvas-wrapper {
    position:relative;
    width:100%; max-width:420px;
    background: var(--surface);
    border-radius:12px;
    overflow:hidden;
    flex-shrink:0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  canvas {
    display:block; width:100%; height:auto;
    cursor:pointer;
  }

  /* 工具栏 */
  .toolbar {
    width:100%; max-width:420px;
    display:flex; flex-wrap:wrap;
    gap:6px;
    flex-shrink:0;
    justify-content:center;
  }
  .tool-btn {
    flex:1 1 auto; min-width:56px; max-width:80px;
    padding:8px 4px;
    border-radius:10px;
    border:2px solid transparent;
    background: var(--surface);
    color: var(--text);
    font-size:11px; font-weight:600;
    text-align:center;
    cursor:pointer;
    transition: all 0.15s;
    display:flex; flex-direction:column;
    align-items:center; gap:2px;
    -webkit-tap-highlight-color: transparent;
  }
  .tool-btn .icon { font-size:20px; line-height:1; }
  .tool-btn .price { font-size:10px; color: var(--gold); }
  .tool-btn.selected {
    border-color: var(--accent);
    background: rgba(77,166,255,0.15);
    box-shadow: 0 0 12px rgba(77,166,255,0.3);
  }
  .tool-btn:active { transform:scale(0.95); }
  .tool-btn.demolish { border-color: var(--danger); }
  .tool-btn.demolish.selected {
    border-color: var(--danger);
    background: rgba(231,76,60,0.15);
    box-shadow: 0 0 12px rgba(231,76,60,0.3);
  }

  /* 提示 */
  .hint {
    color: var(--text-dim); font-size:11px;
    text-align:center; flex-shrink:0;
    min-height:16px;
  }
</style>
</head>
<body>

<div class="status-bar">
  <div class="stat-item">
    <span class="stat-icon">🪙</span>
    <span>金币:</span>
    <span class="stat-value" id="goldDisplay">60</span>
  </div>
  <div class="stat-item">
    <span>💧/秒:</span>
    <span class="income-badge" id="incomeDisplay">+0</span>
  </div>
  <div class="stat-item" style="font-size:11px;">
    <span>🌾<span id="farmCount">0</span>/4</span>
  </div>
</div>

<div class="canvas-wrapper" id="canvasWrapper">
  <canvas id="gameCanvas"></canvas>
</div>

<div class="toolbar" id="toolbar">
  <button class="tool-btn selected" data-tool="h" title="水平管 - 连接左右">
    <span class="icon">═</span>水平管<span class="price">5💰</span>
  </button>
  <button class="tool-btn" data-tool="v" title="垂直管 - 连接上下">
    <span class="icon">║</span>垂直管<span class="price">5💰</span>
  </button>
  <button class="tool-btn" data-tool="c" title="弯管 - 点击旋转方向">
    <span class="icon">╗</span>弯管<span class="price">10💰</span>
  </button>
  <button class="tool-btn" data-tool="x" title="十字管 - 连接四方">
    <span class="icon">╬</span>十字管<span class="price">18💰</span>
  </button>
  <button class="tool-btn" data-tool="d" title="大坝 - 阻挡水流">
    <span class="icon">🧱</span>大坝<span class="price">25💰</span>
  </button>
  <button class="tool-btn demolish" data-tool="del" title="拆除 - 返还3金币">
    <span class="icon">🔨</span>拆除<span class="price">+3💰</span>
  </button>
</div>

<div class="hint" id="hint">点击网格放置水渠，把水引到农田🌾</div>

<script>
(function() {
  // ==================== 常量 ====================
  const COLS = 14;
  const ROWS = 10;

  // 格子类型
  const EMPTY = 0;
  const OBSTACLE = 1;
  const PIPE_H = 2;   // 水平管: 左右
  const PIPE_V = 3;   // 垂直管: 上下
  const PIPE_C = 4;   // 弯管: base+朝向(0=↗上右,1=↘下右,2=↙下左,3=↖上左)
  const PIPE_X = 5;   // 十字管: 四方向
  const DAM = 6;      // 大坝: 无方向
  const FARM = 7;     // 农田
  const SOURCE = 8;   // 水源

  // 工具价格
  const PRICES = { h:5, v:5, c:10, x:18, d:25, del:0 };

  // ==================== DOM ====================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const goldDisplay = document.getElementById('goldDisplay');
  const incomeDisplay = document.getElementById('incomeDisplay');
  const farmCountEl = document.getElementById('farmCount');
  const hintEl = document.getElementById('hint');
  const toolbar = document.getElementById('toolbar');

  // ==================== 游戏状态 ====================
  let grid = [];           // 格子类型
  let pipeOrient = [];    // 弯管朝向 (仅PIPE_C使用, 0-3)
  let wet = [];           // 湿润状态 (0/1)
  let gold = 60;
  let incomePerSec = 0;
  let selectedTool = 'h';
  let farms = [];         // [{col, row}]
  let waterSources = [];  // [{col, row}]
  let particles = [];
  let animTime = 0;
  let lastFlowTick = 0;
  let lastEarnTick = 0;
  let flowInterval = 400;
  let earnInterval = 500;
  let dpr = 1;
  let cellSize = 0;
  let canvasW = 0;
  let canvasH = 0;
  let offsetX = 0;
  let offsetY = 0;
  let gameStarted = false;

  // ==================== 初始化 ====================
  function initGrid() {
    grid = Array.from({length:ROWS}, () => new Array(COLS).fill(EMPTY));
    pipeOrient = Array.from({length:ROWS}, () => new Array(COLS).fill(0));
    wet = Array.from({length:ROWS}, () => new Array(COLS).fill(0));
    farms = [];
    waterSources = [];
    particles = [];

    // 水源: 左侧中间4格
    for (let r = 3; r <= 6; r++) {
      grid[r][0] = SOURCE;
      waterSources.push({col:0, row:r});
    }

    // 农田: 右侧随机4个
    let candidates = [];
    for (let r = 1; r < ROWS-1; r++) {
      candidates.push({col:COLS-1, row:r});
    }
    shuffle(candidates);
    farms = candidates.slice(0, 4);
    farms.forEach(f => { grid[f.row][f.col] = FARM; });

    // 障碍: 随机8-10个 (避开水源、农田、边缘附近)
    let obstCount = 8 + Math.floor(Math.random() * 3);
    let obstPlaced = 0;
    let maxAttempts = 200;
    while (obstPlaced < obstCount && maxAttempts-- > 0) {
      let c = 2 + Math.floor(Math.random() * (COLS-4));
      let r = 1 + Math.floor(Math.random() * (ROWS-2));
      if (grid[r][c] === EMPTY) {
        grid[r][c] = OBSTACLE;
        obstPlaced++;
      }
    }

    // 清理湿状态
    wet = Array.from({length:ROWS}, () => new Array(COLS).fill(0));
  }

  function shuffle(arr) {
    for (let i = arr.length-1; i>0; i--) {
      let j = Math.floor(Math.random()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  // ==================== Canvas 尺寸计算 ====================
  function resizeCanvas() {
    const wrapper = document.getElementById('canvasWrapper');
    const maxW = wrapper.clientWidth;
    const maxH = Math.min(window.innerHeight * 0.55, 420);

    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cellSize = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
    canvasW = cellSize * COLS;
    canvasH = cellSize * ROWS;
    offsetX = (maxW - canvasW) / 2;
    offsetY = 0;

    canvas.width = canvasW * dpr;
    canvas.height = canvasH * dpr;
    canvas.style.width = canvasW + 'px';
    canvas.style.height = canvasH + 'px';

    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
  }

  // ==================== 水流计算 (BFS) ====================
  function getConnections(type, orient) {
    // 返回该格子连接的出口方向数组 [上,下,左,右] 布尔
    switch(type) {
      case PIPE_H: return [false,false,true,true];  // 左右
      case PIPE_V: return [true,true,false,false];  // 上下
      case PIPE_C:
        // orient: 0=↗(上右), 1=↘(下右), 2=↙(下左), 3=↖(上左)
        switch(orient) {
          case 0: return [true,false,false,true]; // 上,右
          case 1: return [false,true,false,true]; // 下,右
          case 2: return [false,true,true,false]; // 下,左
          case 3: return [true,false,true,false]; // 上,左
        }
        return [false,false,false,false];
      case PIPE_X: return [true,true,true,true];   // 四方向
      case SOURCE: return [true,true,true,true];    // 水源四方向
      case FARM: return [true,true,true,true];      // 农田接受所有方向
      case DAM: return [false,false,false,false];   // 大坝阻挡
      default: return [false,false,false,false];
    }
  }

  function updateWaterFlow() {
    // 重置湿状态
    wet = Array.from({length:ROWS}, () => new Array(COLS).fill(0));

    // BFS队列
    let queue = [];
    let visited = Array.from({length:ROWS}, () => new Array(COLS).fill(false));

    // 水源格子始终湿润
    waterSources.forEach(s => {
      wet[s.row][s.col] = 1;
      visited[s.row][s.col] = true;
      queue.push({col:s.col, row:s.row});
    });

    // 方向: 上,下,左,右
    const drs = [-1,1,0,0];
    const dcs = [0,0,-1,1];
    // 反向方向索引: 上->1(下), 下->0(上), 左->3(右), 右->2(左)
    const reverseDir = [1,0,3,2];

    while (queue.length > 0) {
      let cur = queue.shift();
      let curType = grid[cur.row][cur.col];
      let curOrient = pipeOrient[cur.row][cur.col];
      let curConn = getConnections(curType, curOrient);

      for (let i = 0; i < 4; i++) {
        if (!curConn[i]) continue; // 当前格这个方向不通

        let nr = cur.row + drs[i];
        let nc = cur.col + dcs[i];
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
        if (visited[nr][nc]) continue;

        let nType = grid[nr][nc];
        if (nType === EMPTY || nType === OBSTACLE || nType === DAM) continue;

        let nConn = getConnections(nType, pipeOrient[nr][nc]);
        // 邻居格需要接受来自"反向"方向的水
        let rev = reverseDir[i];
        if (!nConn[rev]) continue; // 邻居不接受这个方向的水

        wet[nr][nc] = 1;
        visited[nr][nc] = true;
        // 如果邻居不是农田(农田是终点)，继续BFS
        if (nType !== FARM) {
          queue.push({col:nc, row:nr});
        }
      }
    }

    // 计算收入: 湿润的农田数 * 2金币/秒
    let wetFarms = 0;
    farms.forEach(f => {
      if (wet[f.row][f.col]) wetFarms++;
    });
    incomePerSec = wetFarms * 2;
    farmCountEl.textContent = wetFarms;
    incomeDisplay.textContent = '+' + incomePerSec;
  }

  // ==================== 放置/操作 ====================
  function placeTile(col, row) {
    let curType = grid[row][col];

    // 不可操作水源、障碍
    if (curType === SOURCE || curType === OBSTACLE) return;

    if (selectedTool === 'del') {
      // 拆除
      if (curType === EMPTY || curType === FARM) return;
      if (curType === PIPE_C || curType === PIPE_H || curType === PIPE_V || curType === PIPE_X || curType === DAM) {
        grid[row][col] = EMPTY;
        pipeOrient[row][col] = 0;
        gold += 3;
        updateWaterFlow();
        updateUI();
        hintEl.textContent = '拆除成功，返还3💰';
        return;
      }
      return;
    }

    // 如果点击的是弯管，旋转它
    if (curType === PIPE_C && selectedTool === 'c') {
      pipeOrient[row][col] = (pipeOrient[row][col] + 1) % 4;
      updateWaterFlow();
      updateUI();
      let names = ['↗(上右)','↘(下右)','↙(下左)','↖(上左)'];
      hintEl.textContent = '弯管旋转为 ' + names[pipeOrient[row][col]];
      return;
    }

    // 点击已有水渠且同一类型 → 不做替换
    if (curType === PIPE_H && selectedTool === 'h') return;
    if (curType === PIPE_V && selectedTool === 'v') return;
    if (curType === PIPE_X && selectedTool === 'x') return;
    if (curType === DAM && selectedTool === 'd') return;
    if (curType === FARM) return; // 不能覆盖农田

    // 检查金币
    let price = PRICES[selectedTool];
    if (gold < price) {
      hintEl.textContent = '金币不足！需要 ' + price + '💰';
      shakeElement(goldDisplay);
      return;
    }

    // 放置
    let newType;
    switch(selectedTool) {
      case 'h': newType = PIPE_H; break;
      case 'v': newType = PIPE_V; break;
      case 'c': newType = PIPE_C; break;
      case 'x': newType = PIPE_X; break;
      case 'd': newType = DAM; break;
      default: return;
    }

    grid[row][col] = newType;
    pipeOrient[row][col] = 0;
    gold -= price;
    updateWaterFlow();
    updateUI();
    hintEl.textContent = '放置成功！-' + price + '💰';
  }

  function shakeElement(el) {
    el.style.transition = 'none';
    el.style.transform = 'translateX(-4px)';
    setTimeout(() => { el.style.transform = 'translateX(4px)'; }, 50);
    setTimeout(() => { el.style.transform = 'translateX(-3px)'; }, 100);
    setTimeout(() => { el.style.transform = 'translateX(3px)'; }, 150);
    setTimeout(() => { el.style.transform = 'translateX(0)'; el.style.transition = 'transform 0.2s'; }, 200);
  }

  // ==================== 粒子系统 ====================
  function spawnParticle() {
    if (waterSources.length === 0) return;
    let src = waterSources[Math.floor(Math.random() * waterSources.length)];
    particles.push({
      x: (src.col + 1) * cellSize - cellSize * 0.3,
      y: (src.row + 0.5) * cellSize,
      col: src.col,
      row: src.row,
      vx: 0.8 + Math.random() * 0.4,
      vy: 0,
      life: 1.0,
      size: 2 + Math.random() * 3,
    });
  }

  function updateParticles(dt) {
    // 持续产生粒子
    if (particles.length < 30 && incomePerSec > 0) {
      if (Math.random() < 0.3) spawnParticle();
    }

    for (let i = particles.length-1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.life -= dt * 0.3;

      // 确定当前所在格子
      let nc = Math.floor(p.x / cellSize);
      let nr = Math.floor(p.y / cellSize);
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && wet[nr][nc]) {
        // 根据水渠类型调整方向
        let t = grid[nr][nc];
        if (t === PIPE_V) { p.vx = 0; if (p.vy === 0) p.vy = 0.5 + Math.random()*0.3; }
        else if (t === PIPE_H) { p.vy = 0; if (p.vx === 0) p.vx = 0.5 + Math.random()*0.3; }
        else if (t === PIPE_C) {
          let o = pipeOrient[nr][nc];
          if (o === 0 || o === 1) { if (p.vx < 0.1) p.vx = 0.3+Math.random()*0.3; }
          if (o === 0 || o === 3) { if (p.vy > -0.1) p.vy = -(0.3+Math.random()*0.3); }
          if (o === 1 || o === 2) { if (p.vy < 0.1) p.vy = 0.3+Math.random()*0.3; }
          if (o === 2 || o === 3) { if (p.vx > -0.1) p.vx = -(0.3+Math.random()*0.3); }
        }
      }

      // 到达右边缘或生命耗尽
      if (p.x > canvasW || p.y < 0 || p.y > canvasH || p.life <= 0) {
        particles.splice(i,1);
      }
    }
  }

  // ==================== 渲染 ====================
  function render(ts) {
    ctx.clearRect(0, 0, canvasW, canvasH);

    // 背景
    ctx.fillStyle = '#1e2a3a';
    ctx.fillRect(0, 0, canvasW, canvasH);

    // 网格线
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 0.5;
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r*cellSize);
      ctx.lineTo(canvasW, r*cellSize);
      ctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c*cellSize, 0);
      ctx.lineTo(c*cellSize, canvasH);
      ctx.stroke();
    }

    // 绘制格子
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        let x = c * cellSize;
        let y = r * cellSize;
        let type = grid[r][c];
        let isWet = wet[r][c];

        if (type === OBSTACLE) {
          drawObstacle(x, y);
        } else if (type === SOURCE) {
          drawSource(x, y, ts);
        } else if (type === FARM) {
          drawFarm(x, y, isWet, ts);
        } else if (type === PIPE_H || type === PIPE_V || type === PIPE_C || type === PIPE_X) {
          drawPipe(x, y, type, pipeOrient[r][c], isWet, ts);
        } else if (type === DAM) {
          drawDam(x, y);
        }

        // 湿润高亮
        if (isWet && type !== SOURCE && type !== FARM) {
          let alpha = 0.25 + Math.sin(ts/300 + r + c) * 0.08;
          ctx.fillStyle = `rgba(64,180,255,${alpha})`;
          ctx.fillRect(x+1, y+1, cellSize-2, cellSize-2);
        }
      }
    }

    // 粒子
    ctx.save();
    for (let p of particles) {
      let alpha = p.life * 0.8;
      let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      grad.addColorStop(0, `rgba(180,230,255,${alpha})`);
      grad.addColorStop(0.5, `rgba(80,180,255,${alpha*0.6})`);
      grad.addColorStop(1, `rgba(30,100,255,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // 水源动画覆盖
    waterSources.forEach(s => {
      let x = s.col * cellSize;
      let y = s.row * cellSize;
      drawSourceOverlay(x, y, ts);
    });
  }

  function drawObstacle(x, y) {
    let m = cellSize * 0.12;
    ctx.fillStyle = '#5a4a3a';
    ctx.beginPath();
    ctx.roundRect(x+m, y+m, cellSize-m*2, cellSize-m*2, cellSize*0.2);
    ctx.fill();
    ctx.fillStyle = '#6b5a4a';
    ctx.beginPath();
    ctx.roundRect(x+m*1.5, y+m*1.5, cellSize-m*3, cellSize-m*3, cellSize*0.15);
    ctx.fill();
  }

  function drawSource(x, y, ts) {
    let wave = Math.sin(ts/200) * 0.15;
    let grad = ctx.createLinearGradient(x, y, x+cellSize, y);
    grad.addColorStop(0, '#0a3060');
    grad.addColorStop(0.3, '#0d5090');
    grad.addColorStop(0.7, '#1470c0');
    grad.addColorStop(1, '#2090e0');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, cellSize, cellSize);

    // 波纹
    let cx = x + cellSize/2;
    let cy = y + cellSize/2;
    ctx.strokeStyle = `rgba(150,220,255,${0.4+wave})`;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      let r = cellSize*0.2 + i*cellSize*0.12 + wave*cellSize*0.1;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  function drawSourceOverlay(x, y, ts) {
    let cx = x + cellSize * 0.7;
    let cy = y + cellSize/2;
    for (let i = 0; i < 2; i++) {
      let bubbleY = cy - (ts/500 + i*2) % 1 * cellSize*0.5;
      let alpha = 0.3 + Math.sin(ts/300 + i) * 0.2;
      ctx.fillStyle = `rgba(200,240,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(cx + i*3, bubbleY, cellSize*0.08, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawFarm(x, y, isWet, ts) {
    let m = cellSize * 0.1;
    if (isWet) {
      ctx.fillStyle = '#3a7a30';
      ctx.fillRect(x+m, y+m, cellSize-m*2, cellSize-m*2);
      // 金币闪烁
      let alpha = 0.5 + Math.sin(ts/250) * 0.3;
      ctx.fillStyle = `rgba(240,200,50,${alpha})`;
      ctx.fillRect(x+m, y+m, cellSize-m*2, cellSize-m*2);
      // 金币图标
      ctx.fillStyle = '#f0c040';
      ctx.font = `${cellSize*0.6}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('💰', x+cellSize/2, y+cellSize*0.7);
    } else {
      ctx.fillStyle = '#5a6040';
      ctx.fillRect(x+m, y+m, cellSize-m*2, cellSize-m*2);
      ctx.fillStyle = '#7a8050';
      ctx.font = `${cellSize*0.4}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('🌾', x+cellSize/2, y+cellSize*0.65);
    }
  }

  function drawPipe(x, y, type, orient, isWet, ts) {
    let m = cellSize * 0.15;
    let cx = x + cellSize/2;
    let cy = y + cellSize/2;
    let hw = cellSize*0.28; // 半宽

    ctx.fillStyle = isWet ? '#4a6a8a' : '#5a5a5a';
    ctx.strokeStyle = isWet ? '#6090b0' : '#7a7a7a';
    ctx.lineWidth = 2;

    if (type === PIPE_H) {
      ctx.fillRect(x+m, cy-hw*0.6, cellSize-m*2, hw*1.2);
      ctx.strokeRect(x+m, cy-hw*0.6, cellSize-m*2, hw*1.2);
    } else if (type === PIPE_V) {
      ctx.fillRect(cx-hw*0.6, y+m, hw*1.2, cellSize-m*2);
      ctx.strokeRect(cx-hw*0.6, y+m, hw*1.2, cellSize-m*2);
    } else if (type === PIPE_C) {
      // 弯管
      ctx.save();
      ctx.beginPath();
      let r = cellSize*0.35;
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.clip();
      ctx.fillStyle = isWet ? '#4a6a8a' : '#5a5a5a';
      ctx.fillRect(x+m, y+m, cellSize-m*2, cellSize-m*2);

      // 开口方向标记
      let conn = getConnections(type, orient);
      let dirs = ['上','下','左','右'];
      let marks = [];
      if (conn[0]) marks.push('↑');
      if (conn[1]) marks.push('↓');
      if (conn[2]) marks.push('←');
      if (conn[3]) marks.push('→');
      ctx.fillStyle = isWet ? '#b0d0f0' : '#aaa';
      ctx.font = `${cellSize*0.35}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(marks.join(''), cx, cy+cellSize*0.12);
      ctx.restore();
    } else if (type === PIPE_X) {
      ctx.fillRect(x+m, cy-hw*0.6, cellSize-m*2, hw*1.2);
      ctx.fillRect(cx-hw*0.6, y+m, hw*1.2, cellSize-m*2);
      ctx.strokeRect(x+m, cy-hw*0.6, cellSize-m*2, hw*1.2);
      ctx.strokeRect(cx-hw*0.6, y+m, hw*1.2, cellSize-m*2);
    }
  }

  function drawDam(x, y) {
    let m = cellSize * 0.08;
    ctx.fillStyle = '#6a5a4a';
    ctx.fillRect(x+m, y+m, cellSize-m*2, cellSize-m*2);
    // 砖纹
    ctx.strokeStyle = '#5a4a3a';
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(x+m, y + cellSize*i*0.25);
      ctx.lineTo(x+cellSize-m, y + cellSize*i*0.25);
      ctx.stroke();
    }
    ctx.fillStyle = '#888';
    ctx.font = `${cellSize*0.45}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('🧱', x+cellSize/2, y+cellSize*0.65);
  }

  // ==================== UI更新 ====================
  function updateUI() {
    goldDisplay.textContent = Math.floor(gold);
    incomeDisplay.textContent = '+' + incomePerSec;
  }

  // ==================== 输入处理 ====================
  function getGridPos(clientX, clientY) {
    let rect = canvas.getBoundingClientRect();
    let scX = (clientX - rect.left) * (canvasW / rect.width);
    let scY = (clientY - rect.top) * (canvasH / rect.height);
    let col = Math.floor(scX / cellSize);
    let row = Math.floor(scY / cellSize);
    return { col, row, valid: col>=0 && col<COLS && row>=0 && row<ROWS };
  }

  canvas.addEventListener('click', function(e) {
    let pos = getGridPos(e.clientX, e.clientY);
    if (pos.valid) {
      placeTile(pos.col, pos.row);
    }
  });

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    let touch = e.touches[0];
    let pos = getGridPos(touch.clientX, touch.clientY);
    if (pos.valid) {
      placeTile(pos.col, pos.row);
    }
  }, {passive:false});

  // 工具栏
  toolbar.addEventListener('click', function(e) {
    let btn = e.target.closest('.tool-btn');
    if (!btn) return;
    let tool = btn.dataset.tool;
    selectedTool = tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    if (tool === 'del') {
      hintEl.textContent = '点击水渠可拆除，返还3💰';
    } else {
      let name = btn.textContent.trim().split('\n')[0] || btn.querySelector('.icon').textContent;
      hintEl.textContent = '点击网格放置' + name;
    }
  });

  // ==================== 游戏循环 ====================
  function gameLoop(ts) {
    if (!gameStarted) return;

    let dt = Math.min((ts - animTime) / 1000, 0.1);
    animTime = ts;

    // 金币收入
    if (ts - lastEarnTick >= earnInterval) {
      if (incomePerSec > 0) {
        gold += incomePerSec * (earnInterval / 1000);
        gold = Math.round(gold * 10) / 10;
      }
      lastEarnTick = ts;
      updateUI();
    }

    // 水流更新
    if (ts - lastFlowTick >= flowInterval) {
      updateWaterFlow();
      lastFlowTick = ts;
      updateUI();
    }

    // 粒子更新
    updateParticles(dt);

    // 渲染
    render(ts);

    requestAnimationFrame(gameLoop);
  }

  // ==================== 窗口调整 ====================
  window.addEventListener('resize', () => {
    resizeCanvas();
    updateWaterFlow();
  });

  // ==================== 启动 ====================
  function startGame() {
    resizeCanvas();
    initGrid();
    updateWaterFlow();
    updateUI();
    gameStarted = true;
    animTime = performance.now();
    lastFlowTick = animTime;
    lastEarnTick = animTime;
    hintEl.textContent = '点击网格放置水渠，把水引到农田🌾';
    requestAnimationFrame(gameLoop);
  }

  // 确保DOM加载完毕
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startGame);
  } else {
    startGame();
  }

  console.log('💧 水渠大亨已就绪！');
  console.log('  水源 ← | 障碍 🪨 | 农田 🌾→');
  console.log('  用管道连接水源和农田来赚钱！');
})();
</script>
</body>
