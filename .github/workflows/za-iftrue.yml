name: Import Site from Issue

# 站长在提交网站的 Issue 里评论 /confirm（或 /ok）后，自动把 Issue 中的 JSON 合并进 site.json 并部署。
# 仅仓库拥有者/协作者的评论生效，其他人评论会被拒绝。

"on":
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  import:
    if: true
    runs-on: ubuntu-latest
    steps:
      - name: 校验评论者权限
        id: perm
        run: |
          LOGIN="${{ github.event.comment.user.login }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$LOGIN" = "$OWNER" ]; then
            echo "has_perm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators/$LOGIN")
          if [ "$CODE" = "204" ]; then
            echo "has_perm=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_perm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 拒绝无权限评论
        if: steps.perm.outputs.has_perm != 'true'
        run: |
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d '{"body":"🚫 仅仓库拥有者/协作者可以通过 `/confirm` 收录站点。"}'
          exit 1

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 解析并写入 site.json
        id: import
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/import-issue.js

      - name: 同步页面数据
        run: node scripts/sync.js

      - name: 提交并推送
        run: |
          git config user.name "astras-bot"
          git config user.email "bot@astras.cc"
          git add site.json index.html README.md
          git commit -m "feat: import site from issue #${{ github.event.issue.number }}" || echo "nothing to commit"
          git push

      - name: 回帖成功并关闭 Issue
        run: |
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d '{"body":"✅ 已收录 **${{ steps.import.outputs.IMPORTED_NAME }}** 并部署上线，感谢提交！"}'
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" \
            -d '{"state":"closed"}'
