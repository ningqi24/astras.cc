<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>鲨鲨幸存者</title>
<style>
:root{--bg:#0a0a14;--panel:#141428;--gold:#f0c040;--danger:#ff4050;--accent:#40b8ff;--text:#d0d8e8;--xp:#40e080;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'PingFang SC','Heiti SC',sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#gc{display:block;position:fixed;top:0;left:0;width:100%;height:100%}

/* ====== 顶部 HUD 条 ====== */
.hud-bar{position:fixed;top:max(4px,var(--safe-top));left:max(8px,var(--safe-left));right:max(8px,var(--safe-right));display:flex;align-items:center;justify-content:space-between;gap:6px;z-index:10;pointer-events:none}
.hud-left{display:flex;align-items:center;gap:6px}
.hud-center{display:flex;flex-direction:column;align-items:center;flex:1;max-width:280px;margin:0 auto}
.hud-right{display:flex;align-items:center;gap:6px}
.hud-item{background:rgba(10,10,24,0.85);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--text);display:flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap}
.hud-val{font-size:13px}
.hud-gold{color:var(--gold)}.hud-accent{color:var(--accent)}.hud-danger{color:var(--danger)}.hud-xp{color:var(--xp)}
.hud-icon{width:14px;height:14px;flex-shrink:0}

/* XP 条 + 等级 */
.xp-bar-wrap{width:100%;height:5px;background:rgba(10,10,24,0.8);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,0.06)}
.xp-bar{height:100%;background:linear-gradient(90deg,#40e080,#40b8ff);border-radius:2px;transition:width 0.2s;width:0}
.level-tag{font-size:9px;color:var(--accent);font-weight:900;text-shadow:0 0 6px rgba(64,184,255,0.5);margin-top:1px;white-space:nowrap}

/* BOSS HP */
.boss-indicator{position:fixed;top:max(50px,calc(44px + var(--safe-top)));left:50%;transform:translateX(-50%);z-index:10;display:none;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.boss-indicator.show{display:flex}
.boss-name-tag{font-size:10px;color:var(--danger);font-weight:700;text-shadow:0 0 6px rgba(255,64,80,0.6)}
.boss-hp-bar{width:180px;height:6px;background:rgba(0,0,0,0.6);border-radius:3px;overflow:hidden}
.boss-hp-fill{height:100%;background:linear-gradient(90deg,#ff4050,#ff8040);border-radius:3px;width:0;transition:width 0.3s}

/* 潮汐通知 */
.tide-alert{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;opacity:0;transition:opacity 0.3s}
.tide-alert.show{opacity:1}
.tide-text{font-size:28px;font-weight:900;color:#ff6644;text-shadow:0 0 20px rgba(255,100,60,0.8),0 0 60px rgba(255,60,20,0.5);letter-spacing:6px;animation:tidePulse 0.6s ease-in-out infinite alternate}
.tide-sub{font-size:13px;color:#ffaa88;text-align:center;margin-top:4px;text-shadow:0 0 10px rgba(255,100,60,0.5)}
@keyframes tidePulse{0%{transform:scale(1);text-shadow:0 0 20px rgba(255,100,60,0.8),0 0 60px rgba(255,60,20,0.5)}100%{transform:scale(1.08);text-shadow:0 0 30px rgba(255,100,60,1),0 0 80px rgba(255,60,20,0.7)}}

/* 暂停按钮 */
.pause-btn{position:fixed;top:max(4px,var(--safe-top));right:max(8px,var(--safe-right));z-index:11;background:rgba(10,10,24,0.8);color:var(--text);border:1px solid rgba(255,255,255,0.12);border-radius:7px;padding:5px 10px;font-size:10px;cursor:pointer;display:flex;align-items:center;gap:3px;pointer-events:auto}

/* 摇杆 */
.joystick-zone{position:fixed;bottom:18%;left:50%;transform:translateX(-50%);width:100px;height:100px;z-index:10}
.joystick-base{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1)}
.joystick-thumb{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.2);position:absolute;top:30px;left:30px;transition:transform 0.03s}

/* 小地图 */
.minimap{position:fixed;bottom:max(14px,var(--safe-bottom));right:max(8px,var(--safe-right));width:64px;height:46px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.12);border-radius:6px;z-index:10;pointer-events:none}

/* 升级弹窗 */
.levelup-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.72);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.levelup-overlay.show{display:flex}
.levelup-title{color:var(--gold);font-size:20px;font-weight:900;margin-bottom:2px;text-shadow:0 0 16px rgba(240,192,64,0.5);display:flex;align-items:center;gap:5px}
.levelup-sub{color:#889;font-size:11px;margin-bottom:12px}
.levelup-cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px;padding:0 8px}
.levelup-card{background:var(--panel);border:2px solid rgba(255,255,255,0.08);border-radius:12px;width:90px;padding:10px 6px;text-align:center;cursor:pointer;transition:0.15s;-webkit-tap-highlight-color:transparent}
.levelup-card:active{transform:scale(0.93);border-color:var(--accent)}
.levelup-card .card-icon{display:flex;justify-content:center;align-items:center;height:28px;margin-bottom:3px}
.levelup-card .card-icon svg{width:24px;height:24px}
.levelup-card .card-name{color:var(--text);font-size:10px;font-weight:700;margin-bottom:1px}
.levelup-card .card-type{font-size:8px;color:#889;margin-bottom:2px}
.levelup-card .card-desc{font-size:8px;color:#aaa;line-height:1.2}
.levelup-card .card-rank{color:var(--accent);font-size:9px;font-weight:700;margin-top:3px}

/* 游戏结束 */
.gameover-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.78);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.gameover-overlay.show{display:flex}
.go-panel{background:var(--panel);border-radius:16px;padding:24px 18px;text-align:center;max-width:280px;width:85%}
.go-icon{margin-bottom:6px}
.go-icon svg{width:36px;height:36px}
.go-panel h2{font-size:22px;margin-bottom:4px}
.go-win{color:var(--gold)}.go-lose{color:var(--danger)}
.go-panel .score{color:var(--accent);font-size:32px;font-weight:900;margin:4px 0}
.go-panel .stat{color:var(--text);font-size:11px;margin:2px 0}
.go-panel button{background:var(--accent);color:#000;border:none;padding:10px 32px;border-radius:20px;font-size:15px;font-weight:700;margin-top:12px;cursor:pointer}
.go-panel button:active{transform:scale(0.94)}

/* ====== 横屏优化 ====== */
@media (orientation:landscape){
  .hud-bar{top:max(2px,var(--safe-top));left:max(10px,var(--safe-left));right:max(10px,var(--safe-right));gap:8px}
  .hud-item{padding:4px 10px;font-size:12px;gap:5px}
  .hud-val{font-size:15px}
  .hud-icon{width:16px;height:16px}
  .hud-center{max-width:360px}
  .xp-bar-wrap{height:6px}
  .level-tag{font-size:10px}
  .joystick-zone{width:120px;height:120px}
  .joystick-thumb{width:46px;height:46px;top:37px;left:37px}
  .minimap{width:76px;height:54px;bottom:max(12px,var(--safe-bottom));right:max(12px,var(--safe-right));border-radius:7px}
  .pause-btn{padding:6px 14px;font-size:11px;top:max(2px,var(--safe-top))}
  .levelup-card{width:105px;padding:12px 8px;border-radius:14px}
  .levelup-card .card-icon{height:32px}
  .levelup-card .card-icon svg{width:28px;height:28px}
  .levelup-card .card-name{font-size:11px}
  .levelup-card .card-type{font-size:9px}
  .levelup-card .card-desc{font-size:9px}
  .levelup-title{font-size:24px}
  .levelup-sub{font-size:12px}
  .boss-indicator{top:max(52px,calc(46px + var(--safe-top)))}
  .boss-hp-bar{width:240px;height:8px}
  .boss-name-tag{font-size:11px}
}
@media (min-width:768px){
  .levelup-cards{max-width:500px;gap:12px}
  .levelup-card{width:120px}
  .joystick-zone{width:130px;height:130px}
}
</style>
</head>
<body>
<canvas id="gc"></canvas>

<!-- 潮汐通知 -->
<div class="tide-alert" id="tideAlert">
  <div class="tide-text">潮 流 来 袭 ！</div>
  <div class="tide-sub">怪物数量激增</div>
</div>

<!-- HUD -->
<div class="hud-bar">
  <div class="hud-left">
    <div class="hud-item">
      <svg class="hud-icon" viewBox="0 0 16 16"><path d="M8 2C5.2 2 3 4.7 3 7.5c0 3 4 6.5 5 6.5s5-3.5 5-6.5C13 4.7 10.8 2 8 2z" fill="#ff4050"/></svg>
      <span class="hud-val hud-danger" id="hp">100</span>
    </div>
    <div class="hud-item">
      <svg class="hud-icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#40b8ff" stroke-width="2"/><line x1="8" y1="4" x2="8" y2="8" stroke="#40b8ff" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="8" x2="11" y2="10" stroke="#40b8ff" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="hud-val hud-accent" id="timer">8:00</span>
    </div>
  </div>
  <div class="hud-center">
    <div class="xp-bar-wrap"><div class="xp-bar" id="xpBar"></div></div>
    <div class="level-tag" id="levelTag">Lv.1</div>
  </div>
  <div class="hud-right">
    <div class="hud-item">
      <svg class="hud-icon" viewBox="0 0 16 16"><path d="M2 4l4-2v12l-4-2V4zM6 2l4 2v10l-4-2V2zM10 4l4-2v12l-4-2V4z" fill="#d0d8e8"/></svg>
      <span class="hud-val" id="kills">0</span>
    </div>
    <div class="hud-item">
      <svg class="hud-icon" viewBox="0 0 16 16"><polygon points="8,1 10,6 15,6 11,9 13,14 8,11 3,14 5,9 1,6 6,6" fill="#f0c040"/></svg>
      <span class="hud-val hud-gold" id="gem">0</span>
    </div>
  </div>
</div>

<!-- BOSS HP -->
<div class="boss-indicator" id="bossIndicator">
  <div class="boss-name-tag" id="bossNameTag"></div>
  <div class="boss-hp-bar"><div class="boss-hp-fill" id="bossHpFill"></div></div>
</div>

<button class="pause-btn" id="pauseBtn" onclick="togglePause()">
  <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="3" height="10" rx="1" fill="#d0d8e8"/><rect x="8" y="1" width="3" height="10" rx="1" fill="#d0d8e8"/></svg>
</button>

<div class="levelup-overlay" id="levelupOverlay">
  <div class="levelup-title">
    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 4l-8 12h16z" fill="#f0c040"/><rect x="11" y="10" width="2" height="8" fill="#f0c040"/></svg>
    升级! Lv.<span id="luLevel"></span>
  </div>
  <div class="levelup-sub">选择一个技能</div>
  <div class="levelup-cards" id="levelupCards"></div>
</div>

<div class="gameover-overlay" id="gameoverOverlay">
  <div class="go-panel">
    <div class="go-icon" id="goIcon"></div>
    <h2 id="goTitle"></h2>
    <div class="score" id="goScore"></div>
    <div class="stat" id="goStats"></div>
    <button onclick="restartGame()">再来一局</button>
  </div>
</div>

<div class="joystick-zone" id="joystickZone">
  <div class="joystick-base"><div class="joystick-thumb" id="joystickThumb"></div></div>
</div>
<canvas class="minimap" id="minimap" width="128" height="92"></canvas>

<script>
(function(){
const canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
const mmCanvas=document.getElementById('minimap'),mmCtx=mmCanvas.getContext('2d');
const xpBar=document.getElementById('xpBar'),levelTag=document.getElementById('levelTag');
const levelupOverlay=document.getElementById('levelupOverlay'),levelupCards=document.getElementById('levelupCards');
const luLevel=document.getElementById('luLevel');
const gameoverOverlay=document.getElementById('gameoverOverlay');
const goTitle=document.getElementById('goTitle'),goScore=document.getElementById('goScore'),goStats=document.getElementById('goStats');
const goIcon=document.getElementById('goIcon');
const bossIndicator=document.getElementById('bossIndicator'),bossHpFill=document.getElementById('bossHpFill'),bossNameTag=document.getElementById('bossNameTag');
const joystickZone=document.getElementById('joystickZone'),joystickThumb=document.getElementById('joystickThumb');
const pauseBtn=document.getElementById('pauseBtn');
const tideAlert=document.getElementById('tideAlert');

let W,H,dpr=1,gameState='playing',gameTime=480,isLandscape=true;
let player,monsters=[],bullets=[],particles=[],effects=[],xpOrbs=[],gems=[];
let boss=null,spawnTimer=0,spawnInterval=1.2,difficulty=1;
let killCount=0,gemCount=0,bossDefeated=0;
let bossSpawnTimes=[360,240,120];
let tideWaveTimes=[420,300,180],tideTriggered=0,tideActive=false,tideTimer=0;
let camX=0,camY=0,joystickActive=false,joyCX=0,joyCY=0,joyDX=0,joyDY=0;

player={x:800,y:600,r:14,speed:200,hp:100,maxHp:100,level:1,xp:0,xpToNext:30,skills:[],atkBonus:1,spdBonus:1,cdBonus:0,pickupBonus:0,hpBonus:0,xpBonus:0,_atkTimers:{},_bladeAngle:0,invulnTimer:0};
const MAP_W=1600,MAP_H=1200;

const icons={
  missile:'<svg viewBox="0 0 24 24"><path d="M20 4l-2 14-6-6-6 6L4 4z" fill="#ffe066"/><circle cx="5" cy="5" r="3" fill="#ff9933"/><path d="M20 4l-4 1 3 3z" fill="#ffcc44"/></svg>',
  blade:'<svg viewBox="0 0 24 24"><path d="M12 2C9 10 18 14 22 12C18 10 15 4 12 2z" fill="#ddeeff" stroke="#6699bb" stroke-width="1"/><circle cx="12" cy="6" r="2" fill="#fff"/></svg>',
  lightning:'<svg viewBox="0 0 24 24"><polygon points="14,2 4,14 11,14 9,22 20,10 13,10" fill="#88ccff"/></svg>',

  iceShard:'<svg viewBox="0 0 24 24"><polygon points="12,2 16,8 22,8 17,13 19,20 12,16 5,20 7,13 2,8 8,8" fill="#aaddff" stroke="#fff" stroke-width="0.5"/></svg>',
  laser:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="#fff"/><line x1="12" y1="2" x2="12" y2="8" stroke="#ff44aa" stroke-width="3" stroke-linecap="round"/><line x1="12" y1="16" x2="12" y2="22" stroke="#ff44aa" stroke-width="3" stroke-linecap="round"/><line x1="2" y1="12" x2="8" y2="12" stroke="#ff44aa" stroke-width="3" stroke-linecap="round"/><line x1="16" y1="12" x2="22" y2="12" stroke="#ff44aa" stroke-width="3" stroke-linecap="round"/></svg>',
  poison:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6" fill="#66ee44"/><path d="M8 14l-2 4h12l-2-4" fill="#66ee44"/><circle cx="9" cy="6" r="1.5" fill="#003300"/><circle cx="15" cy="6" r="1.5" fill="#003300"/><path d="M10 10h4v1h-4z" fill="#003300"/></svg>',
  missileStorm:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#ff6633"/><path d="M8 8l3 3M16 16l-3-3M16 8l-3 3M8 16l3-3" stroke="#ffe066" stroke-width="2" stroke-linecap="round"/></svg>',
  earthSpike:'<svg viewBox="0 0 24 24"><polygon points="12,2 16,10 22,12 16,14 12,22 8,14 2,12 8,10" fill="#ccaa66"/><polygon points="12,6 14,10 18,12 14,14 12,18 10,14 6,12 10,10" fill="#ddcc88"/></svg>',
  atkUp:'<svg viewBox="0 0 24 24"><path d="M6 2l14 10-6 2-4 8-2-14z" fill="#ff6644"/><path d="M8 4l10 7-4 1.5L11 20 9 9z" fill="#ffaa88"/></svg>',
  spdUp:'<svg viewBox="0 0 24 24"><path d="M4 12C4 8 8 4 12 4s8 4 8 8" fill="none" stroke="#aaddff" stroke-width="2.5" stroke-linecap="round"/><path d="M18 12l-3-4M18 12l3-4" stroke="#aaddff" stroke-width="2" stroke-linecap="round"/></svg>',
  cdDown:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="#ccaaff" stroke-width="2"/><line x1="12" y1="7" x2="12" y2="12" stroke="#ccaaff" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="12" x2="15" y2="15" stroke="#ccaaff" stroke-width="2" stroke-linecap="round"/></svg>',
  pickupUp:'<svg viewBox="0 0 24 24"><path d="M5 5h14L17 2H7z" fill="#ff8888"/><path d="M5 7h14v2H5zM7 9v10c0 1.5 4 3 5 3s5-1.5 5-3V9H7z" fill="#ff4444"/></svg>',
  hpUp:'<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ff4050"/></svg>',
  xpUp:'<svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" fill="#f0c040"/></svg>',
  armor:'<svg viewBox="0 0 24 24"><path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z" fill="#8899aa" stroke="#aabbcc" stroke-width="1"/><path d="M15 10l-4 4-2-2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  regen:'<svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="20" rx="2" fill="#44dd66"/><rect x="2" y="8" width="20" height="8" rx="2" fill="#44dd66"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg>',
  win:'<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke="#f0c040" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="10" fill="none" stroke="#f0c040" stroke-width="2"/></svg>',
  lose:'<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="#ff4050"/><path d="M8 14l-1 4h10l-1-4" fill="#ff4050"/><circle cx="9" cy="5" r="1" fill="#440000"/><circle cx="15" cy="5" r="1" fill="#440000"/><line x1="7" y1="18" x2="5" y2="22" stroke="#ff4050" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="18" x2="19" y2="22" stroke="#ff4050" stroke-width="2" stroke-linecap="round"/></svg>',
};

const activeSkills=[
  {id:'missile',name:'追踪飞弹',icon:icons.missile,desc:'自动追踪最近敌人',cd:0.7,dmg:12,count:1,proj:'missile',splash:0},
  {id:'blade',name:'环绕刃',icon:icons.blade,desc:'环绕玩家的刀刃',cd:0,dmg:18,count:2,proj:'blade',splash:0},
  {id:'lightning',name:'闪电链',icon:icons.lightning,desc:'连锁闪电溅射',cd:1.5,dmg:22,count:1,proj:'lightning',splash:3},
  {id:'fireAura',name:'火焰光环',icon:icons.fireAura,desc:'周期性灼烧周围',cd:0.8,dmg:10,count:1,proj:'aura',splash:0},
  {id:'iceShard',name:'冰锥散射',icon:icons.iceShard,desc:'多方向发射冰锥',cd:0.9,dmg:8,count:4,proj:'ice',splash:0},
  {id:'laser',name:'激光扫射',icon:icons.laser,desc:'穿透直线激光',cd:2.0,dmg:35,count:1,proj:'laser',splash:0},
  {id:'poison',name:'毒雾弥漫',icon:icons.poison,desc:'地面毒雾持续伤害',cd:3.0,dmg:6,count:1,proj:'poison',splash:0},
  {id:'missileStorm',name:'飞弹风暴',icon:icons.missileStorm,desc:'多发追踪飞弹',cd:1.2,dmg:8,count:5,proj:'missile',splash:0},
  {id:'earthSpike',name:'地刺突袭',icon:icons.earthSpike,desc:'随机位置地刺',cd:1.8,dmg:28,count:3,proj:'spike',splash:0},
];
const passiveSkills=[

function getSkillLevel(id){for(let s of player.skills)if(s.id===id)return s.level;return 0}
function addOrUpgradeSkill(id){
  for(let s of player.skills){if(s.id===id){s.level=Math.min(s.level+1,5);return s}}
  let def=activeSkills.find(a=>a.id===id)||passiveSkills.find(p=>p.id===id);
  player.skills.push({id:def.id,name:def.name,type:activeSkills.find(a=>a.id===id)?'active':'passive',level:1,desc:def.desc,icon:def.icon});
  return player.skills[player.skills.length-1];
}
function applyPassive(def,level){let v=def.value;switch(def.effect){case'atk':player.atkBonus+=v;break;case'spd':player.spdBonus+=v;break;case'cd':player.cdBonus+=v;break;case'pickup':player.pickupBonus+=v;break;case'hp':player.maxHp+=v;player.hp=Math.min(player.hp+v,player.maxHp);player.hpBonus+=v;break;case'xp':player.xpBonus+=v;break}}
function calcAtkDmg(base){return base*player.atkBonus}
function calcCooldown(base){return base*(1-Math.min(player.cdBonus,0.6))}
function genLevelupChoices(){
  let activeCount=player.skills.filter(s=>s.type==='active').length,passiveCount=player.skills.filter(s=>s.type==='passive').length,pool=[];
  if(activeCount<6)for(let a of activeSkills)if(getSkillLevel(a.id)<5)pool.push({...a,type:'active'});
  if(passiveCount<6)for(let p of passiveSkills)if(getSkillLevel(p.id)<5)pool.push({...p,type:'passive'});
  if(!pool.length){for(let a of activeSkills)if(getSkillLevel(a.id)<5)pool.push({...a,type:'active'});for(let p of passiveSkills)if(getSkillLevel(p.id)<5)pool.push({...p,type:'passive'})}
  let chosen=[],copy=[...pool];for(let i=0;i<3&&copy.length;i++)chosen.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
  return chosen;
}

function spawnMonster(){
  if(monsters.length>80)return;
  let edge=Math.floor(Math.random()*4),x,y;
  if(edge===0){x=-30;y=Math.random()*MAP_H}else if(edge===1){x=MAP_W+30;y=Math.random()*MAP_H}else if(edge===2){x=Math.random()*MAP_W;y=-30}else{x=Math.random()*MAP_W;y=MAP_H+30}
  let weights=[0.5,0.25,0.15,0.1];if(difficulty>3)weights=[0.25,0.25,0.3,0.2];if(difficulty>5)weights=[0.15,0.2,0.35,0.3];
  let r=Math.random(),cum=0,ti=0;for(let i=0;i<weights.length;i++){cum+=weights[i];if(r<cum){ti=i;break}}
  let mt=monsterTypes[ti];
  monsters.push({x,y,r:mt.r,hp:Math.floor(mt.hp*(1+(difficulty-1)*0.3)),maxHp:mt.hp,speed:Math.min(mt.speed*(1+(difficulty-1)*0.1),180),dmg:mt.dmg,color:mt.color,name:mt.name,xp:mt.xp,gem:mt.gem,type:mt.type,shoots:!!mt.shoots,shootTimer:0,knockbackX:0,knockbackY:0});
}
function spawnBoss(){
  if(boss||bossDefeated>=3)return;
  let bt=bossTypes[bossDefeated],edge=Math.floor(Math.random()*4),x,y;
  if(edge===0){x=-50;y=MAP_H/2}else if(edge===1){x=MAP_W+50;y=MAP_H/2}else if(edge===2){x=MAP_W/2;y=-50}else{x=MAP_W/2;y=MAP_H+50}
  boss={x,y,r:bt.r,hp:bt.hp,maxHp:bt.hp,speed:bt.speed,dmg:bt.dmg,color:bt.color,name:bt.name,xp:bt.xp,gem:bt.gem,type:bt.type,knockbackX:0,knockbackY:0,timer:0};
  bossIndicator.classList.add('show');bossNameTag.textContent=bt.name;
}
function skillAttack(def,lv){
  let cd=calcCooldown(def.cd),dmg=calcAtkDmg(def.dmg*(1+(lv-1)*0.3)),count=def.count+(lv-1);
  switch(def.proj){
    case'missile':if(monsters.length||boss)for(let i=0;i<count;i++){let t=boss&&Math.random()<0.6?boss:monsters[Math.floor(Math.random()*monsters.length)]||{x:player.x+100,y:player.y},a=Math.atan2(t.y-player.y,t.x-player.x)+((Math.random()-0.5)*0.4);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*350,vy:Math.sin(a)*350,dmg,life:3,color:'#ffe066',r:5,type:'missile'});}break;
    case'lightning':if(monsters.length||boss){let lt=monsters[Math.floor(Math.random()*monsters.length)]||{x:player.x+100,y:player.y};bullets.push({x:player.x,y:player.y,tx:lt.x,ty:lt.y,dmg,life:0.2,color:'#88ccff',r:3,type:'lightning',chain:def.splash+lv-1});}break;
    case'aura':effects.push({x:player.x,y:player.y,r:120*(1+(lv-1)*0.3),dmg,life:0.4,color:'#ff6622',type:'aura'});break;
    case'ice':for(let i=0;i<count;i++){let a=(Math.PI*2/count)*i+Date.now()*0.001;bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,dmg,life:2,color:'#aaddff',r:4,type:'ice'});}break;
    case'laser':let la=Math.atan2(((monsters[0]||{}).y||player.y)-player.y,((monsters[0]||{}).x||player.x+100)-player.x);for(let i=0;i<3;i++)bullets.push({x:player.x,y:player.y,vx:Math.cos(la+(i-1)*0.2)*500,vy:Math.sin(la+(i-1)*0.2)*500,dmg,life:1.2,color:'#ff44aa',r:3,type:'laser',pierce:true});break;
    case'poison':for(let i=0;i<3;i++)effects.push({x:player.x+(Math.random()-0.5)*80,y:player.y+(Math.random()-0.5)*80,r:60+lv*10,dmg:dmg*0.3,life:3+lv,color:'#66ee44',type:'poisonField'});break;
    case'spike':for(let i=0;i<count;i++)effects.push({x:player.x+(Math.random()-0.5)*300,y:player.y+(Math.random()-0.5)*300,r:30,dmg,life:0.5,color:'#ccaa66',type:'spike'});break;
  }
}

function drawBlade(x,y,a,r){ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);let g=ctx.createLinearGradient(0,-r*1.2,0,r*0.3);g.addColorStop(0,'#ffffff');g.addColorStop(0.2,'#ddeeff');g.addColorStop(1,'#6699bb');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-r*1.2);ctx.bezierCurveTo(r*0.4,-r*0.8,r*0.5,r*0.2,0,r*0.5);ctx.bezierCurveTo(-r*0.5,r*0.2,-r*0.4,-r*0.8,0,-r*1.2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.stroke();ctx.restore();}
function drawXpOrb(x,y){let s=3+Math.sin(Date.now()*0.01+x)*0.5;ctx.save();ctx.translate(x,y);ctx.rotate(Date.now()*0.002);let g=ctx.createRadialGradient(0,0,s*0.5,0,0,s*2);g.addColorStop(0,'#ffffff');g.addColorStop(0.4,'#40e080');g.addColorStop(1,'rgba(64,224,128,0)');ctx.fillStyle=g;ctx.beginPath();for(let i=0;i<5;i++){let a=Math.PI*2/5*i-Math.PI/2,ax=Math.cos(a)*s*2,ay=Math.sin(a)*s*2,bx=Math.cos(a+Math.PI/5)*s,by=Math.sin(a+Math.PI/5)*s;if(i===0)ctx.moveTo(ax,ay);else ctx.lineTo(ax,ay);ctx.lineTo(bx,by);}ctx.closePath();ctx.fill();ctx.restore();}
function drawGem(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);let g=ctx.createLinearGradient(-4,-4,4,4);g.addColorStop(0,'#fff8c0');g.addColorStop(0.3,'#f0c040');g.addColorStop(1,'#b08020');ctx.fillStyle=g;ctx.fillRect(-4,-4,8,8);ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=0.8;ctx.strokeRect(-4,-4,8,8);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.moveTo(-2,-4);ctx.lineTo(2,-4);ctx.lineTo(-4,2);ctx.lineTo(-4,-2);ctx.fill();ctx.restore();}
function drawSpike(x,y,r){ctx.save();ctx.translate(x,y);let s=r/30;ctx.fillStyle='#998866';ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(s*6,-s*8);ctx.lineTo(s*12,-r*0.5);ctx.lineTo(s*8,s*3);ctx.lineTo(0,r);ctx.lineTo(-s*8,s*3);ctx.lineTo(-s*12,-r*0.5);ctx.lineTo(-s*6,-s*8);ctx.fill();ctx.fillStyle='#bba988';ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(s*3,-s*6);ctx.lineTo(-s*3,-s*6);ctx.fill();ctx.restore();}

function initGame(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);
  mmCanvas.width=128;mmCanvas.height=92;
  gameState='playing';gameTime=480;player.x=MAP_W/2;player.y=MAP_H/2;player.hp=100;player.maxHp=100;player.level=1;player.xp=0;player.xpToNext=30;
  player.skills=[{id:'missile',name:'追踪飞弹',type:'active',level:1,desc:'自动追踪最近敌人',icon:icons.missile}];
  player.atkBonus=1;player.spdBonus=1;player.cdBonus=0;player.pickupBonus=0;player.hpBonus=0;player.xpBonus=0;player._atkTimers={};player._bladeAngle=0;player.invulnTimer=0;
  monsters=[];bullets=[];particles=[];effects=[];xpOrbs=[];gems=[];boss=null;spawnTimer=0;difficulty=1;killCount=0;gemCount=0;bossDefeated=0;tideTriggered=0;tideActive=false;tideTimer=0;
  bossIndicator.classList.remove('show');joyDX=0;joyDY=0;
  levelupOverlay.classList.remove('show');gameoverOverlay.classList.remove('show');
  pauseBtn.innerHTML='<svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="3" height="10" rx="1" fill="#d0d8e8"/><rect x="8" y="1" width="3" height="10" rx="1" fill="#d0d8e8"/></svg>';
  updateUI();
}
function updateUI(){
  document.getElementById('hp').textContent=Math.ceil(player.hp);document.getElementById('kills').textContent=killCount;document.getElementById('gem').textContent=gemCount;
  let m=Math.floor(gameTime/60),s=Math.floor(gameTime%60);document.getElementById('timer').textContent=m+':'+String(s).padStart(2,'0');
  xpBar.style.width=(player.xp/player.xpToNext*100)+'%';levelTag.textContent='Lv.'+player.level;
  if(boss){bossHpFill.style.width=(boss.hp/boss.maxHp*100)+'%';bossNameTag.textContent=boss.name;}
}
function gameOver(win){
  gameState='gameover';
  goIcon.innerHTML=win?icons.win:icons.lose;
  goTitle.textContent=win?'成功幸存！':'你阵亡了';
  goTitle.className=win?'go-win':'go-lose';
  let m=Math.floor((480-gameTime)/60),s=Math.floor((480-gameTime)%60);
  goScore.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  goStats.textContent='击杀: '+killCount+' | 等级: '+player.level+' | 宝石: '+gemCount;
  gameoverOverlay.classList.add('show');
}
function togglePause(){
  if(gameState==='playing'){gameState='paused';pauseBtn.innerHTML='<svg width="12" height="12" viewBox="0 0 12 12"><polygon points="2,1 11,6 2,11" fill="#d0d8e8"/></svg>'}
  else if(gameState==='paused'){gameState='playing';pauseBtn.innerHTML='<svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="3" height="10" rx="1" fill="#d0d8e8"/><rect x="8" y="1" width="3" height="10" rx="1" fill="#d0d8e8"/></svg>'}
}
function showTideAlert(){tideAlert.classList.add('show');setTimeout(()=>tideAlert.classList.remove('show'),2500);}
function restartGame(){initGame();lastT=performance.now();requestAnimationFrame(loop)}
function damageTarget(target,dmg){target.hp-=dmg;for(let i=0;i<3;i++)particles.push({x:target.x,y:target.y,vx:(Math.random()-0.5)*120,vy:(Math.random()-0.5)*120,life:0.3,color:'#fff'});if(target.hp<=0)killTarget(target);}
function killTarget(target){
  let xpVal=target.xp*(1+player.xpBonus);for(let i=0;i<Math.ceil(xpVal/5);i++)xpOrbs.push({x:target.x+(Math.random()-0.5)*20,y:target.y+(Math.random()-0.5)*20,vx:(Math.random()-0.5)*60,vy:(Math.random()-0.5)*60,life:15,value:5});
  if(target.gem>0)for(let i=0;i<target.gem;i++)gems.push({x:target.x+(Math.random()-0.5)*20,y:target.y+(Math.random()-0.5)*20});
  for(let i=0;i<8;i++)particles.push({x:target.x,y:target.y,vx:(Math.random()-0.5)*200,vy:(Math.random()-0.5)*200,life:0.5,color:target.color});
}
function gainXp(amount){player.xp+=amount;while(player.xp>=player.xpToNext&&gameState==='playing'){player.xp-=player.xpToNext;player.level++;player.xpToNext=Math.floor(player.xpToNext*1.25);showLevelup();}updateUI();}
function showLevelup(){
  gameState='levelup';luLevel.textContent=player.level;
  let choices=genLevelupChoices();levelupCards.innerHTML='';
  for(let c of choices){let lv=getSkillLevel(c.id),card=document.createElement('div');card.className='levelup-card';
    card.innerHTML=`<div class="card-icon">${c.icon}</div><div class="card-name">${c.name}</div><div class="card-type">${c.type==='active'?'主动':'被动'}</div><div class="card-desc">${c.desc}</div><div class="card-rank">${lv>0?'Lv.'+(lv+1):'新技能'}</div>`;
    card.onclick=()=>{let def=activeSkills.find(a=>a.id===c.id)||passiveSkills.find(p=>p.id===c.id);addOrUpgradeSkill(c.id);if(def&&(!activeSkills.find(a=>a.id===c.id)))applyPassive(def,getSkillLevel(c.id));levelupOverlay.classList.remove('show');gameState='playing';updateUI();};
    levelupCards.appendChild(card);}
  levelupOverlay.classList.add('show');
}

function update(dt){
  if(gameState!=='playing')return;
  gameTime-=dt;if(gameTime<=0){gameOver(true);return}
  let elapsed=480-gameTime;difficulty=Math.floor(elapsed/60)+1;
  if(!boss)for(let i=0;i<bossSpawnTimes.length;i++)if(gameTime<=bossSpawnTimes[i]&&bossDefeated===i){spawnBoss();break}
  for(let i=tideTriggered;i<tideWaveTimes.length;i++)if(gameTime<=tideWaveTimes[i]){tideActive=true;tideTimer=12;tideTriggered=i+1;showTideAlert();break}
  if(tideActive){tideTimer-=dt;if(tideTimer<=0)tideActive=false;}
  spawnTimer+=dt;let si=Math.max(0.4,spawnInterval*(1-difficulty*0.08));if(tideActive)si*=0.5;if(spawnTimer>=si){spawnTimer=0;spawnMonster();if(Math.random()<0.3)spawnMonster();if(tideActive)spawnMonster();}
  if(joyDX!==0||joyDY!==0){let mag=Math.hypot(joyDX,joyDY);player.x+=joyDX/mag*player.speed*player.spdBonus*dt;player.y+=joyDY/mag*player.speed*player.spdBonus*dt;}
  player.x=Math.max(player.r,Math.min(MAP_W-player.r,player.x));player.y=Math.max(player.r,Math.min(MAP_H-player.r,player.y));
  if(player.invulnTimer>0)player.invulnTimer-=dt;
  for(let sk of player.skills){if(sk.type!=='active')continue;let def=activeSkills.find(a=>a.id===sk.id);if(!def)continue;player._atkTimers[sk.id]=player._atkTimers[sk.id]||0;player._atkTimers[sk.id]+=dt;let cd=calcCooldown(def.cd);if(player._atkTimers[sk.id]>=cd){player._atkTimers[sk.id]-=cd;skillAttack(def,sk.level);}}
  for(let sk of player.skills)if(sk.id==='blade'){player._bladeAngle=(player._bladeAngle||0)+dt*3;let def=activeSkills.find(a=>a.id==='blade'),count=def.count+(sk.level-1),dmg=calcAtkDmg(def.dmg*(1+(sk.level-1)*0.3));for(let i=0;i<count;i++){let a=player._bladeAngle+(Math.PI*2/count)*i,bx=player.x+Math.cos(a)*50,by=player.y+Math.sin(a)*50;for(let m of monsters)if(Math.hypot(m.x-bx,m.y-by)<m.r+12)damageTarget(m,dmg*dt);if(boss&&Math.hypot(boss.x-bx,boss.y-by)<boss.r+12)damageTarget(boss,dmg*dt);}}
  for(let sk of player.skills)if(sk.id==='regen')player.hp=Math.min(player.maxHp,player.hp+sk.level*dt);
  for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];
    if(b.type==='lightning'){b.life-=dt;if(b.life<=0){bullets.splice(i,1);continue}let hit=false;for(let m of monsters)if(Math.hypot(m.x-b.tx,m.y-b.ty)<m.r+20){damageTarget(m,b.dmg);hit=true;break}if(!hit&&boss&&Math.hypot(boss.x-b.tx,boss.y-b.ty)<boss.r+20)damageTarget(boss,b.dmg);if(hit&&b.chain>0){let next=null,minD=200;for(let m of monsters){let d=Math.hypot(m.x-b.tx,m.y-b.ty);if(d>20&&d<minD){minD=d;next=m;}}if(next)bullets.push({x:b.tx,y:b.ty,tx:next.x,ty:next.y,dmg:b.dmg*0.7,life:0.2,color:'#88ccff',r:3,type:'lightning',chain:b.chain-1});}bullets.splice(i,1);continue;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<-50||b.x>MAP_W+50||b.y<-50||b.y>MAP_H+50){bullets.splice(i,1);continue}
    let hitM=false;for(let m of monsters)if(Math.hypot(m.x-b.x,m.y-b.y)<m.r+b.r){damageTarget(m,b.dmg);if(!b.pierce){hitM=true;break}}if(boss&&!hitM&&Math.hypot(boss.x-b.x,boss.y-b.y)<boss.r+b.r){damageTarget(boss,b.dmg);if(!b.pierce)hitM=true;}if(hitM){bullets.splice(i,1);continue}}
  for(let i=effects.length-1;i>=0;i--){let e=effects[i];e.life-=dt;if(e.life<=0){effects.splice(i,1);continue}if(e.type==='aura'||e.type==='poisonField'){for(let m of monsters)if(Math.hypot(m.x-e.x,m.y-e.y)<m.r+e.r)damageTarget(m,e.dmg*dt);if(boss&&Math.hypot(boss.x-e.x,boss.y-e.y)<boss.r+e.r)damageTarget(boss,e.dmg*dt);}}
  for(let i=monsters.length-1;i>=0;i--){let m=monsters[i];if(m.hp<=0){killCount++;killTarget(m);monsters.splice(i,1);continue}m.knockbackX*=0.9;m.knockbackY*=0.9;if(m.speed>0){let dx=player.x-m.x,dy=player.y-m.y,d=Math.hypot(dx,dy)||1;m.x+=(dx/d*m.speed+m.knockbackX)*dt;m.y+=(dy/d*m.speed+m.knockbackY)*dt;}m.x=Math.max(-30,Math.min(MAP_W+30,m.x));m.y=Math.max(-30,Math.min(MAP_H+30,m.y));if(player.invulnTimer<=0&&Math.hypot(m.x-player.x,m.y-player.y)<player.r+m.r){player.hp-=m.dmg;player.invulnTimer=0.3;if(player.hp<=0){gameOver(false);return}}}
  if(boss){boss.timer+=dt;if(boss.hp<=0){for(let i=0;i<20;i++)particles.push({x:boss.x,y:boss.y,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.5)*300,life:1,color:boss.color});for(let i=0;i<Math.ceil(boss.xp/3);i++)xpOrbs.push({x:boss.x+(Math.random()-0.5)*50,y:boss.y+(Math.random()-0.5)*50,vx:(Math.random()-0.5)*80,vy:(Math.random()-0.5)*80,life:20,value:5});for(let i=0;i<boss.gem;i++)gems.push({x:boss.x+(Math.random()-0.5)*40,y:boss.y+(Math.random()-0.5)*40});killCount+=10;gemCount+=boss.gem;boss=null;bossDefeated++;bossIndicator.classList.remove('show');}else{let dx=player.x-boss.x,dy=player.y-boss.y,d=Math.hypot(dx,dy)||1;boss.x+=dx/d*boss.speed*dt+boss.knockbackX*dt;boss.y+=dy/d*boss.speed*dt+boss.knockbackY*dt;boss.knockbackX*=0.9;boss.knockbackY*=0.9;if(player.invulnTimer<=0&&d<player.r+boss.r){player.hp-=boss.dmg;player.invulnTimer=0.3;if(player.hp<=0){gameOver(false);return}}}}
  let pr=80*(1+player.pickupBonus);
  for(let i=xpOrbs.length-1;i>=0;i--){let o=xpOrbs[i];o.life-=dt;if(o.life<=0){xpOrbs.splice(i,1);continue}let d=Math.hypot(o.x-player.x,o.y-player.y);if(d<pr){o.x+=(player.x-o.x)*8*dt;o.y+=(player.y-o.y)*8*dt;}if(d<player.r+8){gainXp(o.value);xpOrbs.splice(i,1);continue}}
  for(let i=gems.length-1;i>=0;i--){let g=gems[i],d=Math.hypot(g.x-player.x,g.y-player.y);if(d<pr){g.x+=(player.x-g.x)*6*dt;g.y+=(player.y-g.y)*6*dt}if(d<player.r+8){gemCount++;gems.splice(i,1);continue}}
  for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);}
  let tx=player.x-W/2,ty=player.y-H/2;camX+=((Math.max(0,Math.min(MAP_W-W,tx)))-camX)*0.06;camY+=((Math.max(0,Math.min(MAP_H-H,ty)))-camY)*0.06;updateUI();
}

function render(){
  ctx.clearRect(0,0,W,H);
  let bgG=ctx.createLinearGradient(0,0,0,H);bgG.addColorStop(0,'#0c1420');bgG.addColorStop(1,'#080c14');ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(40,60,90,0.2)';ctx.lineWidth=1;let gs=60,sx=-(camX%gs),sy=-(camY%gs);
  for(let x=sx;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=sy;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='rgba(100,140,200,0.3)';ctx.lineWidth=4;ctx.strokeRect(-camX,-camY,MAP_W,MAP_H);
  let dx=-(camX%120),dy=-(camY%120);ctx.fillStyle='rgba(30,50,80,0.15)';for(let x=dx;x<W;x+=120)for(let y=dy;y<H;y+=120)ctx.fillRect(x+40,y+40,40,40);
  for(let e of effects)if(e.type==='poisonField'){let g=ctx.createRadialGradient(e.x-camX,e.y-camY,0,e.x-camX,e.y-camY,e.r);g.addColorStop(0,'rgba(50,200,50,0.25)');g.addColorStop(1,'rgba(50,200,50,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x-camX,e.y-camY,e.r,0,Math.PI*2);ctx.fill();}
  for(let e of effects)if(e.type==='aura'){let g=ctx.createRadialGradient(e.x-camX,e.y-camY,e.r*0.3,e.x-camX,e.y-camY,e.r);g.addColorStop(0,'rgba(255,80,20,0.35)');g.addColorStop(1,'rgba(255,40,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x-camX,e.y-camY,e.r,0,Math.PI*2);ctx.fill();}
  for(let e of effects)if(e.type==='spike')drawSpike(e.x-camX,e.y-camY,e.r);
  for(let o of xpOrbs)drawXpOrb(o.x-camX,o.y-camY);for(let g of gems)drawGem(g.x-camX,g.y-camY);
  for(let m of monsters){let sx=m.x-camX,sy=m.y-camY;if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;
    if(m.type==='worm')drawWorm(sx,sy,m.r,'#3a8a3a','#55cc44');else if(m.type==='fly')drawFly(sx,sy,m.r,'#ccaa22');else if(m.type==='warrior')drawWarrior(sx,sy,m.r,'#cc4444');else if(m.type==='turret')drawTurret(sx,sy,m.r,'#8844cc');
    if(m.hp<m.maxHp){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(sx-m.r,sy-m.r-8,m.r*2,4);ctx.fillStyle='#ff4050';ctx.fillRect(sx-m.r,sy-m.r-8,m.r*2*(m.hp/m.maxHp),4);}}
  if(boss){let sx=boss.x-camX,sy=boss.y-camY;if(boss.type==='wormBoss')drawWormBoss(sx,sy,boss.r,'#ff3366',boss.timer);else if(boss.type==='mechBoss')drawMechBoss(sx,sy,boss.r,'#ff6633');else if(boss.type==='alienBoss')drawAlienBoss(sx,sy,boss.r,'#cc33ff',boss.timer);}
  for(let b of bullets){if(b.type==='lightning'){ctx.strokeStyle='#88ccff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x-camX,b.y-camY);ctx.lineTo(b.tx-camX,b.ty-camY);ctx.stroke();}else if(b.type==='missile')drawMissile(b.x-camX,b.y-camY,b.vx,b.vy,b.r);else if(b.type==='ice')drawIceShard(b.x-camX,b.y-camY,b.vx,b.vy,b.r);else if(b.type==='laser')drawLaserBolt(b.x-camX,b.y-camY,b.vx,b.vy,b.r);}
  for(let sk of player.skills)if(sk.id==='blade'){let def=activeSkills.find(a=>a.id==='blade'),count=def.count+(sk.level-1);for(let i=0;i<count;i++){let a=(player._bladeAngle||0)+(Math.PI*2/count)*i;drawBlade(player.x+Math.cos(a)*50-camX,player.y+Math.sin(a)*50-camY,a,16);}}
  for(let p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x-camX,p.y-camY,3*p.life,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
  if(!(player.invulnTimer>0&&Math.floor(player.invulnTimer*20)%2===0))drawPlayer(player.x-camX,player.y-camY,player.r,Date.now()*0.001);

  // 小地图
  let mw=mmCanvas.width,mh=mmCanvas.height;mmCtx.clearRect(0,0,mw,mh);mmCtx.fillStyle='rgba(0,0,0,0.6)';mmCtx.fillRect(0,0,mw,mh);
  mmCtx.strokeStyle='rgba(255,255,255,0.15)';mmCtx.lineWidth=1;mmCtx.strokeRect(0,0,mw,mh);
  let mx=mw/MAP_W,my=mh/MAP_H;
  mmCtx.fillStyle='#40b8ff';mmCtx.beginPath();mmCtx.arc(player.x*mx,player.y*my,2.5,0,Math.PI*2);mmCtx.fill();
  mmCtx.fillStyle='#ff4050';for(let m of monsters)mmCtx.fillRect(m.x*mx-1,m.y*my-1,2,2);
  if(boss){mmCtx.fillStyle=boss.color;mmCtx.beginPath();mmCtx.arc(boss.x*mx,boss.y*my,4,0,Math.PI*2);mmCtx.fill();}
  mmCtx.strokeStyle='rgba(255,255,255,0.5)';mmCtx.strokeRect(camX*mx,camY*my,W*mx,H*my);
}

function setupJoystick(){
  joystickZone.addEventListener('touchstart',e=>{e.preventDefault();joystickActive=true;let t=e.touches[0],r=joystickZone.getBoundingClientRect();joyCX=r.left+r.width/2;joyCY=r.top+r.height/2;updateJoystick(t.clientX,t.clientY);},{passive:false});
  joystickZone.addEventListener('touchmove',e=>{e.preventDefault();if(!joystickActive)return;updateJoystick(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  joystickZone.addEventListener('touchend',e=>{e.preventDefault();joystickActive=false;joyDX=0;joyDY=0;joystickThumb.style.transform='translate(0,0)';},{passive:false});
  joystickZone.addEventListener('touchcancel',()=>{joystickActive=false;joyDX=0;joyDY=0;joystickThumb.style.transform='translate(0,0)';});
  let keys={};window.addEventListener('keydown',e=>{keys[e.key]=true});window.addEventListener('keyup',e=>{keys[e.key]=false});
  setInterval(()=>{if(!gameState||gameState==='levelup')return;if(keys['w']||keys['ArrowUp'])joyDY=-1;else if(keys['s']||keys['ArrowDown'])joyDY=1;else joyDY=0;if(keys['a']||keys['ArrowLeft'])joyDX=-1;else if(keys['d']||keys['ArrowRight'])joyDX=1;else joyDX=0;},30);
}
function updateJoystick(cx,cy){let dx=cx-joyCX,dy=cy-joyCY,dist=Math.hypot(dx,dy),maxR=42;if(dist>maxR){dx=dx/dist*maxR;dy=dy/dist*maxR}joyDX=dx/maxR;joyDY=dy/maxR;joystickThumb.style.transform=`translate(${dx}px,${dy}px)`;}

let lastT=0;
function loop(t){let dt=Math.min((t-lastT)/1000,0.1);lastT=t;if(dt>0){update(dt);render();}if(gameState!=='gameover')requestAnimationFrame(loop);}
window.restartGame=restartGame;window.togglePause=togglePause;
function onResize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);}
window.addEventListener('resize',onResize);
setupJoystick();initGame();lastT=performance.now();requestAnimationFrame(loop);
})();
</script>
