
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>鲨鲨幸存者 - 太空杀</title>
<style>
:root {
  --bg-deep: #06060d;
  --bg-panel: rgba(10,10,25,0.85);
  --cyan: #00e5ff;
  --magenta: #ff2d95;
  --gold: #ffd740;
  --green: #00ff88;
  --white: #e0e0f0;
  --dim: rgba(255,255,255,0.35);
  --glass: rgba(10,10,30,0.75);
  --border-glow: 0 0 10px rgba(0,229,255,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg-deep);
  color: var(--white);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  height: 100dvh;
  width: 100vw;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

canvas { display:block; position:absolute; top:0; left:0; width:100%; height:100%; }

/* Main Menu */
#menu {
  position:absolute; inset:0; z-index:100;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at center, rgba(0,229,255,0.06) 0%, rgba(0,0,0,0) 70%),
              radial-gradient(ellipse at 70% 30%, rgba(255,45,149,0.04) 0%, transparent 50%);
}
#menu::before {
  content:''; position:absolute; inset:0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,229,255,0.015) 2px, rgba(0,229,255,0.015) 4px);
  pointer-events:none;
}

.menu-title {
  font-size: clamp(2.2rem, 6vw, 3.8rem);
  font-weight: 900;
  letter-spacing: 0.08em;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 0 30px rgba(0,229,255,0.4));
  margin-bottom: 0.3em;
}
.menu-subtitle {
  font-size: 0.9rem;
  color: var(--dim);
  letter-spacing: 0.2em;
  margin-bottom: 3em;
}

.menu-panel {
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0,229,255,0.15);
  border-radius: 16px;
  padding: 2em 2.5em;
  min-width: min(360px, 90vw);
  box-shadow: 0 0 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
  display:flex; flex-direction:column; gap:1.2em;
}

.menu-row {
  display:flex; justify-content:space-between; align-items:center;
  font-size:0.9rem; color:var(--dim);
}
.menu-row span:last-child { color:var(--cyan); font-weight:600; }

.menu-toggle {
  display:flex; align-items:center; gap:0.8em; cursor:pointer;
}
.menu-toggle .switch {
  width:48px; height:28px; background:rgba(255,255,255,0.1);
  border-radius:14px; position:relative; transition:background 0.3s;
  border:1px solid rgba(255,255,255,0.1);
}
.menu-toggle .switch.on { background:rgba(0,229,255,0.25); border-color:rgba(0,229,255,0.4); }
.menu-toggle .switch::after {
  content:''; position:absolute; top:3px; left:3px;
  width:20px; height:20px; border-radius:50%;
  background:var(--white); transition:transform 0.3s;
}
.menu-toggle .switch.on::after { transform:translateX(20px); background:var(--cyan); }

.btn-primary {
  width:100%; padding:0.9em; border:none; border-radius:10px;
  font-size:1.1rem; font-weight:700; letter-spacing:0.05em; cursor:pointer;
  color:#0a0a18;
  background: linear-gradient(135deg, var(--cyan), #00b8d4);
  box-shadow: 0 0 30px rgba(0,229,255,0.3), 0 4px 15px rgba(0,0,0,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  text-transform:uppercase;
}
.btn-primary:active { transform:scale(0.97); box-shadow: 0 0 50px rgba(0,229,255,0.5); }

.btn-sm {
  padding:0.5em 1.2em; border:1px solid rgba(0,229,255,0.3);
  background:rgba(0,229,255,0.08); color:var(--cyan); border-radius:8px;
  cursor:pointer; font-size:0.85rem; transition:all 0.2s;
}
.btn-sm:hover { background:rgba(0,229,255,0.18); }

/* HUD */
#hud {
  position:absolute; top:0; left:0; right:0; z-index:50; pointer-events:none;
  padding:clamp(8px,2vw,16px);
}
.hud-top {
  display:flex; justify-content:space-between; align-items:flex-start;
}
.hud-left { display:flex; flex-direction:column; gap:6px; }
.hud-wave {
  font-size:0.85rem; color:var(--cyan); font-weight:700;
  letter-spacing:0.1em; text-shadow: 0 0 10px rgba(0,229,255,0.5);
}
.hud-timer {
  font-size:1.4rem; font-weight:900; color:var(--gold);
  text-shadow: 0 0 15px rgba(255,215,64,0.4);
}
.hud-right { text-align:right; display:flex; flex-direction:column; gap:6px; }
.hud-level {
  font-size:1rem; font-weight:700; color:var(--magenta);
  text-shadow: 0 0 10px rgba(255,45,149,0.4);
}
.hud-hp {
  font-size:0.85rem; color:var(--green); font-weight:600;
}
.hp-bar-outer {
  width:clamp(100px,25vw,180px); height:8px; background:rgba(255,255,255,0.1);
  border-radius:4px; overflow:hidden; margin-top:2px;
}
.hp-bar-inner {
  height:100%; background:var(--green); border-radius:4px;
  box-shadow: 0 0 10px rgba(0,255,136,0.4);
  transition:width 0.3s;
}

.xp-bar-outer {
  width:clamp(120px,30vw,220px); height:6px; background:rgba(255,255,255,0.1);
  border-radius:3px; overflow:hidden; margin-top:4px;
}
.xp-bar-inner {
  height:100%; background:var(--cyan); border-radius:3px;
  box-shadow: 0 0 8px rgba(0,229,255,0.4);
  transition:width 0.2s;
}

/* Joystick */
#joystick-zone {
  position:absolute; bottom:0; left:0; width:45vw; height:45vh; z-index:60;
}
#joystick-base {
  position:absolute; width:100px; height:100px;
  border-radius:50%; background:rgba(255,255,255,0.06);
  border:2px solid rgba(255,255,255,0.12);
  left:60px; bottom:60px;
  display:flex; align-items:center; justify-content:center;
}
#joystick-thumb {
  width:44px; height:44px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,229,255,0.5), rgba(0,229,255,0.15));
  border:2px solid rgba(0,229,255,0.5);
  box-shadow: 0 0 20px rgba(0,229,255,0.3);
  transition: none;
}

/* Upgrade Panel */
#upgrade-overlay {
  position:absolute; inset:0; z-index:200;
  background:rgba(0,0,0,0.75); backdrop-filter:blur(8px);
  display:none; align-items:center; justify-content:center;
}
#upgrade-overlay.active { display:flex; }

.upgrade-panel {
  background:var(--glass); backdrop-filter:blur(24px);
  border:1px solid rgba(0,229,255,0.2); border-radius:16px;
  padding:1.5em; max-width:min(500px,90vw); width:100%;
  box-shadow: 0 0 60px rgba(0,229,255,0.08), 0 20px 50px rgba(0,0,0,0.6);
}
.upgrade-title {
  text-align:center; font-size:1.3rem; font-weight:800; color:var(--cyan);
  letter-spacing:0.08em; margin-bottom:1em;
  text-shadow: 0 0 15px rgba(0,229,255,0.4);
}
.upgrade-cards {
  display:grid; grid-template-columns:1fr 1fr; gap:0.8em;
}
.upgrade-card {
  background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:1em; cursor:pointer;
  transition:all 0.2s; position:relative; overflow:hidden;
}
.upgrade-card:hover, .upgrade-card:active {
  border-color:rgba(0,229,255,0.35);
  background:rgba(0,229,255,0.06);
  box-shadow: 0 0 20px rgba(0,229,255,0.1);
}
.upgrade-card .card-icon {
  font-size:1.5rem; margin-bottom:0.4em;
}
.upgrade-card .card-name {
  font-weight:700; color:var(--white); font-size:0.95rem;
}
.upgrade-card .card-desc {
  font-size:0.75rem; color:var(--dim); margin-top:0.3em; line-height:1.4;
}
.upgrade-card .card-rarity {
  position:absolute; top:8px; right:8px; font-size:0.65rem; font-weight:700;
  padding:2px 8px; border-radius:4px;
}
.rarity-common { color:#aaa; border:1px solid rgba(170,170,170,0.3); }
.rarity-rare { color:var(--cyan); border:1px solid rgba(0,229,255,0.4); }
.rarity-epic { color:var(--magenta); border:1px solid rgba(255,45,149,0.4); }
.rarity-legendary { color:var(--gold); border:1px solid rgba(255,215,64,0.4); }

/* Game Over */
#gameover-overlay {
  position:absolute; inset:0; z-index:250;
  background:rgba(0,0,0,0.8); backdrop-filter:blur(12px);
  display:none; align-items:center; justify-content:center; flex-direction:column;
}
#gameover-overlay.active { display:flex; }
.gameover-title {
  font-size:2.5rem; font-weight:900;
  background:linear-gradient(135deg, var(--magenta), var(--gold));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:0.3em;
}
.gameover-stats { color:var(--dim); font-size:1rem; margin-bottom:2em; text-align:center; line-height:1.8; }

/* Victory */
#victory-overlay {
  position:absolute; inset:0; z-index:250;
  background:rgba(0,0,0,0.8); backdrop-filter:blur(12px);
  display:none; align-items:center; justify-content:center; flex-direction:column;
}
#victory-overlay.active { display:flex; }
.victory-title {
  font-size:2.5rem; font-weight:900;
  background:linear-gradient(135deg, var(--gold), var(--cyan));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:0.3em;
}

/* Boss Alert */
#boss-alert {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:150;
  font-size:2rem; font-weight:900; color:var(--magenta);
  text-shadow: 0 0 30px rgba(255,45,149,0.6);
  pointer-events:none; opacity:0; transition:opacity 0.3s;
  letter-spacing:0.15em;
}
#boss-alert.show { opacity:1; animation: bossPulse 0.6s ease-out; }
@keyframes bossPulse {
  0% { transform:translate(-50%,-50%) scale(0.5); opacity:0; }
  50% { transform:translate(-50%,-50%) scale(1.2); opacity:1; }
  100% { transform:translate(-50%,-50%) scale(1); opacity:1; }
}

/* Damage numbers */
.dmg-num {
  position:absolute; pointer-events:none; font-weight:900;
  font-size:0.8rem; color:var(--gold);
  text-shadow:0 0 6px rgba(255,215,64,0.6);
  animation: dmgFloat 0.8s ease-out forwards;
}
@keyframes dmgFloat {
  0% { transform:translateY(0); opacity:1; }
  100% { transform:translateY(-40px); opacity:0; }
}

/* Chest pickup */
#chest-popup {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:180;
  background:var(--glass); backdrop-filter:blur(20px);
  border:1px solid var(--gold); border-radius:12px;
  padding:1em 1.5em; pointer-events:none; opacity:0;
  transition:opacity 0.3s; color:var(--gold); font-weight:700;
  box-shadow: 0 0 30px rgba(255,215,64,0.2);
}
#chest-popup.show { opacity:1; }

@media (max-width:600px) {
  #joystick-base { width:80px; height:80px; left:30px; bottom:40px; }
  #joystick-thumb { width:36px; height:36px; }
  .upgrade-cards { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Main Menu -->
<div id="menu">
  <div class="menu-title">鲨鲨幸存者</div>
  <div class="menu-subtitle">太空杀 · 割草生存</div>
  <div class="menu-panel">
    <div class="menu-row"><span>关卡</span><span>太空飞船 · 第7层</span></div>
    <div class="menu-row"><span>难度</span><span>标准</span></div>
    <div class="menu-toggle" id="duo-toggle">
      <span>双人模式</span>
      <div class="switch" id="duo-switch"></div>
    </div>
    <div class="menu-row" style="font-size:0.75rem;color:rgba(255,255,255,0.2);">
      单人: 6主动/6被动 · 双人: 8主动/8被动
    </div>
    <button class="btn-primary" id="btn-start">开始游戏</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" style="display:none;">
  <div class="hud-top">
    <div class="hud-left">
      <div class="hud-wave" id="hud-wave">波次 1/5</div>
      <div class="hud-timer" id="hud-timer">8:00</div>
    </div>
    <div class="hud-right">
      <div class="hud-level" id="hud-level">Lv.1</div>
      <div class="xp-bar-outer"><div class="xp-bar-inner" id="xp-bar" style="width:0%"></div></div>
      <div class="hud-hp" id="hud-hp">HP 100/100</div>
      <div class="hp-bar-outer"><div class="hp-bar-inner" id="hp-bar" style="width:100%"></div></div>
    </div>
  </div>
</div>

<!-- Joystick -->
<div id="joystick-zone" style="display:none;">
  <div id="joystick-base">
    <div id="joystick-thumb"></div>
  </div>
</div>

<!-- Boss Alert -->
<div id="boss-alert">BOSS 来袭!</div>

<!-- Chest Popup -->
<div id="chest-popup"></div>

<!-- Upgrade -->
<div id="upgrade-overlay">
  <div class="upgrade-panel">
    <div class="upgrade-title">⚡ 选择技能升级</div>
    <div class="upgrade-cards" id="upgrade-cards"></div>
  </div>
</div>

<!-- Game Over -->
<div id="gameover-overlay">
  <div class="gameover-title">战斗结束</div>
  <div class="gameover-stats" id="gameover-stats"></div>
  <button class="btn-primary" id="btn-retry" style="max-width:250px;">再来一局</button>
</div>

<!-- Victory -->
<div id="victory-overlay">
  <div class="victory-title">幸存成功!</div>
  <div class="gameover-stats" id="victory-stats"></div>
  <button class="btn-primary" id="btn-retry2" style="max-width:250px;">再来一局</button>
</div>

<script>
// ==================== GAME ENGINE ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ==================== AUDIO (procedural) ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}
function playBeep(freq, dur=0.08, vol=0.05, type='square') {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

// ==================== GAME STATE ====================
const STATE = {
  MENU: 'menu', PLAYING: 'playing', UPGRADE: 'upgrade', GAMEOVER: 'gameover', VICTORY: 'victory'
};
let gameState = STATE.MENU;
let isDuo = false;
let gameTime = 0; // seconds
const MAX_TIME = 480; // 8 min
let waveNum = 1;
const MAX_WAVES = 5;
let waveTimer = 0;
const WAVE_DURATION = 96; // ~1.6 min per wave
let bossSpawned = false;
let bossAlive = false;
let upgradeQueue = [];
let paused = false;

// ==================== PLAYER ====================
class Player {
  constructor(id, x, y, color) {
    this.id = id; this.x = x; this.y = y; this.color = color;
    this.radius = 16; this.speed = 220;
    this.hp = 100; this.maxHp = 100;
    this.level = 1; this.xp = 0;
    this.xpToLevel = 20;
    this.vx = 0; this.vy = 0;
    this.attackTimer = 0; this.attackCooldown = 0.5;
    this.attackRange = 80;
    this.attackDamage = 15;
    this.attackAngle = 0;
    this.isAttacking = false;
    this.attackAnim = 0;
    // Skills
    this.activeSkills = []; this.passiveSkills = [];
    this.maxActive = isDuo ? 8 : 6;
    this.maxPassive = isDuo ? 8 : 6;
    // Stats from passives
    this.damageMult = 1; this.speedMult = 1;
    this.rangeMult = 1; this.cooldownMult = 1;
    this.hpRegen = 0;
  }

  move(dx, dy, dt) {
    const mag = Math.sqrt(dx*dx+dy*dy);
    if (mag > 1) { dx /= mag; dy /= mag; }
    this.vx = dx * this.speed * this.speedMult;
    this.vy = dy * this.speed * this.speedMult;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    // bounds
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
  }

  takeDamage(dmg) {
    this.hp -= dmg;
    if (this.hp < 0) this.hp = 0;
  }

  heal(amt) {
    this.hp = Math.min(this.maxHp, this.hp + amt);
  }

  addXp(amt) {
    this.xp += amt;
    while (this.xp >= this.xpToLevel) {
      this.xp -= this.xpToLevel;
      this.level++;
      this.xpToLevel = Math.floor(this.xpToLevel * 1.25);
      upgradeQueue.push(this);
      if (this.level % 5 === 0) {
        this.maxHp += 20; this.hp += 20;
      }
      this.attackDamage += 2;
    }
  }

  attack(angle) {
    this.attackAngle = angle;
    this.isAttacking = true;
    this.attackAnim = 0.15;
    this.attackTimer = this.attackCooldown * this.cooldownMult;
    playBeep(200+Math.random()*100, 0.06, 0.03, 'square');
  }

  update(dt, enemies) {
    if (this.attackTimer > 0) {
      this.attackTimer -= dt;
    }
    if (this.attackAnim > 0) this.attackAnim -= dt;

    // HP regen
    if (this.hpRegen > 0) this.heal(this.hpRegen * dt);

    // Auto attack nearest enemy
    if (this.attackTimer <= 0) {
      let nearest = null, nearestDist = this.attackRange * this.rangeMult;
      for (const e of enemies) {
        const dx = e.x - this.x, dy = e.y - this.y;
        const d = Math.sqrt(dx*dx+dy*dy);
        if (d < nearestDist) { nearestDist = d; nearest = e; }
      }
      if (nearest) {
        this.attack(Math.atan2(nearest.y - this.y, nearest.x - this.x));
        // Deal damage to all enemies in arc
        const arcAngle = Math.PI / 2.5;
        for (const e of enemies) {
          const dx = e.x - this.x, dy = e.y - this.y;
          const d = Math.sqrt(dx*dx+dy*dy);
          if (d < this.attackRange * this.rangeMult) {
            const a = Math.atan2(dy, dx);
            let diff = a - this.attackAngle;
            while (diff > Math.PI) diff -= Math.PI*2;
            while (diff < -Math.PI) diff += Math.PI*2;
            if (Math.abs(diff) < arcAngle/2) {
              const dmg = this.attackDamage * this.damageMult * (0.8 + Math.random()*0.4);
              e.takeDamage(Math.round(dmg));
              spawnDmgNum(e.x, e.y, Math.round(dmg));
            }
          }
        }
      }
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(0, 4, this.radius*0.7, this.radius*0.3, 0, 0, Math.PI*2); ctx.fill();

    // Body
    const bodyGrad = ctx.createRadialGradient(0,-2,0,0,0,this.radius);
    bodyGrad.addColorStop(0, this.color);
    bodyGrad.addColorStop(0.6, 'rgba(0,0,0,0.6)');
    bodyGrad.addColorStop(1, 'rgba(0,0,0,0.8)');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();

    // Glow ring
    ctx.strokeStyle = this.color.replace('1)', '0.4)');
    ctx.lineWidth = 2;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0,0,this.radius+2, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-5, -4, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -4, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-4, -4, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -4, 1.5, 0, Math.PI*2); ctx.fill();

    // Katana attack arc
    if (this.isAttacking && this.attackAnim > 0) {
      const progress = 1 - (this.attackAnim / 0.15);
      const arcAngle = Math.PI / 2.5;
      const startAngle = this.attackAngle - arcAngle/2 + progress * arcAngle;
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = 'rgba(0,229,255,0.2)';
      ctx.strokeStyle = 'rgba(0,229,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0, this.attackRange * this.rangeMult, startAngle, startAngle + arcAngle * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }
}

// ==================== ENEMY ====================
class Enemy {
  constructor(x, y, type='normal') {
    this.x = x; this.y = y;
    this.type = type;
    if (type === 'boss') {
      this.radius = 40; this.hp = 500; this.maxHp = 500;
      this.speed = 60; this.damage = 25;
      this.color = 'rgba(255,45,149,1)';
    } else if (type === 'elite') {
      this.radius = 22; this.hp = 120; this.maxHp = 120;
      this.speed = 80; this.damage = 12;
      this.color = 'rgba(255,140,0,1)';
    } else {
      this.radius = 12; this.hp = 30; this.maxHp = 30;
      this.speed = 70 + Math.random() * 40; this.damage = 8;
      this.color = 'rgba(180,80,255,0.9)';
    }
    this.alive = true;
    this.knockback = 0;
    this.hitFlash = 0;
  }

  takeDamage(dmg) {
    this.hp -= dmg;
    this.hitFlash = 0.1;
    if (this.hp <= 0) {
      this.hp = 0; this.alive = false;
    }
  }

  update(dt, players) {
    if (this.hitFlash > 0) this.hitFlash -= dt;
    // Move toward nearest player
    let nearest = players[0];
    let nd = Infinity;
    for (const p of players) {
      const d = Math.hypot(p.x - this.x, p.y - this.y);
      if (d < nd) { nd = d; nearest = p; }
    }
    if (nearest && nd > 0) {
      const dx = nearest.x - this.x, dy = nearest.y - this.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      this.x += (dx/dist) * this.speed * dt;
      this.y += (dy/dist) * this.speed * dt;
      // Damage on contact
      if (dist < this.radius + nearest.radius) {
        nearest.takeDamage(this.damage * dt * 3);
      }
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Body
    const grad = ctx.createRadialGradient(0,-3,0,0,0,this.radius);
    const fc = this.hitFlash > 0 ? 'rgba(255,255,255,1)' : this.color;
    grad.addColorStop(0, fc);
    grad.addColorStop(0.7, 'rgba(0,0,0,0.8)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.fill();

    // Glow
    if (this.type === 'boss') {
      ctx.strokeStyle = 'rgba(255,45,149,0.6)';
      ctx.lineWidth = 3;
      ctx.shadowColor = 'rgba(255,45,149,0.5)';
      ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(0,0,this.radius+3,0,Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (this.type === 'elite') {
      ctx.strokeStyle = 'rgba(255,140,0,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,0,this.radius+1,0,Math.PI*2); ctx.stroke();
    }

    // HP bar for boss/elite
    if (this.type !== 'normal') {
      const bw = this.radius * 1.8;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-bw/2, -this.radius-12, bw, 5);
      ctx.fillStyle = this.type==='boss' ? '#ff2d95' : '#ff8c00';
      ctx.fillRect(-bw/2, -this.radius-12, bw*(this.hp/this.maxHp), 5);
    }

    ctx.restore();
  }
}

// ==================== CHEST ====================
class Chest {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.radius = 18;
    this.collected = false;
    this.glowPhase = Math.random() * Math.PI * 2;
  }

  draw(ctx) {
    if (this.collected) return;
    this.glowPhase += 0.03;
    ctx.save();
    ctx.translate(this.x, this.y);

    // Glow
    const glowAlpha = 0.15 + Math.sin(this.glowPhase) * 0.08;
    ctx.fillStyle = `rgba(255,215,64,${glowAlpha})`;
    ctx.shadowColor = 'rgba(255,215,64,0.6)';
    ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(0,0,this.radius+8,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Chest body
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(-12, -6, 24, 16);
    ctx.fillStyle = '#DAA520';
    ctx.fillRect(-12, -10, 24, 6);
    ctx.strokeStyle = '#FFD740';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-12, -6, 24, 16);

    // Lock
    ctx.fillStyle = '#FFD740';
    ctx.beginPath(); ctx.arc(0, 2, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillRect(-1, 0, 2, 4);

    ctx.restore();
  }
}

const joyZone = document.getElementById('joystick-zone');
const joyBase = document.getElementById('joystick-base');
const joyThumb = document.getElementById('joystick-thumb');
let joyActive = false;
let joyId = null;
const joyCenter = { x: 60 + 50, y: 0 };

function updateJoyCenter() {
  const rect = joyBase.getBoundingClientRect();
  joyCenter.x = rect.left + rect.width/2;
  joyCenter.y = rect.top + rect.height/2;
}

joyBase.addEventListener('touchstart', e => {
  e.preventDefault(); joyActive = true;
  joyId = e.changedTouches[0].identifier;
  updateJoyCenter();
  updateJoyPos(e.changedTouches[0]);
}, { passive: false });

joyBase.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) updateJoyPos(t);
  }
}, { passive: false });

joyBase.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) { joyActive = false; joyId = null; }
  }
  joyThumb.style.transform = 'translate(0px,0px)';
  inputDir.x = 0; inputDir.y = 0;
});

function updateJoyPos(touch) {
  updateJoyCenter();
  const dx = touch.clientX - joyCenter.x;
  const dy = touch.clientY - joyCenter.y;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const maxR = 45;
  const clampDist = Math.min(dist, maxR);
  const nx = dist > 0 ? dx/dist : 0;
  const ny = dist > 0 ? dy/dist : 0;
  joyThumb.style.transform = `translate(${nx*clampDist}px,${ny*clampDist}px)`;
  inputDir.x = nx * (clampDist/maxR);
  inputDir.y = ny * (clampDist/maxR);
}

function getRandomSkills(player) {
  const activePool = SKILL_POOL.active.filter(s => {
    const existing = player.activeSkills.find(es => es.id === s.id);
    return (!existing || existing.level < s.maxLvl) && player.activeSkills.length < player.maxActive;
  });
  const passivePool = SKILL_POOL.passive.filter(s => {
    const existing = player.passiveSkills.find(es => es.id === s.id);
    return (!existing || existing.level < s.maxLvl) && player.passiveSkills.length < player.maxPassive;
  });

  const pool = [...activePool, ...passivePool];
  // Shuffle and pick 4
  for (let i = pool.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 4);
}

function checkChestPickup(player) {
  for (const c of chests) {
    if (c.collected) continue;
    const d = Math.hypot(player.x - c.x, player.y - c.y);
    if (d < player.radius + c.radius + 15) {
      c.collected = true;
      const roll = Math.random();
      if (roll < 0.3) {
        player.heal(30);
        showChestPopup('回复 30 HP!');
      } else if (roll < 0.6) {
        player.addXp(player.xpToLevel * 0.5);
        showChestPopup('获得大量经验!');
      } else if (roll < 0.85) {
        const buff = SKILL_POOL.active[Math.floor(Math.random()*SKILL_POOL.active.length)];
        // temp buff
        player.damageMult += 0.3;
        setTimeout(() => { player.damageMult -= 0.3; }, 15000);
        showChestPopup('伤害+30% (15秒)!');
      } else {
        // rare: insta-level

  }
}

// Chain lightning
function processChainLightning(player, enemy, enemies) {
  if (!player.chainLightning || player.chainLightning <= 0) return;
  let last = enemy;
  let remaining = player.chainLightning;
  const hit = new Set([enemy]);
  while (remaining > 0) {
    let nearest = null, nd = 150;
    for (const e of enemies) {
      if (!e.alive || hit.has(e)) continue;
      const d = Math.hypot(e.x - last.x, e.y - last.y);
      if (d < nd) { nd = d; nearest = e; }
    }
    if (!nearest) break;
    nearest.takeDamage(Math.round(player.attackDamage * player.damageMult * 0.5));
    spawnDmgNum(nearest.x, nearest.y, Math.round(player.attackDamage * player.damageMult * 0.5));
    hit.add(nearest);
    last = nearest; remaining--;
  }
}

function update(dt) {
  if (gameState !== STATE.PLAYING) return;

  // Cap dt
  if (dt > 0.1) dt = 0.1;
  gameTime += dt;

  // Wave management
  waveTimer += dt;
  if (waveTimer >= WAVE_DURATION && waveNum < MAX_WAVES) {
    waveNum++;
    waveTimer = 0;
    bossSpawned = false;
    bossAlive = false;
  }

  // Boss spawn at wave transitions or mid-wave
  if (!bossSpawned && gameTime > 30 && waveTimer > WAVE_DURATION * 0.5 && !bossAlive) {
    if (Math.random() < 0.003) {
      spawnBoss();
      bossSpawned = true;
    }
  }

  // Enemy spawning
  if (enemies.filter(e=>e.alive).length < 40 + waveNum*10) {
    if (Math.random() < 0.08) {
      const side = Math.floor(Math.random()*4);
      let x, y;
      switch (side) {
        case 0: x=-40; y=Math.random()*H; break;
        case 1: x=W+40; y=Math.random()*H; break;
        case 2: x=Math.random()*W; y=-40; break;
        case 3: x=Math.random()*W; y=H+40; break;
      }
      enemies.push(new Enemy(x, y, Math.random()<0.08&&waveNum>=3?'elite':'normal'));
    }
  }

  // Keyboard input
  inputDir.x = 0; inputDir.y = 0;
  if (keys['w'] || keys['arrowup']) inputDir.y -= 1;
  if (keys['s'] || keys['arrowdown']) inputDir.y += 1;
  if (keys['a'] || keys['arrowleft']) inputDir.x -= 1;
  if (keys['d'] || keys['arrowright']) inputDir.x += 1;

  // Second player (duo) - IJKL
  inputDir2.x = 0; inputDir2.y = 0;
  if (keys['i']) inputDir2.y -= 1;
  if (keys['k']) inputDir2.y += 1;
  if (keys['j']) inputDir2.x -= 1;
  if (keys['l']) inputDir2.x += 1;

  // Mobile input overrides keyboard for player 1
  if (joyActive) {
    // inputDir already set by joystick
  }

  // Update players
  for (const p of players) {
    const dir = p.id === 1 ? inputDir : inputDir2;
    p.move(dir.x, dir.y, dt);
    p.update(dt, enemies.filter(e=>e.alive));

    // Chain lightning check
    for (const e of enemies) {
      if (!e.alive) continue;
      const d = Math.hypot(p.x-e.x, p.y-e.y);
      if (d < p.attackRange * p.rangeMult && p.attackTimer <= 0.01) {
        processChainLightning(p, e, enemies);
      }
    }

    // Lifesteal applied in attack
    checkChestPickup(p);

    // Smite
    if (p.smiteTimer !== undefined && p.smiteDmg) {
      p.smiteTimer -= dt;
      if (p.smiteTimer <= 0) {
        p.smiteTimer = 10;
        for (const e of enemies) {
          if (!e.alive) continue;
          e.takeDamage(p.smiteDmg);
          spawnDmgNum(e.x, e.y, p.smiteDmg);
        }
        playBeep(150, 0.2, 0.06, 'sawtooth');
      }
    }

    // Check death
    if (p.hp <= 0) {
      gameState = STATE.GAMEOVER;
      document.getElementById('gameover-overlay').classList.add('active');
      const stats = `存活 ${Math.floor(gameTime)} 秒 | 等级 ${p.level} | 波次 ${waveNum}`;
      document.getElementById('gameover-stats').textContent = stats;
      return;
    }
  }

  // Update enemies
  for (const e of enemies) {
    e.update(dt, players);
  }

  // Remove dead enemies & give xp
  for (const e of enemies) {
    if (!e.alive) {
      let xpVal = e.type === 'boss' ? 100 : e.type === 'elite' ? 30 : 5;
      // Give xp to nearest player
      let np = players[0], nd = Infinity;
      for (const p of players) { const d = Math.hypot(p.x-e.x, p.y-e.y); if (d<nd){nd=d;np=p;} }
      np.addXp(Math.round(xpVal * (np.xpMult || 1)));
      // Lifesteal
      if (np.lifesteal > 0) np.heal(np.attackDamage * np.damageMult * np.lifesteal);
      // Boss drop chest
      if (e.type === 'boss') {
        bossAlive = false;
        chests.push(new Chest(e.x, e.y));
        showChestPopup('BOSS宝箱!');
      }
      playBeep(400+Math.random()*200, 0.04, 0.02, 'square');
    }
  }
  enemies = enemies.filter(e => e.alive || e.hitFlash > 0);
  // Keep dead enemies for flash then filter
  enemies = enemies.filter(e => e.alive);

  // Damage numbers
  for (const dn of dmgNumbers) { dn.life -= dt; dn.y += dn.vy * dt; }
  dmgNumbers = dmgNumbers.filter(dn => dn.life > 0);

  // Chest popup timer
  if (chestPopupTimer > 0) chestPopupTimer -= dt;

  // Win condition
  if (gameTime >= MAX_TIME && !bossAlive) {
    gameState = STATE.VICTORY;
    document.getElementById('victory-overlay').classList.add('active');
    let totalLevel = players.reduce((s,p)=>s+p.level,0);
    document.getElementById('victory-stats').textContent =
      `存活全部 8 分钟! | 总等级 ${totalLevel} | 击杀波次 ${waveNum}`;
    return;
  }

  // Process upgrades
  if (upgradeQueue.length > 0 && gameState === STATE.PLAYING) {
    const p = upgradeQueue.shift();
    showUpgrade(p);
  }

  // Update HUD
  updateHUD();
}

function updateHUD() {
  const p = players[0];
  document.getElementById('hud-wave').textContent = `波次 ${waveNum}/${MAX_WAVES}`;
  const remaining = Math.max(0, Math.ceil(MAX_TIME - gameTime));
  const min = Math.floor(remaining/60);
  const sec = remaining % 60;
  document.getElementById('hud-timer').textContent = `${min}:${sec.toString().padStart(2,'0')}`;
  document.getElementById('hud-level').textContent = `Lv.${p.level}`;
  document.getElementById('hud-hp').textContent = `HP ${Math.ceil(p.hp)}/${p.maxHp}`;
  document.getElementById('hp-bar').style.width = `${(p.hp/p.maxHp)*100}%`;
  document.getElementById('xp-bar').style.width = `${(p.xp/p.xpToLevel)*100}%`;

  if (p.hp < p.maxHp * 0.3) {
    document.getElementById('hp-bar').style.background = 'rgba(255,45,149,0.8)';
  } else {
    document.getElementById('hp-bar').style.background = 'var(--green)';
  }
}

function showUpgrade(player) {
  gameState = STATE.UPGRADE;
  const skills = getRandomSkills(player);
  const container = document.getElementById('upgrade-cards');
  container.innerHTML = '';

  if (skills.length === 0) {
    // No skills available, skip
    gameState = STATE.PLAYING;
    return;
  }

  document.getElementById('upgrade-overlay').classList.add('active');

  for (const skill of skills) {
    const card = document.createElement('div');
    card.className = 'upgrade-card';
    const rarityClass = `rarity-${skill.rarity}`;
    card.innerHTML = `
      <span class="card-rarity ${rarityClass}">${skill.rarity.toUpperCase()}</span>
      <div class="card-name">${skill.name}</div>
      <div class="card-desc">${skill.desc}</div>
    `;
    card.addEventListener('click', () => {
      applySkill(player, skill);
      document.getElementById('upgrade-overlay').classList.remove('active');
      gameState = STATE.PLAYING;
      playBeep(500, 0.1, 0.05);
    });
    container.appendChild(card);
  }
}

function applySkill(player, skill) {
  const pool = SKILL_POOL.active.find(s=>s.id===skill.id) ? 'active' : 'pool';
  const isActive = SKILL_POOL.active.some(s => s.id === skill.id);
  const list = isActive ? player.activeSkills : player.passiveSkills;
  const existing = list.find(s => s.id === skill.id);
  if (existing) {
    existing.level++;
  } else {
    list.push({ id: skill.id, name: skill.name, level: 1 });
  }
  skill.apply(player);
}

// ==================== RENDER ====================
function drawGrid() {
  ctx.strokeStyle = 'rgba(0,229,255,0.04)';
  ctx.lineWidth = 1;
  const gs = 60;
  for (let x = gs; x < W; x += gs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = gs; y < H; y += gs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawVignette() {
  const grad = ctx.createRadialGradient(W/2, H/2, W*0.4, W/2, H/2, W*0.85);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function render() {
  ctx.clearRect(0, 0, W, H);

  if (gameState === STATE.PLAYING || gameState === STATE.UPGRADE) {
    // Background
    ctx.fillStyle = '#080812';
    ctx.fillRect(0, 0, W, H);
    drawGrid();

    // Draw obstacles (decorative)
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    const obsPositions = [
      [W*0.2, H*0.3, 50], [W*0.7, H*0.6, 55],
      [W*0.5, H*0.2, 40], [W*0.3, H*0.75, 45],
      [W*0.8, H*0.25, 35], [W*0.15, H*0.55, 48]
    ];
    for (const [ox, oy, r] of obsPositions) {
      ctx.beginPath(); ctx.arc(ox, oy, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,229,255,0.06)';
      ctx.stroke();
    }

    // Chests
    for (const c of chests) c.draw(ctx);

    // Enemies
    for (const e of enemies) e.draw(ctx);

    // Players
    for (const p of players) p.draw(ctx);

    // Projectiles / chain lightning
    for (const p of players) {
      if (p.chainLightning && p.chainLightning > 0) {
        // Visual effect handled in attack
      }
    }

    // Damage numbers
    for (const dn of dmgNumbers) {
      const alpha = dn.life / 0.8;
      ctx.fillStyle = `rgba(255,215,64,${alpha})`;
      ctx.font = 'bold 14px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(dn.val, dn.x, dn.y);
    }

    drawVignette();

    // Boss alert
    if (bossAlertTimer > 0) {
      ctx.fillStyle = `rgba(255,45,149,${bossAlertTimer/2})`;
      ctx.font = 'bold 36px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS 来袭!', W/2, H/2 - 40);
    }
  }
}

// ==================== GAME LOOP ====================
let lastTime = performance.now();

function gameLoop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  if (gameState === STATE.PLAYING) {
    update(dt);
  }

  render();

  // Update HUD visibility
  const hud = document.getElementById('hud');
  const joy = document.getElementById('joystick-zone');
  if (gameState === STATE.PLAYING || gameState === STATE.UPGRADE) {
    hud.style.display = 'block';
    joy.style.display = 'block';
  } else {
    hud.style.display = 'none';
    joy.style.display = 'none';
  }

  requestAnimationFrame(gameLoop);
}

// ==================== UI ====================
const duoSwitch = document.getElementById('duo-switch');
duoSwitch.addEventListener('click', () => {
  isDuo = !isDuo;
  duoSwitch.classList.toggle('on', isDuo);
});

document.getElementById('btn-start').addEventListener('click', () => {
  initAudio();
  document.getElementById('menu').style.display = 'none';
  initGame();
  gameState = STATE.PLAYING;
  updateJoyCenter();
  playBeep(300, 0.1, 0.05);
  playBeep(500, 0.1, 0.05, 'triangle');
});

document.getElementById('btn-retry').addEventListener('click', () => {
  document.getElementById('gameover-overlay').classList.remove('active');
  document.getElementById('menu').style.display = 'flex';
  gameState = STATE.MENU;
  enemies = []; players = []; chests = []; dmgNumbers = [];
});

document.getElementById('btn-retry2').addEventListener('click', () => {
  document.getElementById('victory-overlay').classList.remove('active');
  document.getElementById('menu').style.display = 'flex';
  gameState = STATE.MENU;
  enemies = []; players = []; chests = []; dmgNumbers = [];
});

// Window resize - update joy center
window.addEventListener('resize', () => {
  resize();
  // Re-clamp player positions
  for (const p of players) {
    p.x = Math.min(W - p.radius, Math.max(p.radius, p.x));
    p.y = Math.min(H - p.radius, Math.max(p.radius, p.y));
  }
  if (gameState === STATE.PLAYING) updateJoyCenter();
});

// Start render loop
requestAnimationFrame(gameLoop);
</script>
