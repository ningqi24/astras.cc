<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>鲨鲨幸存者</title>
<style>
@font-face{font-family:'Game';src:local('Arial Black'),local('Impact'),local('sans-serif');}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;font-family:'Game','Arial Black',sans-serif;user-select:none;-webkit-user-select:none;}

#game-container{width:100vw;height:100vh;position:relative;display:flex;justify-content:center;align-items:center;}

/* Landscape enforcement */
#landscape-warning{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column;justify-content:center;align-items:center;color:#ff2d95;font-size:18px;text-align:center;}
@media(orientation:portrait){#landscape-warning{display:flex;}}
@media(orientation:landscape){#landscape-warning{display:none;}}

canvas{display:block;image-rendering:pixelated;}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;pointer-events:none;z-index:10;padding:8px 16px;display:flex;justify-content:space-between;align-items:flex-start;}

.hud-panel{background:rgba(10,10,15,0.85);border:2px solid #00e5ff;padding:6px 12px;box-shadow:0 0 12px rgba(0,229,255,0.3),inset 0 0 8px rgba(0,229,255,0.1);}

.hud-left{display:flex;flex-direction:column;gap:4px;}
.hud-right{display:flex;flex-direction:column;gap:4px;text-align:right;}

.hud-timer{color:#00ff88;font-size:16px;letter-spacing:2px;}
.hud-wave{color:#ffd740;font-size:13px;}
.hud-kills{color:#ff2d95;font-size:12px;text-shadow:0 0 6px #ff2d95;}
.hud-level{color:#00e5ff;font-size:14px;font-weight:bold;}
.hud-boss-warning{color:#ff2d95;font-size:13px;animation:blink 0.5s infinite;}

@keyframes blink{50%{opacity:0.3;}}

/* HP Bar */
#hp-bar-outer{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:280px;height:8px;background:rgba(0,0,0,0.7);border:2px solid #ff2d95;z-index:10;pointer-events:none;box-shadow:0 0 10px rgba(255,45,149,0.3);}
#hp-bar-inner{height:100%;background:linear-gradient(90deg,#ff2d95,#ff0055);transition:width 0.2s;box-shadow:inset 0 0 6px rgba(255,255,255,0.2);}

/* XP Bar */
#xp-bar-outer{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:280px;height:5px;background:rgba(0,0,0,0.7);border:1px solid #00e5ff;z-index:10;pointer-events:none;}
#xp-bar-inner{height:100%;background:linear-gradient(90deg,#00e5ff,#00ff88);transition:width 0.2s;}

/* Level Up Modal */
#levelup-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;flex-direction:column;}
#levelup-modal.active{display:flex;}

.levelup-title{color:#ffd740;font-size:28px;margin-bottom:20px;text-shadow:0 0 20px #ffd740;letter-spacing:4px;text-transform:uppercase;}

.levelup-choices{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:900px;}

.choice-card{width:180px;background:rgba(10,10,15,0.9);border:2px solid #333;padding:12px;cursor:pointer;transition:all 0.15s;text-align:center;}
.choice-card:hover{border-color:#00e5ff;box-shadow:0 0 20px rgba(0,229,255,0.4);transform:translateY(-4px);}
.choice-card:hover .choice-name{color:#00e5ff;}

.choice-icon{width:48px;height:48px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;}
.choice-icon svg{width:40px;height:40px;}

.choice-name{color:#fff;font-size:14px;font-weight:bold;margin-bottom:4px;}
.choice-type{font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.choice-type.active-skill{color:#ff2d95;}
.choice-type.passive{color:#ffd740;}
.choice-desc{color:#888;font-size:10px;line-height:1.4;}
.choice-level{color:#00ff88;font-size:11px;margin-top:4px;}

/* Game Over Screen */
#gameover-screen{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;flex-direction:column;}
#gameover-screen.active{display:flex;}

.go-title{font-size:36px;letter-spacing:6px;margin-bottom:12px;text-shadow:0 0 30px currentColor;text-transform:uppercase;}
.go-title.victory{color:#ffd740;}
.go-title.defeat{color:#ff2d95;}

.go-stats{color:#888;font-size:14px;margin-bottom:20px;text-align:center;line-height:1.8;}
.go-stats span{color:#00e5ff;}

.go-btn{background:transparent;border:2px solid #00e5ff;color:#00e5ff;padding:10px 30px;font-family:inherit;font-size:16px;cursor:pointer;letter-spacing:2px;transition:all 0.2s;text-transform:uppercase;}
.go-btn:hover{background:#00e5ff;color:#000;box-shadow:0 0 20px rgba(0,229,255,0.5);}

/* Boss Announcement */
#boss-announce{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:150;pointer-events:none;}
#boss-announce.active{display:block;animation:bossFade 2.5s forwards;}
#boss-announce .ba-text{color:#ff2d95;font-size:40px;text-shadow:0 0 40px #ff2d95,0 0 80px #ff0055;letter-spacing:8px;text-align:center;text-transform:uppercase;}
#boss-announce .ba-sub{color:#ffd740;font-size:16px;text-align:center;margin-top:8px;letter-spacing:3px;}

@keyframes bossFade{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}30%{transform:translate(-50%,-50%) scale(1);}80%{opacity:1;}100%{opacity:0;}}

/* Pause hint */
#pause-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,0.5);font-size:14px;pointer-events:none;z-index:5;letter-spacing:1px;display:none;}

/* Controls hint */
#controls-hint{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.35);font-size:10px;pointer-events:none;z-index:5;letter-spacing:1px;}
</style>
</head>

function resizeCanvas(){

// ============ INPUT ============
window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==='p'&&gameState==='playing'){paused=!paused;document.getElementById('pause-hint').style.display=paused?'block':'none';}
  if(e.key===' '&&gameState==='levelup'&&levelUpChoices.length>0){
    selectUpgrade(0);
  }
  e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

canvas.addEventListener('click',e=>{
  if(gameState==='levelup'&&levelUpChoices.length>0){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    // Check which choice card was clicked
    const cards=document.querySelectorAll('.choice-card');
    cards.forEach((card,i)=>{
      const cr=card.getBoundingClientRect();
      if(mx>=cr.left&&mx<=cr.right&&my>=cr.top&&my<=cr.bottom){
        selectUpgrade(i);
      }
    });
  }
});

// ============ HELPER FUNCTIONS ============
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function angle(a,b){return Math.atan2(b.y-a.y,b.x-a.x);}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function rand(min,max){return Math.random()*(max-min)+min;}
function randInt(min,max){return Math.floor(rand(min,max+1));}
function lerp(a,b,t){return a+(b-a)*t;}

function randomEdgePos(){
  const side=randInt(0,3);
  const margin=60;
  switch(side){
    case 0:return{x:rand(margin,MAP_W-margin),y:-margin};
    case 1:return{x:MAP_W+margin,y:rand(margin,MAP_H-margin)};
    case 2:return{x:rand(margin,MAP_W-margin),y:MAP_H+margin};
    case 3:return{x:-margin,y:rand(margin,MAP_H-margin)};
  }
}

// ============ SPAWNING ============
function spawnMonster(type){
  const pos=randomEdgePos();
  const t=monsterTypes[type];
  monsters.push({
    x:pos.x,y:pos.y,
    hp:t.hp,maxHp:t.hp,
    dmg:t.dmg,
    speed:t.speed*(1+waveNum*0.05),
    size:t.size,
    color:t.color,
    xpValue:t.xp,
    shape:t.shape,
    type:type,
    hitFlash:0
  });
}

function spawnWave(){
  const baseCount=6+waveNum*3;
  const types=Object.keys(monsterTypes);
  for(let i=0;i<baseCount;i++){
    const type=types[randInt(0,Math.min(waveNum-1,types.length-1))];
    spawnMonster(type);
  }
}

function spawnBoss(num){
  const bossKeys=Object.keys(bossTypes);
  const bKey=bossKeys[Math.min(num-1,bossKeys.length-1)];
  const b=bossTypes[bKey];
  const pos=randomEdgePos();
  const boss={
    x:pos.x,y:pos.y,
    hp:b.hp*(1+(num-1)*0.3),maxHp:b.hp*(1+(num-1)*0.3),
    dmg:b.dmg,
    speed:b.speed,
    size:b.size,
    color:b.color,
    xpValue:b.xp,
    shape:b.shape,
    type:bKey,
    isBoss:true,
    attacks:b.attacks,
    attackCd:0,
    hitFlash:0,
    name:b.name,
    phase:0
  };
  monsters.push(boss);
  bossActive=boss;

  // Boss announcement
  const ba=document.getElementById('boss-announce');
  document.getElementById('ba-text').textContent=b.name;
  document.getElementById('ba-sub').textContent='第 '+num+' 只BOSS';
  ba.classList.remove('active');
  void ba.offsetWidth;
  ba.classList.add('active');
  bossAnnounceTimer=2.5;
}

// ============ WEAPON LOGIC ============
function getWeaponCd(id){
  const def=weaponDefs[id];
  let cd=def.cd;
  cd*=(1-player.cdReduction);
  return Math.max(cd,0.1);
}

function getWeaponRange(id){
  const def=weaponDefs[id];
  let baseRange=def.type==='melee'?80:400;
  return baseRange*(1+player.rangeBonus);
}

function getWeaponDamage(id,level){
  const def=weaponDefs[id];
  let base=10+level*5;
  base*=(1+player.atkBonus);
  if(level>=6) base*=1.5; // super weapon bonus
  return base;
}

function fireWeapon(w){
  const def=weaponDefs[w.id];
  const range=getWeaponRange(w.id);
  const dmg=getWeaponDamage(w.id,w.level);

  switch(w.id){
    case 'katana':{
      const dir=player.lastDir;
      const ang=Math.atan2(dir.y,dir.x);
      const count=isSuper?8:3;
      for(let i=0;i<count;i++){
        const a=ang-Math.PI/3+(Math.PI*2/3)*i/(count-1);
        effects.push({
          x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,
          dx:Math.cos(a),dy:Math.sin(a),

          type:'slash',owner:'player'

      break;
    }
    case 'kunai':{
      let nearest=null,nd=Infinity;
      monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nearest=m;nd=d;}});
      if(nearest){
        const a=angle(player,nearest);
        const count=isSuper?3:1;
        for(let i=0;i<count;i++){
          const spread=(i-(count-1)/2)*0.15;
          projectiles.push({
            x:player.x,y:player.y,
            dx:Math.cos(a+spread)*500,dy:Math.sin(a+spread)*500,
            dmg:dmg,life:isSuper?2:1.2,color:'#c0c0c0',size:4,
            penetrate:isSuper,owner:'player'
          });
        }
      }
      break;
    }
    case 'staff':{
      const dir=player.lastDir;
      const ang=Math.atan2(dir.y,dir.x);
      const arcCount=isSuper?12:5;
      for(let i=0;i<arcCount;i++){
        const a=ang-Math.PI/2+Math.PI*i/(arcCount-1);
        effects.push({
          x:player.x,y:player.y,
          dx:Math.cos(a),dy:Math.sin(a),
          life:0.2,range:range*0.8,dmg:dmg,color:'#f66',
          type:'slash',owner:'player'
        });
      }

    case 'revolver':{
      const count=isSuper?12:6;

        setTimeout(()=>{

          let nearest=null,nd=Infinity;
          monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nearest=m;nd=d;}});

              x:player.x,y:player.y,
              dx:Math.cos(a)*600,dy:Math.sin(a)*600,

    case 'thunderSpear':{

      if(nearest){
        const a=angle(player,nearest);
        projectiles.push({
          x:player.x,y:player.y,

// ============ UPGRADE SYSTEM ============
function getAvailableUpgrades(){
  const choices=[];
  const activeWeaponIds=player.weapons.map(w=>w.id);
  const passiveIds=player.passiveItems.map(p=>p.id);

  // Add weapon upgrades for owned weapons
  player.weapons.forEach(w=>{
    if(w.level<6||(w.level===6&&w.id in weaponDefs)){
      choices.push({type:'weapon_upgrade',weaponId:w.id,weapon:w});
    }
  });

  // Add new weapons (up to 6 active)
  if(player.weapons.length<6){
    const available=Object.keys(weaponDefs).filter(id=>!activeWeaponIds.includes(id));
    if(available.length>0){
      const id=available[randInt(0,available.length-1)];
      choices.push({type:'new_weapon',weaponId:id});
    }
  }

  // Add passive items (up to 6)
  if(player.passiveItems.length<6){
    const available=Object.keys(passiveDefs).filter(id=>!passiveIds.includes(id));
    if(available.length>0){
      const id=available[randInt(0,available.length-1)];
      choices.push({type:'new_passive',passiveId:id});
    }
  }

  // Add passive upgrades
  player.passiveItems.forEach(p=>{
    if(p.level<5){
      choices.push({type:'passive_upgrade',passiveId:p.id,passive:p});
    }
  });

  // Shuffle and pick 3
  for(let i=choices.length-1;i>0;i--){
    const j=randInt(0,i);
    [choices[i],choices[j]]=[choices[j],choices[i]];
  }
  return choices.slice(0,3);
}

function renderLevelUpChoices(){
  const container=document.getElementById('levelup-choices');
  container.innerHTML='';
  levelUpChoices=getAvailableUpgrades();

  levelUpChoices.forEach((choice,i)=>{
    const card=document.createElement('div');
    card.className='choice-card';

    let iconSvg='',name='',typeLabel='',desc='',levelText='';

    if(choice.type==='weapon_upgrade'){
      const w=choice.weapon;
      const def=weaponDefs[w.id];
      iconSvg=icons[def.icon];
      name=def.name;
      typeLabel='主动技能';
      desc=w.level+1>=6?`超武: ${def.superName} - ${def.superDesc}`:`等级 ${w.level+1} - ${def.desc}`;
      levelText=w.level+1>=6?'✦ 超武进化':`Lv.${w.level} → Lv.${w.level+1}`;
    }else if(choice.type==='new_weapon'){
      const def=weaponDefs[choice.weaponId];
      iconSvg=icons[def.icon];
      name=def.name;
      typeLabel='新主动技能';
      desc=def.desc;
      levelText='获得新技能';
    }else if(choice.type==='new_passive'){
      const def=passiveDefs[choice.passiveId];
      iconSvg=icons[def.icon];
      name=def.name;
      typeLabel='被动道具';
      desc=def.desc;
      levelText='获得新道具';
    }else if(choice.type==='passive_upgrade'){
      const p=choice.passive;
      const def=passiveDefs[p.id];
      iconSvg=icons[def.icon];
      name=def.name;
      typeLabel='被动升级';
      desc=`效果提升至 ${Math.round(def.value*(p.level+1)*100)}%`;
      levelText=`Lv.${p.level} → Lv.${p.level+1}`;
    }

    card.innerHTML=`
      <div class="choice-icon">${iconSvg}</div>
      <div class="choice-type active-skill">${typeLabel}</div>
      <div class="choice-name">${name}</div>
      <div class="choice-desc">${desc}</div>
      <div class="choice-level">${levelText}</div>
    `;
    card.addEventListener('click',()=>selectUpgrade(i));
    container.appendChild(card);
  });
}

function selectUpgrade(index){
  if(index>=levelUpChoices.length)return;
  const choice=levelUpChoices[index];

  if(choice.type==='weapon_upgrade'){
    const w=player.weapons.find(w=>w.id===choice.weaponId);
    if(w) w.level++;
  }else if(choice.type==='new_weapon'){
    player.weapons.push({id:choice.weaponId,level:1,cd:0});
  }else if(choice.type==='new_passive'){
    player.passiveItems.push({id:choice.passiveId,level:1});
    applyPassive(choice.passiveId,1);
  }else if(choice.type==='passive_upgrade'){
    const p=player.passiveItems.find(p=>p.id===choice.passiveId);
    if(p){
      // Remove old passive effect
      applyPassive(p.id,-p.level);
      p.level++;
      applyPassive(p.id,p.level);
    }
  }

  levelUpChoices=[];
  document.getElementById('levelup-modal').classList.remove('active');
  gameState='playing';
  paused=false;
}

function applyPassive(id,levelMultiplier){
  const def=passiveDefs[id];
  const val=def.value*levelMultiplier;
  switch(def.effect){
    case 'xpBonus':player.xpBonus+=val;break;
    case 'dmgReduction':player.dmgReduction+=val;break;
    case 'atkBonus':player.atkBonus+=val;break;
    case 'cdReduction':player.cdReduction+=val;break;
    case 'rangeBonus':player.rangeBonus+=val;break;
    case 'durationBonus':player.durationBonus+=val;break;
    case 'pickupRange':player.pickupRange+=80*val;break;
    case 'regen':player.regen+=val;break;
    case 'speedBonus':player.speedBonus+=val;break;
    case 'bulletSpeed':player.bulletSpeedBonus+=val;break;
    case 'maxHpBonus':player.maxHpBonus+=val;player.maxHp=100*(1+player.maxHpBonus);player.hp=Math.min(player.hp,player.maxHp);break;
  }
}

function levelUp(){
  player.level++;
  player.xp-=player.xpToNext;
  player.xpToNext=Math.floor(player.xpToNext*1.18+5);
  player.hp=Math.min(player.hp+20,player.maxHp);

  gameState='levelup';
  paused=true;
  renderLevelUpChoices();
  document.getElementById('levelup-modal').classList.add('active');
}

// ============ DAMAGE ============
function damagePlayer(dmg){
  if(player.invuln>0)return;
  dmg*=(1-player.dmgReduction);
  player.hp-=dmg;
  player.invuln=0.3;
  if(player.hp<=0){
    player.hp=0;
    endGame(false);
  }
}

// ============ END GAME ============
function endGame(won){
  gameState='over';
  gameOver=true;
  victory=won;
  const screen=document.getElementById('gameover-screen');
  const title=document.getElementById('go-title');
  const stats=document.getElementById('go-stats');

  title.textContent=won?'胜利!':'阵亡';
  title.className='go-title '+(won?'victory':'defeat');

  stats.innerHTML=`
    存活时间: <span>${formatTime(timer)}</span><br>
    等级: <span>Lv.${player.level}</span><br>
    击杀: <span>${player.kills}</span><br>
    击败BOSS: <span>${bossDefeated}</span>
  `;

  screen.classList.add('active');
}

document.getElementById('go-restart').addEventListener('click',restartGame);

function formatTime(t){
  const m=Math.floor(t/60),s=Math.floor(t%60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ============ GAME LOOP ============
function update(dt){
  if(gameState!=='playing')return;
  if(paused)return;
  if(gameOver)return;

  dt=Math.min(dt,0.1);
  timer+=dt;

  // Check time
  if(timer>=TOTAL_TIME){
    endGame(true);
    return;
  }

  // Wave spawning
  const expectedWave=Math.floor(timer/WAVE_INTERVAL)+1;
  if(expectedWave>waveNum){
    waveNum=expectedWave;
    spawnWave();
    // Chest spawn
    if(Math.random()<0.3){
      chests.push({x:rand(100,MAP_W-100),y:rand(100,MAP_H-100),opened:false});
    }
  }

  // Boss spawning
  const expectedBoss=Math.floor(timer/BOSS_INTERVAL);
  if(expectedBoss>bossDefeated&&expectedBoss<=BOSS_COUNT&&!bossActive){
    spawnBoss(expectedBoss);
  }

  // Boss announce timer
  if(bossAnnounceTimer>0){
    bossAnnounceTimer-=dt;
    if(bossAnnounceTimer<=0){
      document.getElementById('boss-announce').classList.remove('active');
    }
  }

  // Player movement
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;
  if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  if(mx!==0||my!==0){
    const len=Math.hypot(mx,my);
    mx/=len;my/=len;
    player.lastDir={x:mx,y:my};
  }
  const speed=player.speed*(1+player.speedBonus);
  player.x+=mx*speed*dt;
  player.y+=my*speed*dt;
  player.x=clamp(player.x,20,MAP_W-20);
  player.y=clamp(player.y,20,MAP_H-20);

  // Invulnerability
  if(player.invuln>0)player.invuln-=dt;

  // Regen
  if(player.regen>0){
    player.hp=Math.min(player.hp+player.regen*dt,player.maxHp);
  }

  // Weapon cooldowns
  player.weapons.forEach(w=>{
    if(w.cd===undefined)w.cd=0;
    w.cd-=dt;
    while(w.cd<=0){
      fireWeapon(w);
      w.cd+=getWeaponCd(w.id);
    }
  });

  // Update projectiles
  projectiles=projectiles.filter(p=>{
    p.x+=p.dx*dt;
    p.y+=p.dy*dt;
    p.life-=dt;
    if(p.life<=0){
      if(p.explode){
        effects.push({
          x:p.x,y:p.y,life:0.3,range:p.explode,dmg:p.dmg*0.8,color:'#f80',
          type:'explosion',owner:p.owner
        });
        particles.push({x:p.x,y:p.y,life:0.3,color:'#f80',size:5,count:15,speed:120});
      }
      return false;
    }
    // Bounce off walls
    if(p.bounce&&p.bounce>0){
      let bounced=false;
      if(p.x<10||p.x>MAP_W-10){p.dx*=-1;bounced=true;}
      if(p.y<10||p.y>MAP_H-10){p.dy*=-1;bounced=true;}
      if(bounced)p.bounce--;
    }
    // Out of bounds
    if(p.x<-100||p.x>MAP_W+100||p.y<-100||p.y>MAP_H+100)return false;
    return true;
  });

  // Update effects
  effects=effects.filter(e=>{
    e.life-=dt;
    return e.life>0;
  });

  // Update particles
  particles=particles.filter(p=>{
    p.life-=dt;
    return p.life>0;
  });

  // Projectile-monster collision
  for(let p of projectiles){
    if(p.life<=0)continue;
    for(let i=monsters.length-1;i>=0;i--){
      const m=monsters[i];
      if(dist(p,m)<m.size+5){
        let dmg=p.dmg;
        if(p.crit)dmg*=2;
        m.hp-=dmg;
        m.hitFlash=0.1;
        particles.push({x:p.x,y:p.y,life:0.15,color:p.color,size:2,count:4,speed:60});
        if(!p.penetrate){
          p.life=0;
          if(p.explode){
            effects.push({x:p.x,y:p.y,life:0.3,range:p.explode,dmg:p.dmg*0.8,color:'#f80',type:'explosion',owner:p.owner});
            particles.push({x:p.x,y:p.y,life:0.3,color:'#f80',size:5,count:15,speed:120});
          }
          break;
        }
      }
    }
  }

  // Effect-monster collision
  for(let e of effects){
    if(e.life<=0||e.type==='timeField'||e.type==='poison')continue;
    for(let m of monsters){
      if(dist(e,m)<m.size+e.range*0.7){
        m.hp-=e.dmg*dt*5;
        m.hitFlash=0.05;
      }
    }
  }

  // Field effects (timeField, poison)
  for(let e of effects){
    if(e.type==='timeField'){
      for(let m of monsters){
        if(dist(e,m)<e.range){
          m.speed*=0.5;
        }
      }
    }
    if(e.type==='poison'){
      for(let m of monsters){
        if(dist(e,m)<e.range){
          m.hp-=e.dmg*dt;
          m.hitFlash=0.02;
        }
      }
    }
  }

  // Kill monsters
  for(let i=monsters.length-1;i>=0;i--){
    const m=monsters[i];
    if(m.hp<=0){
      // Drop XP
      const xpCount=m.isBoss?15:randInt(1,3);
      for(let j=0;j<xpCount;j++){
        xpOrbs.push({
          x:m.x+rand(-20,20),y:m.y+rand(-20,20),
          value:m.isBoss?m.xpValue/xpCount:5
        });
      }
      // Death particles
      particles.push({x:m.x,y:m.y,life:0.4,color:m.color,size:m.isBoss?5:2,count:8,speed:80});

      if(m.isBoss){
        bossActive=null;
        bossDefeated++;
        // Boss chest
        chests.push({x:m.x,y:m.y,opened:false,bossChest:true});
      }

      player.kills++;
      player.xp+=m.xpValue*(1+player.xpBonus);
      monsters.splice(i,1);
    }
  }

  // Monster AI
  monsters.forEach(m=>{
    const a=angle(m,player);
    let spd=m.speed;
    // Check if in time field
    for(let e of effects){
      if(e.type==='timeField'&&dist(e,m)<e.range){
        spd*=0.5;break;
      }
    }
    m.x+=Math.cos(a)*spd*dt*60;
    m.y+=Math.sin(a)*spd*dt*60;
  });

  // Monster-player collision
  monsters.forEach(m=>{
    if(dist(m,player)<m.size+12){
      damagePlayer(m.dmg*dt);
    }
  });

  // XP pickup
  for(let i=xpOrbs.length-1;i>=0;i--){
    const o=xpOrbs[i];
    const d=dist(player,o);
    if(d<player.pickupRange){
      // Magnetic pull
      const a=angle(o,player);
      const pullSpeed=300;
      o.x+=Math.cos(a)*pullSpeed*dt;
      o.y+=Math.sin(a)*pullSpeed*dt;
      if(d<15){
        player.xp+=o.value*(1+player.xpBonus);
        xpOrbs.splice(i,1);
      }
    }
  }

  // Chests
  for(let i=chests.length-1;i>=0;i--){
    const c=chests[i];
    if(dist(player,c)<30&&!c.opened){
      c.opened=true;
      // Give random passive
      const passiveIds=Object.keys(passiveDefs);
      const pid=passiveIds[randInt(0,passiveIds.length-1)];
      const existing=player.passiveItems.find(p=>p.id===pid);
      if(existing&&existing.level<5){
        applyPassive(pid,-existing.level);
        existing.level++;
        applyPassive(pid,existing.level);
      }else if(!existing&&player.passiveItems.length<6){
        player.passiveItems.push({id:pid,level:1});
        applyPassive(pid,1);
      }
      particles.push({x:c.x,y:c.y,life:0.5,color:'#ffd740',size:4,count:20,speed:100});
      chests.splice(i,1);
    }
  }

  // Level up check
  while(player.xp>=player.xpToNext){
    levelUp();
  }

  // Update HUD
  updateHUD();
}

function updateHUD(){
  document.getElementById('hud-timer').textContent=formatTime(timer);
  document.getElementById('hud-wave').textContent=`波次 ${waveNum}`;
  document.getElementById('hud-kills').textContent=`击杀 ${player.kills}`;
  document.getElementById('hud-level').textContent=`LV.${player.level}`;
  document.getElementById('hp-bar-inner').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('xp-bar-inner').style.width=(player.xp/player.xpToNext*100)+'%';

  const bossWarn=document.getElementById('hud-boss-warning');
  bossWarn.style.display=bossActive?'block':'none';
}

// ============ RENDER ============
function drawBackground(){
  // Dark space floor
  ctx.fillStyle='#0d0d1a';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Grid
  ctx.save();
  ctx.translate(-camera.x,-camera.y);
  ctx.strokeStyle='rgba(0,229,255,0.06)';
  ctx.lineWidth=1;
  const startX=Math.floor(camera.x/TILE)*TILE;
  const startY=Math.floor(camera.y/TILE)*TILE;
  for(let x=startX;x<camera.x+canvas.width+TILE;x+=TILE){
    ctx.beginPath();ctx.moveTo(x,camera.y);ctx.lineTo(x,camera.y+canvas.height);ctx.stroke();
  }
  for(let y=startY;y<camera.y+canvas.height+TILE;y+=TILE){
    ctx.beginPath();ctx.moveTo(camera.x,y);ctx.lineTo(camera.x+canvas.width,y);ctx.stroke();
  }

  // Map border
  ctx.strokeStyle='#00e5ff';
  ctx.lineWidth=3;
  ctx.shadowColor='#00e5ff';
  ctx.shadowBlur=10;
  ctx.strokeRect(0,0,MAP_W,MAP_H);
  ctx.shadowBlur=0;

  // Some decorative elements
  ctx.fillStyle='rgba(0,229,255,0.03)';
  ctx.fillRect(200,150,120,80);
  ctx.fillRect(800,300,80,120);
  ctx.fillRect(500,800,100,60);
  ctx.fillRect(1100,600,90,90);
  ctx.fillRect(300,950,130,70);

  ctx.restore();
}

function drawMonsterShape(m){
  ctx.save();
  ctx.translate(m.x-camera.x,m.y-camera.y);

  if(m.hitFlash>0&&Math.floor(m.hitFlash*30)%2===0){
    ctx.fillStyle='#fff';
  }else{
    ctx.fillStyle=m.color;
  }

  ctx.shadowColor=m.color;
  ctx.shadowBlur=m.isBoss?15:4;

  switch(m.shape){
    case 'circle':
      ctx.beginPath();ctx.arc(0,0,m.size,0,Math.PI*2);ctx.fill();
      break;
    case 'skull':
      ctx.beginPath();ctx.arc(0,-2,m.size*0.7,0,Math.PI*2);ctx.fill();
      ctx.fillRect(-m.size*0.3,m.size*0.2,m.size*0.6,m.size*0.5);
      // Eyes
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(-m.size*0.25,-m.size*0.1,m.size*0.15,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(m.size*0.25,-m.size*0.1,m.size*0.15,0,Math.PI*2);ctx.fill();
      break;
    case 'bat':
      ctx.beginPath();
      ctx.moveTo(0,-m.size);
      ctx.quadraticCurveTo(-m.size*1.2,-m.size*0.4,-m.size*0.8,0);
      ctx.quadraticCurveTo(-m.size*0.3,m.size*0.3,0,m.size*0.4);
      ctx.quadraticCurveTo(m.size*0.3,m.size*0.3,m.size*0.8,0);
      ctx.quadraticCurveTo(m.size*1.2,-m.size*0.4,0,-m.size);
      ctx.fill();
      break;
    case 'golem':
      ctx.fillRect(-m.size*0.6,-m.size*0.5,m.size*1.2,m.size);
      ctx.fillStyle='#444';
      ctx.beginPath();ctx.arc(-m.size*0.2,-m.size*0.25,m.size*0.12,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(m.size*0.2,-m.size*0.25,m.size*0.12,0,Math.PI*2);ctx.fill();
      break;
    case 'ghost':
      ctx.beginPath();ctx.arc(0,-m.size*0.3,m.size*0.6,0,Math.PI*2);ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-m.size*0.5,0);
      ctx.quadraticCurveTo(-m.size*0.6,m.size*0.5,-m.size*0.3,m.size*0.5);
      ctx.quadraticCurveTo(0,m.size*0.3,m.size*0.3,m.size*0.5);
      ctx.quadraticCurveTo(m.size*0.6,m.size*0.5,m.size*0.5,0);
      ctx.fill();
      break;
    case 'boss':
      // Big cybernetic demon
      ctx.beginPath();ctx.arc(0,0,m.size,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.beginPath();ctx.arc(0,0,m.size*0.7,0,Math.PI*2);ctx.fill();
      // Eyes
      ctx.fillStyle='#ff2d95';
      ctx.beginPath();ctx.arc(-m.size*0.3,-m.size*0.2,m.size*0.15,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(m.size*0.3,-m.size*0.2,m.size*0.15,0,Math.PI*2);ctx.fill();
      // Horns
      ctx.fillStyle=m.color;
      ctx.beginPath();
      ctx.moveTo(-m.size*0.4,-m.size*0.7);
      ctx.lineTo(-m.size*0.6,-m.size*1.3);
      ctx.lineTo(-m.size*0.2,-m.size*0.7);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(m.size*0.4,-m.size*0.7);
      ctx.lineTo(m.size*0.6,-m.size*1.3);
      ctx.lineTo(m.size*0.2,-m.size*0.7);
      ctx.fill();
      break;
  }

  ctx.shadowBlur=0;
  ctx.restore();

  // Boss HP bar
  if(m.isBoss){
    const bw=80,bh=6;
    const bx=m.x-camera.x-bw/2,by=m.y-camera.y-m.size-15;
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    ctx.fillStyle='#333';
    ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#ff2d95';
    ctx.fillRect(bx,by,bw*(m.hp/m.maxHp),bh);
    ctx.fillStyle='#fff';
    ctx.font='8px Game,Arial Black,sans-serif';
    ctx.textAlign='center';
    ctx.fillText(m.name,bx+bw/2,by-3);
  }
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Camera follow
  camera.x=player.x-canvas.width/2;
  camera.y=player.y-canvas.height/2;

  drawBackground();

  // Draw XP orbs
  xpOrbs.forEach(o=>{
    ctx.fillStyle='#00ff88';
    ctx.shadowColor='#00ff88';
    ctx.shadowBlur=6;
    ctx.beginPath();
    ctx.arc(o.x-camera.x,o.y-camera.y,3,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  });

  // Draw chests
  chests.forEach(c=>{
    const cx=c.x-camera.x,cy=c.y-camera.y;
    ctx.fillStyle='#ffd740';
    ctx.shadowColor='#ffd740';
    ctx.shadowBlur=8;
    ctx.fillRect(cx-12,cy-8,24,16);
    ctx.fillStyle='#c8a000';
    ctx.fillRect(cx-10,cy-4,20,4);
    ctx.shadowBlur=0;
  });

  // Draw effects
  effects.forEach(e=>{
    const ex=e.x-camera.x,ey=e.y-camera.y;
    ctx.save();
    switch(e.type){
      case 'slash':
        ctx.strokeStyle=e.color;
        ctx.lineWidth=3;
        ctx.shadowColor=e.color;
        ctx.shadowBlur=8;
        ctx.beginPath();
        ctx.moveTo(ex,ey);
        ctx.lineTo(ex+e.dx*e.range,ey+e.dy*e.range);
        ctx.stroke();
        break;
      case 'thrust':
        ctx.strokeStyle=e.color;
        ctx.lineWidth=4;
        ctx.shadowColor=e.color;
        ctx.shadowBlur=6;
        ctx.beginPath();
        ctx.moveTo(ex,ey);
        ctx.lineTo(ex+e.dx*e.range*0.7,ey+e.dy*e.range*0.7);
        ctx.stroke();
        break;
      case 'lightning':
        ctx.strokeStyle=e.color;
        ctx.lineWidth=2;
        ctx.shadowColor=e.color;
        ctx.shadowBlur=10;
        ctx.beginPath();
        ctx.moveTo(ex,ey);
        let lx=ex,ly=ey;
        for(let j=0;j<5;j++){
          lx+=rand(-15,15);ly+=e.range/5;
          ctx.lineTo(lx,ly);
        }
        ctx.stroke();
        break;
      case 'timeField':
        ctx.strokeStyle=e.color;
        ctx.lineWidth=1.5;
        ctx.setLineDash([8,4]);
        ctx.shadowColor=e.color;
        ctx.shadowBlur=12;
        ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='rgba(0,229,255,0.05)';
        ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.fill();
        ctx.setLineDash([]);
        break;
      case 'poison':
        ctx.fillStyle='rgba(50,150,50,0.2)';
        ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#5a5';
        ctx.lineWidth=1;
        ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.stroke();
        ctx.setLineDash([]);
        break;
      case 'explosion':
        const alpha=e.life/0.3;
        ctx.fillStyle=`rgba(255,136,0,${alpha*0.3})`;
        ctx.beginPath();ctx.arc(ex,ey,e.range* (1-alpha),0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=`rgba(255,200,50,${alpha})`;
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(ex,ey,e.range* (1-alpha*0.5),0,Math.PI*2);ctx.stroke();
        break;
    }
    ctx.shadowBlur=0;
    ctx.restore();
  });

  // Draw projectiles
  projectiles.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;
    ctx.shadowBlur=6;
    ctx.beginPath();
    if(p.spin){
      ctx.save();
      ctx.translate(p.x-camera.x,p.y-camera.y);
      ctx.rotate(Date.now()*0.01);
      ctx.fillRect(-p.size,-p.size/2,p.size*2,p.size);
      ctx.restore();
    }else{
      ctx.arc(p.x-camera.x,p.y-camera.y,p.size,0,Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur=0;
  });

  // Draw monsters
  monsters.forEach(m=>drawMonsterShape(m));

  // Draw particles
  particles.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.life/0.5;
    ctx.beginPath();
    ctx.arc(p.x-camera.x+rand(-2,2),p.y-camera.y+rand(-2,2),p.size*p.life*2,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;

  // Draw player
  const px=player.x-camera.x,py=player.y-camera.y;
  if(player.invuln>0&&Math.floor(player.invuln*20)%2===0){ctx.globalAlpha=0.4;}

  // Player glow
  ctx.shadowColor='#00e5ff';
  ctx.shadowBlur=15;

  // Player body - cyberpunk ninja shark
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();
  // Body
  ctx.moveTo(px,py-14);
  ctx.lineTo(px+8,py+8);
  ctx.lineTo(px,py+14);
  ctx.lineTo(px-8,py+8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#00e5ff';
  ctx.lineWidth=2;
  ctx.stroke();

  // Head
  ctx.fillStyle='#2a2a3e';
  ctx.beginPath();
  ctx.arc(px,py-10,8,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // Eye visor
  ctx.fillStyle='#00e5ff';
  ctx.fillRect(px-5,py-13,10,3);

  // Direction indicator (katana)
  ctx.strokeStyle='#fff';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(px,py-4);
  ctx.lineTo(px+player.lastDir.x*18,py+player.lastDir.y*18-4);
  ctx.stroke();

  // Katana blade
  ctx.strokeStyle='#e8e8e8';
  ctx.lineWidth=2.5;
  ctx.shadowColor='#fff';
  ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.moveTo(px+player.lastDir.x*6,py+player.lastDir.y*6-4);
  ctx.lineTo(px+player.lastDir.x*22,py+player.lastDir.y*22-4);
  ctx.stroke();

  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
}

// ============ MAIN LOOP ============
function gameLoop(timestamp){
  if(!lastTime)lastTime=timestamp;
  let dt=(timestamp-lastTime)/1000;
  if(dt>0.1)dt=0.1;
  lastTime=timestamp;

  if(gameState==='playing'){
    update(dt);
  }

  render();
  requestAnimationFrame(gameLoop);
}

// ============ START GAME ============
function startGame(){
  // Reset state
  player.x=MAP_W/2;player.y=MAP_H/2;
  player.hp=100;player.maxHp=100;
  player.xp=0;player.xpToNext=30;
  player.level=1;
  player.speed=180;
  player.weapons=[{id:'katana',level:1,cd:0}];
  player.passiveItems=[];
  player.pickupRange=80;
  player.atkBonus=0;player.dmgReduction=0;player.cdReduction=0;player.rangeBonus=0;
  player.durationBonus=0;player.speedBonus=0;player.bulletSpeedBonus=0;player.xpBonus=0;
  player.regen=0;player.maxHpBonus=0;
  player.invuln=0;
  player.kills=0;
  player.lastDir={x:0,y:-1};
  monsters=[];
  projectiles=[];
  effects=[];
  xpOrbs=[];
  chests=[];
  particles=[];
  timer=0;
  waveNum=1;
  bossDefeated=0;
  bossActive=null;
  gameOver=false;
  victory=false;
  paused=false;
  gameState='playing';

  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('levelup-modal').classList.remove('active');
  updateHUD();

  // Initial wave
  spawnWave();
}

function restartGame(){
  startGame();
}

// Start!
startGame();
requestAnimationFrame(gameLoop);
</script>
