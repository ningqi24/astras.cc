<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>鲨鲨幸存者</title>
<style>
@font-face{font-family:'Game';src:local('Impact'),local('Arial Black');}
:root{
  --ink:#0b0b12; --panel:#111119; --border:#1e1e2c;
  --cyan:#00e5ff; --magenta:#ff2d95; --gold:#ffd740; --green:#00ff88;
  --muted:#606080; --text:#c8c8d8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--ink); color:var(--text);
  font-family:'Game','Segoe UI',system-ui,sans-serif;
  overflow:hidden; height:100dvh; width:100vw;
  touch-action:none; user-select:none; -webkit-user-select:none;
  display:flex; align-items:center; justify-content:center;
}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}

/* ============ MENU - brutalist ============ */
#menu{
  position:absolute;inset:0;z-index:100;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:clamp(60px,15vh,120px);
}
.menu-header{
  display:flex;align-items:baseline;gap:0.15em;
  margin-bottom:clamp(20px,5vh,40px);
}
.menu-logo{
  font-size:clamp(2rem,5vw,3.5rem);font-weight:900;letter-spacing:-0.03em;
  color:var(--text);line-height:1;
}
.menu-logo em{
  font-style:normal;color:var(--magenta);
  text-shadow:4px 0 0 rgba(255,45,149,0.3);
}
.menu-ver{
  font-size:0.55rem;color:var(--muted);letter-spacing:0.1em;
  margin-left:0.3em;align-self:flex-end;margin-bottom:0.3em;
}

.menu-stage{
  width:min(380px,88vw);padding:1.5em;
  border:2px solid var(--border);
  background:var(--panel);
  position:relative;
}
.menu-stage::before{
  content:'';position:absolute;top:-2px;left:20%;width:60%;height:2px;
  background:var(--cyan);
}
.menu-stage-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:0.4em 0;font-size:0.8rem;
}
.menu-stage-row+.menu-stage-row{border-top:1px solid rgba(255,255,255,0.04);}
.menu-stage-row span:first-child{color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;font-size:0.7rem;}
.menu-stage-row span:last-child{font-weight:700;}

.duo-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:0.8em 0;cursor:pointer;border-top:1px solid rgba(255,255,255,0.04);
}
.duo-row span{font-size:0.8rem;}
.duo-toggle{
  width:44px;height:8px;background:var(--border);
  position:relative;transition:background 0.25s;
}
.duo-toggle::after{
  content:'';position:absolute;top:-4px;left:-2px;
  width:16px;height:16px;background:var(--text);
  transition:transform 0.25s,background 0.25s;
}
.duo-toggle.on{background:rgba(0,229,255,0.3);}
.duo-toggle.on::after{transform:translateX(32px);background:var(--cyan);}

.menu-note{
  font-size:0.6rem;color:var(--muted);padding:0.4em 0;text-align:right;
  border-top:1px solid rgba(255,255,255,0.04);
}

.btn-start{
  width:100%;margin-top:1.2em;padding:0.8em;border:2px solid var(--cyan);
  background:transparent;color:var(--cyan);font-family:inherit;
  font-size:1rem;font-weight:700;letter-spacing:0.15em;cursor:pointer;
  transition:all 0.15s;position:relative;overflow:hidden;
}
.btn-start:hover,.btn-start:active{
  background:var(--cyan);color:var(--ink);
  box-shadow:0 0 40px rgba(0,229,255,0.3);
}

.menu-footer{
  margin-top:auto;padding-bottom:2em;
  font-size:0.6rem;color:var(--muted);letter-spacing:0.1em;
}

/* ============ HUD ============ */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:50;pointer-events:none;
  padding:clamp(8px,2vw,14px);
  display:none;
}
.hud-bar{
  display:flex;justify-content:space-between;
}
.hud-left{display:flex;gap:1em;align-items:baseline;}
.hud-wave{font-size:0.8rem;color:var(--cyan);font-weight:700;letter-spacing:0.1em;}
.hud-timer{font-size:1.6rem;font-weight:900;color:var(--gold);line-height:1;}

.hud-right{text-align:right;}
.hud-lv{font-size:0.8rem;font-weight:700;color:var(--magenta);letter-spacing:0.05em;}
.xp-track{width:clamp(100px,20vw,160px);height:4px;background:var(--border);margin-top:4px;}
.xp-fill{height:100%;background:var(--cyan);transition:width 0.2s;}
.hp-row{display:flex;align-items:center;gap:0.5em;margin-top:6px;justify-content:flex-end;}
.hp-val{font-size:0.75rem;color:var(--green);font-weight:600;}
.hp-track{width:clamp(80px,18vw,140px);height:6px;background:var(--border);}
.hp-fill{height:100%;background:var(--green);transition:width 0.3s;}

/* ============ JOYSTICK ============ */
#joy-wrap{
  position:absolute;bottom:0;left:0;width:45vw;height:45vh;z-index:60;
  display:none;
}
#joy-base{
  position:absolute;width:90px;height:90px;border-radius:50%;
  background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.08);
  left:clamp(30px,8vw,70px);bottom:clamp(30px,8vh,70px);
  display:flex;align-items:center;justify-content:center;
}
#joy-thumb{
  width:38px;height:38px;border-radius:2px;
  background:rgba(0,229,255,0.2);border:1px solid rgba(0,229,255,0.4);
}

/* ============ UPGRADE PANEL ============ */
#upgrade-ov{
  position:absolute;inset:0;z-index:200;
  background:rgba(6,6,13,0.92);
  display:none;align-items:center;justify-content:center;
}
#upgrade-ov.on{display:flex;}

.upgrade-box{
  width:min(480px,90vw);padding:1.8em;
  border:2px solid var(--border);background:var(--panel);
}
.upgrade-box h2{
  font-size:0.7rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:0.2em;margin-bottom:1.2em;text-align:center;
}
.upgrade-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:0.6em;
}
.upgrade-card{
  border:1px solid var(--border);padding:1em;cursor:pointer;
  transition:border-color 0.15s;position:relative;
}
.upgrade-card:hover,.upgrade-card:active{
  border-color:var(--cyan);
}
.upgrade-card .tag{
  position:absolute;top:-1px;right:-1px;
  font-size:0.55rem;font-weight:700;padding:2px 8px;
  letter-spacing:0.1em;
}
.tag-c{background:#333;color:#888;}
.tag-r{background:rgba(0,229,255,0.15);color:var(--cyan);}
.tag-e{background:rgba(255,45,149,0.15);color:var(--magenta);}
.tag-l{background:rgba(255,215,64,0.15);color:var(--gold);}

.upgrade-card .name{font-weight:700;font-size:0.9rem;margin-bottom:0.3em;}
.upgrade-card .desc{font-size:0.7rem;color:var(--muted);line-height:1.4;}

@media(max-width:500px){
  .upgrade-grid{grid-template-columns:1fr;}
  #joy-base{width:76px;height:76px;left:24px;bottom:24px;}
  #joy-thumb{width:32px;height:32px;}
}

/* ============ GAMEOVER/VICTORY ============ */
.end-ov{
  position:absolute;inset:0;z-index:250;
  background:rgba(6,6,13,0.92);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:1.5em;
}
.end-ov.on{display:flex;}
.end-title{
  font-size:clamp(2rem,6vw,3.5rem);font-weight:900;letter-spacing:-0.03em;
}
.end-title.go{color:var(--magenta);}
.end-title.win{color:var(--gold);}
.end-stats{color:var(--muted);font-size:0.9rem;text-align:center;line-height:1.8;}
.end-retry{
  padding:0.7em 2.5em;border:2px solid var(--cyan);background:transparent;
  color:var(--cyan);font-family:inherit;font-size:0.9rem;font-weight:700;
  letter-spacing:0.1em;cursor:pointer;transition:all 0.15s;
}
.end-retry:hover,.end-retry:active{background:var(--cyan);color:var(--ink);}

/* ============ BOSS ALERT ============ */
#boss-alert{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:150;
  font-size:2.5rem;font-weight:900;color:var(--magenta);pointer-events:none;
  opacity:0;transition:opacity 0.2s;letter-spacing:-0.02em;
}
#boss-alert.show{opacity:1;animation:bossIn 0.5s ease-out;}
@keyframes bossIn{
  0%{transform:translate(-50%,-50%) scale(0.6);opacity:0;}
  60%{transform:translate(-50%,-50%) scale(1.08);}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
}

#chest-popup{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:180;
  padding:0.6em 1.5em;border:1px solid var(--gold);background:var(--panel);
  color:var(--gold);font-weight:700;font-size:0.85rem;pointer-events:none;
  opacity:0;transition:opacity 0.2s;
}
#chest-popup.show{opacity:1;}

.dmg-fly{
  position:absolute;pointer-events:none;font-weight:900;
  font-size:0.8rem;color:var(--gold);animation:dmgUp 0.8s ease-out forwards;
}
@keyframes dmgUp{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-36px);opacity:0;}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- MENU -->
<div id="menu">
  <div class="menu-header">
    <span class="menu-logo">鲨鲨<em>幸存者</em></span>
    <span class="menu-ver">v1.0</span>
  </div>
  <div class="menu-stage">
    <div class="menu-stage-row"><span>关卡</span><span>太空飞船·第7层</span></div>
    <div class="menu-stage-row"><span>难度</span><span>标准</span></div>
    <div class="duo-row" id="duo-row">
      <span>双人模式</span>
      <div class="duo-toggle" id="duo-tg"></div>
    </div>
    <div class="menu-note">单人6+6&nbsp;&nbsp;双人8+8</div>
    <button class="btn-start" id="btn-start">开 始 游 戏</button>
  </div>
  <div class="menu-footer">SPACEKILL &mdash; SHARK SURVIVOR</div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-bar">
    <div class="hud-left">
      <div class="hud-wave" id="hud-wave">波次1/5</div>
      <div class="hud-timer" id="hud-timer">8:00</div>
    </div>
    <div class="hud-right">
      <div class="hud-lv" id="hud-lv">Lv.1</div>
      <div class="xp-track"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
      <div class="hp-row">
        <div class="hp-val" id="hp-val">100/100</div>
        <div class="hp-track"><div class="hp-fill" id="hp-fill-bar" style="width:100%"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- JOYSTICK -->
<div id="joy-wrap"><div id="joy-base"><div id="joy-thumb"></div></div></div>

<!-- BOSS -->
<div id="boss-alert">BOSS</div>
<div id="chest-popup"></div>

<!-- UPGRADE -->
<div id="upgrade-ov">
  <div class="upgrade-box">
    <h2>选择技能升级</h2>
    <div class="upgrade-grid" id="upgrade-grid"></div>
  </div>
</div>

<!-- GAME OVER -->
<div class="end-ov" id="go-ov">
  <div class="end-title go">战斗结束</div>
  <div class="end-stats" id="go-stats"></div>
  <button class="end-retry" id="btn-go">再来一局</button>
</div>

<!-- VICTORY -->
<div class="end-ov" id="win-ov">
  <div class="end-title win">幸存成功</div>
  <div class="end-stats" id="win-stats"></div>
  <button class="end-retry" id="btn-win">再来一局</button>
</div>

<script>
// ====================== ENGINE ======================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W,H;
function rs(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
rs();window.addEventListener('resize',rs);

// Audio
let audio;
function au(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();}
function bz(f,d=0.06,v=0.03,t='square'){
  if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();
  o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(1e-5,audio.currentTime+d);
  o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d);
}

// ====================== STATE ======================
const MENU=0,PLAY=1,UPG=2,GO=3,WIN=4;
let gs=MENU,duo=false,gt=0,wn=1,wt=0;
const MAXT=480,WD=96,MAXW=5;
let bossUp=false,bossAlive=false,upQueue=[];
let animId,lastT=0;

// ====================== PLAYER ======================
class P{
  constructor(id,x,y,c){
    this.id=id;this.x=x;this.y=y;this.c=c;
    this.r=16;this.spd=220;this.hp=100;this.mhp=100;
    this.lv=1;this.xp=0;this.xpt=20;
    this.at=0;this.acd=0.5;this.ar=80;this.ad=15;
    this.aa=0;this.aan=0;
    this.as=[];this.ps=[];
    this.maxA=duo?8:6;this.maxP=duo?8:6;
    this.dm=1;this.sm=1;this.rm=1;this.cm=1;this.hr=0;
  }
  move(dx,dy,dt){
    const m=Math.sqrt(dx*dx+dy*dy);
    if(m>1){dx/=m;dy/=m;}
    this.x+=dx*this.spd*this.sm*dt;
    this.y+=dy*this.spd*this.sm*dt;
    this.x=Math.max(this.r,Math.min(W-this.r,this.x));
    this.y=Math.max(this.r,Math.min(H-this.r,this.y));
  }
  dmg(v){this.hp-=v;if(this.hp<0)this.hp=0;}
  heal(v){this.hp=Math.min(this.mhp,this.hp+v);}
  xpg(v){
    this.xp+=v;
    while(this.xp>=this.xpt){
      this.xp-=this.xpt;this.lv++;this.xpt=Math.floor(this.xpt*1.25);
      upQueue.push(this);
      if(this.lv%5===0){this.mhp+=20;this.hp+=20;}
      this.ad+=2;
    }
  }
  attack(a){
    this.aa=a;this.aan=0.15;this.at=this.acd*this.cm;
    bz(200+Math.random()*120,0.05,0.025);
  }
  upd(dt,ens){
    if(this.at>0)this.at-=dt;
    if(this.aan>0)this.aan-=dt;
    if(this.hr>0)this.heal(this.hr*dt);
    if(this.at<=0){
      let near=null,nd=this.ar*this.rm;
      for(const e of ens){
        const d=Math.hypot(e.x-this.x,e.y-this.y);
        if(d<nd){nd=d;near=e;}
      }
      if(near){
        this.attack(Math.atan2(near.y-this.y,near.x-this.x));
        const arc=Math.PI/2.5;
        for(const e of ens){
          const d=Math.hypot(e.x-this.x,e.y-this.y);
          if(d>=this.ar*this.rm)continue;
          let da=Math.atan2(e.y-this.y,e.x-this.x)-this.aa;
          while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
          if(Math.abs(da)<arc/2){
            const dmg=Math.round(this.ad*this.dm*(0.8+Math.random()*0.4));
            e.take(dmg);sfx(e.x,e.y,dmg);
          }
        }
      }
    }
  }
  draw(ctx){
    ctx.save();ctx.translate(this.x,this.y);
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath();ctx.ellipse(0,4,this.r*0.7,this.r*0.3,0,0,Math.PI*2);ctx.fill();
    // body
    const g=ctx.createRadialGradient(0,-2,0,0,0,this.r);
    g.addColorStop(0,this.c);g.addColorStop(0.55,'rgba(0,0,0,0.5)');g.addColorStop(1,'rgba(0,0,0,0.85)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.fill();
    // eyes
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,-4,3.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(5,-4,3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-4,-4,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(6,-4,1.5,0,Math.PI*2);ctx.fill();
    // attack arc
    if(this.aan>0){
      const pr=1-this.aan/0.15,arc=Math.PI/2.5;
      const sa=this.aa-arc/2+pr*arc;
      ctx.globalAlpha=0.5;
      ctx.fillStyle='rgba(0,229,255,0.12)';
      ctx.strokeStyle='rgba(0,229,255,0.5)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.arc(0,0,this.ar*this.rm,sa,sa+arc*0.7);ctx.closePath();
      ctx.fill();ctx.stroke();ctx.globalAlpha=1;
    }
    ctx.restore();
  }
}

// ====================== ENEMY ======================
class E{
  constructor(x,y,tp='normal'){
    this.x=x;this.y=y;this.tp=tp;
    if(tp==='boss'){this.r=40;this.hp=500;this.mhp=500;this.spd=60;this.atk=25;this.c='rgba(255,45,149,1)';}
    else if(tp==='elite'){this.r=22;this.hp=120;this.mhp=120;this.spd=80;this.atk=12;this.c='rgba(255,140,0,1)';}
    else{this.r=12;this.hp=30;this.mhp=30;this.spd=70+Math.random()*40;this.atk=8;this.c='rgba(160,80,220,0.9)';}
    this.alive=true;this.flash=0;
  }
  take(v){this.hp-=v;this.flash=0.08;if(this.hp<=0){this.hp=0;this.alive=false;}}
  upd(dt,ps){
    if(this.flash>0)this.flash-=dt;
    let near=ps[0],nd=Infinity;
    for(const p of ps){const d=Math.hypot(p.x-this.x,p.y-this.y);if(d<nd){nd=d;near=p;}}
    if(near&&nd>0){
      const dx=near.x-this.x,dy=near.y-this.y,dist=Math.sqrt(dx*dx+dy*dy);
      this.x+=dx/dist*this.spd*dt;this.y+=dy/dist*this.spd*dt;
      if(dist<this.r+near.r)near.dmg(this.atk*dt*3);
    }
  }
  draw(ctx){
    ctx.save();ctx.translate(this.x,this.y);
    const fc=this.flash>0?'rgba(255,255,255,1)':this.c;
    const g=ctx.createRadialGradient(0,-3,0,0,0,this.r);
    g.addColorStop(0,fc);g.addColorStop(0.7,'rgba(0,0,0,0.8)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.fill();
    if(this.tp==='boss'){
      ctx.strokeStyle='rgba(255,45,149,0.5)';ctx.lineWidth=3;
      ctx.shadowColor='rgba(255,45,149,0.4)';ctx.shadowBlur=18;
      ctx.beginPath();ctx.arc(0,0,this.r+3,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
    }
    if(this.tp!=='normal'){
      const bw=this.r*1.8;
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-bw/2,-this.r-12,bw,4);
      ctx.fillStyle=this.tp==='boss'?'#ff2d95':'#ff8c00';
      ctx.fillRect(-bw/2,-this.r-12,bw*(this.hp/this.mhp),4);
    }
    ctx.restore();
  }
}

// ====================== CHEST ======================
class Ch{
  constructor(x,y){this.x=x;this.y=y;this.r=18;this.done=false;this.ph=Math.random()*Math.PI*2;}
  draw(ctx){
    if(this.done)return;this.ph+=0.03;
    ctx.save();ctx.translate(this.x,this.y);
    const a=0.1+Math.sin(this.ph)*0.06;
    ctx.fillStyle=`rgba(255,215,64,${a})`;
    ctx.shadowColor='rgba(255,215,64,0.5)';ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(0,0,this.r+8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#8B6914';ctx.fillRect(-10,-5,20,14);
    ctx.fillStyle='#DAA520';ctx.fillRect(-10,-9,20,5);
    ctx.strokeStyle='#FFD740';ctx.lineWidth=1.5;ctx.strokeRect(-10,-5,20,14);
    ctx.fillStyle='#FFD740';ctx.beginPath();ctx.arc(0,2,3.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

// ====================== DATA ======================
let ps=[],ens=[],chs=[],fxs=[],inp={x:0,y:0},inp2={x:0,y:0},keys={};
let bAlert=0,chPopT=0,chPopS='';

// Input
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

// Joystick
const jb=document.getElementById('joy-base'),jt=document.getElementById('joy-thumb');
let jOn=false,jId=null,jCx=0,jCy=0;
function jPos(){
  const r=jb.getBoundingClientRect();jCx=r.left+r.width/2;jCy=r.top+r.height/2;
}
jb.addEventListener('touchstart',e=>{e.preventDefault();jOn=true;jId=e.changedTouches[0].identifier;jPos();jUpd(e.changedTouches[0]);},{passive:false});
jb.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier===jId)jUpd(t);}},{passive:false});
jb.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===jId){jOn=false;jId=null;}}jt.style.transform='translate(0,0)';inp.x=0;inp.y=0;});
function jUpd(t){
  jPos();const dx=t.clientX-jCx,dy=t.clientY-jCy;
  const d=Math.sqrt(dx*dx+dy*dy),mx=38;
  const cd=Math.min(d,mx);
  const nx=d>0?dx/d:0,ny=d>0?dy/d:0;
  jt.style.transform=`translate(${nx*cd}px,${ny*cd}px)`;
  inp.x=nx*(cd/mx);inp.y=ny*(cd/mx);
}

// FX
function sfx(x,y,v){fxs.push({x,y,v,life:0.8,vy:-60});}
function popCh(t){chPopS=t;chPopT=1.5;document.getElementById('chest-popup').textContent=t;document.getElementById('chest-popup').classList.add('show');setTimeout(()=>document.getElementById('chest-popup').classList.remove('show'),1500);}

// ====================== SKILLS ======================
const POOL={
  active:[
    {id:'a1',nm:'剑气纵横',ds:'攻击范围+30%',rar:'c',ap(p){p.rm+=0.3;},mx:5},
    {id:'a2',nm:'疾风斩',ds:'攻击冷却-25%',rar:'c',ap(p){p.cm*=0.75;},mx:5},
    {id:'a3',nm:'致命一击',ds:'伤害+40%',rar:'r',ap(p){p.dm+=0.4;},mx:4},
    {id:'a4',nm:'旋风斩',ds:'攻击范围+60% 伤害+15%',rar:'r',ap(p){p.rm+=0.6;p.dm+=0.15;},mx:3},
    {id:'a5',nm:'闪电链',ds:'攻击可弹射3个目标',rar:'e',ap(p){p.chain=(p.chain||0)+3;},mx:3},
    {id:'a6',nm:'冰霜之刃',ds:'攻击减速敌人',rar:'e',ap(p){p.frost=true;},mx:1},
    {id:'a7',nm:'暗影突袭',ds:'伤害+80% 冷却-10%',rar:'l',ap(p){p.dm+=0.8;p.cm*=0.9;},mx:2},
    {id:'a8',nm:'天罚',ds:'每10秒全屏200伤害',rar:'l',ap(p){p.smCd=10;p.smDmg=200;},mx:2},
  ],
  passive:[
    {id:'p1',nm:'生命强化',ds:'最大生命+30',rar:'c',ap(p){p.mhp+=30;p.hp+=30;},mx:5},
    {id:'p2',nm:'敏捷步伐',ds:'移动速度+20%',rar:'c',ap(p){p.sm+=0.2;},mx:5},
    {id:'p3',nm:'生命回复',ds:'每秒回复2HP',rar:'r',ap(p){p.hr+=2;},mx:4},
    {id:'p4',nm:'钢铁皮肤',ds:'减伤15%',rar:'r',ap(p){p.dr=(p.dr||0)+0.15;},mx:4},
    {id:'p5',nm:'经验加成',ds:'经验+50%',rar:'e',ap(p){p.xm=(p.xm||1)*1.5;},mx:3},
    {id:'p6',nm:'吸血',ds:'攻击回复10%生命',rar:'e',ap(p){p.ls=(p.ls||0)+0.1;},mx:3},
    {id:'p7',nm:'不朽',ds:'最大生命+50 生命回复+3',rar:'l',ap(p){p.mhp+=50;p.hp+=50;p.hr+=3;},mx:2},
    {id:'p8',nm:'狂暴',ds:'伤害+60% 速度+15%',rar:'l',ap(p){p.dm+=0.6;p.sm+=0.15;},mx:2},
  ]
};

function randSkills(p){
  const ap=POOL.active.filter(s=>{const e=p.as.find(x=>x.id===s.id);return(!e||e.level<s.mx)&&p.as.length<p.maxA;});
  const pp=POOL.passive.filter(s=>{const e=p.ps.find(x=>x.id===s.id);return(!e||e.level<s.mx)&&p.ps.length<p.maxP;});
  const all=[...ap,...pp];
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  return all.slice(0,4);
}

// ====================== GAME ======================
function init(){
  ps=[];ens=[];chs=[];fxs=[];upQueue=[];
  gt=0;wn=1;wt=0;bossUp=false;bossAlive=false;
  inp={x:0,y:0};inp2={x:0,y:0};
  ps.push(new P(1,W/2-(duo?60:0),H/2,'rgba(0,229,255,1)'));
  if(duo)ps.push(new P(2,W/2+60,H/2,'rgba(0,255,136,1)'));
  for(let i=0;i<3;i++)chs.push(new Ch(80+Math.random()*(W-160),80+Math.random()*(H-160)));
  lastT=performance.now(); // FIX: reset lastTime on game start
}

function spBoss(){
  const s=Math.floor(Math.random()*4);let x,y;
  if(s===0){x=-60;y=H/2;}else if(s===1){x=W+60;y=H/2;}else if(s===2){x=W/2;y=-60;}else{x=W/2;y=H+60;}
  ens.push(new E(x,y,'boss'));bossAlive=true;bAlert=2;
  document.getElementById('boss-alert').classList.add('show');
  setTimeout(()=>document.getElementById('boss-alert').classList.remove('show'),1800);
  bz(80,0.25,0.06,'sawtooth');
}

function ckCh(p){
  for(const c of chs){
    if(c.done)continue;
    if(Math.hypot(p.x-c.x,p.y-c.y)<p.r+c.r+15){
      c.done=true;const r=Math.random();
      if(r<0.3){p.heal(30);popCh('回复30HP');}
      else if(r<0.6){p.xpg(p.xpt*0.5);popCh('大量经验');}
      else if(r<0.85){p.dm+=0.3;setTimeout(()=>{p.dm-=0.3;},15000);popCh('伤害+30% 15秒');}
      else{p.xpg(p.xpt);popCh('等级提升!');}
      bz(600,0.08,0.05);
      setTimeout(()=>{if(gs===PLAY)chs.push(new Ch(80+Math.random()*(W-160),80+Math.random()*(H-160)));},25000);
    }
  }
}

function updHud(){
  const p=ps[0];
  document.getElementById('hud-wave').textContent=`波次${wn}/${MAXW}`;
  const r=Math.max(0,Math.ceil(MAXT-gt));
  document.getElementById('hud-timer').textContent=`${Math.floor(r/60)}:${(r%60).toString().padStart(2,'0')}`;
  document.getElementById('hud-lv').textContent=`Lv.${p.lv}`;
  document.getElementById('hp-val').textContent=`${Math.ceil(p.hp)}/${p.mhp}`;
  document.getElementById('hp-fill-bar').style.width=(p.hp/p.mhp*100)+'%';
  document.getElementById('xp-fill').style.width=(p.xp/p.xpt*100)+'%';
  document.getElementById('hp-fill-bar').style.background=p.hp<p.mhp*0.3?'#ff2d95':'var(--green)';
}

function showUp(p){
  gs=UPG;
  const sk=randSkills(p);
  const gc=document.getElementById('upgrade-grid');gc.innerHTML='';
  if(sk.length===0){gs=PLAY;return;}
  document.getElementById('upgrade-ov').classList.add('on');
  for(const s of sk){
    const d=document.createElement('div');d.className='upgrade-card';
    const tc={'c':'tag-c','r':'tag-r','e':'tag-e','l':'tag-l'};
    d.innerHTML=`<span class="tag ${tc[s.rar]}">${s.rar.toUpperCase()}</span><div class="name">${s.nm}</div><div class="desc">${s.ds}</div>`;
    d.addEventListener('click',()=>{
      const isA=POOL.active.some(x=>x.id===s.id);
      const lst=isA?p.as:p.ps;
      const ex=lst.find(x=>x.id===s.id);
      if(ex)ex.level++;else lst.push({id:s.id,nm:s.nm,level:1});
      s.ap(p);
      document.getElementById('upgrade-ov').classList.remove('on');
      gs=PLAY;bz(500,0.08,0.04);
    });
    gc.appendChild(d);
  }
}

function spEn(){
  const need=8+wn*4+Math.floor(gt/30);
  const cur=ens.filter(e=>e.alive).length;
  if(cur<40+wn*10&&Math.random()<0.1){
    const s=Math.floor(Math.random()*4);let x,y;
    if(s===0){x=-40;y=Math.random()*H;}else if(s===1){x=W+40;y=Math.random()*H;}else if(s===2){x=Math.random()*W;y=-40;}else{x=Math.random()*W;y=H+40;}
    ens.push(new E(x,y,Math.random()<0.06&&wn>=3?'elite':'normal'));
  }
}

function chain(p,target,all){
  if(!p.chain||p.chain<=0)return;
  let last=target,rem=p.chain;const hit=new Set([target]);
  while(rem>0){
    let near=null,nd=150;
    for(const e of all){if(!e.alive||hit.has(e))continue;const d=Math.hypot(e.x-last.x,e.y-last.y);if(d<nd){nd=d;near=e;}}
    if(!near)break;
    near.take(Math.round(p.ad*p.dm*0.5));sfx(near.x,near.y,Math.round(p.ad*p.dm*0.5));
    hit.add(near);last=near;rem--;
  }
}

function upd(dt){
  if(gs!==PLAY)return;
  if(dt>0.1)dt=0.1;
  gt+=dt;wt+=dt;

  if(wt>=WD&&wn<MAXW){wn++;wt=0;bossUp=false;bossAlive=false;}
  if(!bossUp&&gt>30&&wt>WD*0.5&&!bossAlive&&Math.random()<0.003){spBoss();bossUp=true;}

  spEn();

  // Input
  inp.x=0;inp.y=0;
  if(keys['w']||keys['arrowup'])inp.y-=1;
  if(keys['s']||keys['arrowdown'])inp.y+=1;
  if(keys['a']||keys['arrowleft'])inp.x-=1;
  if(keys['d']||keys['arrowright'])inp.x+=1;
  inp2.x=0;inp2.y=0;
  if(keys['i'])inp2.y-=1;
  if(keys['k'])inp2.y+=1;
  if(keys['j'])inp2.x-=1;
  if(keys['l'])inp2.x+=1;

  // Players
  for(const p of ps){
    const dir=p.id===1?inp:inp2;
    p.move(dir.x,dir.y,dt);
    const live=ens.filter(e=>e.alive);
    p.upd(dt,live);
    // chain lightning
    for(const e of live){
      if(Math.hypot(p.x-e.x,p.y-e.y)<p.ar*p.rm&&p.at<=0.01)chain(p,e,live);
    }
    ckCh(p);
    // Smite
    if(p.smCd!==undefined){
      p.smCd-=dt;
      if(p.smCd<=0){p.smCd=10;for(const e of live){if(!e.alive)continue;e.take(p.smDmg);sfx(e.x,e.y,p.smDmg);}bz(150,0.18,0.05,'sawtooth');}
    }
    if(p.hp<=0){gs=GO;document.getElementById('go-ov').classList.add('on');document.getElementById('go-stats').textContent=`存活${Math.floor(gt)}秒 | 等级${p.lv} | 波次${wn}`;return;}
  }

  // Enemies update
  for(const e of ens)e.upd(dt,ps);

  // Process dead enemies (FIX: no mid-loop filter)
  const dead=[];
  for(const e of ens){
    if(!e.alive){
      dead.push(e);
      let xp=e.tp==='boss'?100:e.tp==='elite'?30:5;
      let np=ps[0],nd=Infinity;
      for(const p of ps){const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<nd){nd=d;np=p;}}
      np.xpg(Math.round(xp*(np.xm||1)));
      if(np.ls>0)np.heal(np.ad*np.dm*np.ls);
      if(e.tp==='boss'){bossAlive=false;chs.push(new Ch(e.x,e.y));popCh('BOSS宝箱!');}
      bz(400+Math.random()*200,0.03,0.015);
    }
  }
  ens=ens.filter(e=>e.alive);

  // FX
  for(const f of fxs){f.life-=dt;f.y+=f.vy*dt;}
  fxs=fxs.filter(f=>f.life>0);
  if(chPopT>0)chPopT-=dt;

  // Win
  if(gt>=MAXT&&!bossAlive){
    gs=WIN;document.getElementById('win-ov').classList.add('on');
    const tl=ps.reduce((s,p)=>s+p.lv,0);
    document.getElementById('win-stats').textContent=`存活全部8分钟 | 总等级${tl} | 波次${wn}`;
    return;
  }

  // Upgrades
  if(upQueue.length>0&&gs===PLAY){const p=upQueue.shift();showUp(p);}

  updHud();
}

// ====================== RENDER ======================
function grid(){
  ctx.strokeStyle='rgba(0,229,255,0.03)';ctx.lineWidth=1;
  for(let x=60;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=60;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function vignette(){
  const g=ctx.createRadialGradient(W/2,H/2,W*0.35,W/2,H/2,W*0.85);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(gs===PLAY||gs===UPG){
    ctx.fillStyle='#090911';ctx.fillRect(0,0,W,H);grid();
    // Obstacles
    const obs=[[W*.2,H*.3,50],[W*.7,H*.6,55],[W*.5,H*.2,40],[W*.3,H*.75,45],[W*.8,H*.25,35],[W*.15,H*.55,48]];
    for(const[ox,oy,r]of obs){
      ctx.fillStyle='rgba(255,255,255,0.02)';ctx.beginPath();ctx.arc(ox,oy,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,229,255,0.04)';ctx.stroke();
    }
    for(const c of chs)c.draw(ctx);
    for(const e of ens)e.draw(ctx);
    for(const p of ps)p.draw(ctx);
    for(const f of fxs){
      const a=f.life/0.8;
      ctx.fillStyle=`rgba(255,215,64,${a})`;ctx.font='bold 14px Game,sans-serif';ctx.textAlign='center';
      ctx.fillText(f.v,f.x,f.y);
    }
    vignette();
  }
}

// ====================== LOOP ======================
function loop(now){
  const dt=(now-lastT)/1000;lastT=now;
  if(gs===PLAY)upd(dt);
  render();

  const hud=document.getElementById('hud'),jw=document.getElementById('joy-wrap');
  if(gs===PLAY||gs===UPG){hud.style.display='block';jw.style.display='block';}
  else{hud.style.display='none';jw.style.display='none';}

  animId=requestAnimationFrame(loop);
}

// ====================== UI ======================
document.getElementById('duo-row').addEventListener('click',()=>{
  duo=!duo;document.getElementById('duo-tg').classList.toggle('on',duo);
});

document.getElementById('btn-start').addEventListener('click',()=>{
  au();document.getElementById('menu').style.display='none';
  init();gs=PLAY;jPos();
  bz(300,0.08,0.04);bz(500,0.08,0.04,'triangle');
});

function backToMenu(){
  document.getElementById('go-ov').classList.remove('on');
  document.getElementById('win-ov').classList.remove('on');
  document.getElementById('menu').style.display='flex';
  gs=MENU;ens=[];ps=[];chs=[];fxs=[];
}
document.getElementById('btn-go').addEventListener('click',backToMenu);
document.getElementById('btn-win').addEventListener('click',backToMenu);

window.addEventListener('resize',()=>{
  rs();
  for(const p of ps){p.x=Math.min(W-p.r,Math.max(p.r,p.x));p.y=Math.min(H-p.r,Math.max(p.r,p.y));}
  if(gs===PLAY)jPos();
});

animId=requestAnimationFrame(loop);
</script></body></html>
