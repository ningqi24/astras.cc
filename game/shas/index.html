<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<title>鲨鲨幸存者</title>
<style>
/* ============ FOUNDATION ============ */
@font-face{font-family:'Game';src:local('PingFang SC'),local('Microsoft YaHei'),local('Arial'),sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0e2a;font-family:'Game','PingFang SC','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;}

#game-container{width:100vw;height:100vh;position:relative;display:flex;justify-content:center;align-items:center;}

/* ============ LANDSCAPE WARNING ============ */
#landscape-warning{display:none;position:fixed;inset:0;background:linear-gradient(135deg,#15153a 0%,#0e0e2a 100%);z-index:9999;flex-direction:column;justify-content:center;align-items:center;color:#ff7099;font-size:18px;text-align:center;font-family:'Game','PingFang SC',sans-serif;}
#landscape-warning .lw-icon{margin-bottom:18px;animation:spin-soft 2.5s ease-in-out infinite;}
#landscape-warning .lw-icon svg{width:48px;height:48px;}
@keyframes spin-soft{0%{transform:rotate(0deg);}50%{transform:rotate(90deg);}100%{transform:rotate(0deg);}}
#landscape-warning .lw-sub{color:#4488ff;font-size:14px;margin-top:6px;}
@media(orientation:portrait){#landscape-warning{display:flex;}}
@media(orientation:landscape){#landscape-warning{display:none;}}

canvas{display:block;}

/* ============ SHARED TOKENS ============ */
/* Primary accent: #4488ff blue | Secondary: #ffcc00 gold | Danger: #ff5580 pink-rose | Success: #22cc77 */
/* Shape system: all-soft rounded, radius 14px base */

/* ============ HUD ============ */
#hud{position:absolute;top:0;left:0;right:0;pointer-events:none;z-index:10;padding:8px 14px;display:flex;justify-content:space-between;align-items:flex-start;}

.hud-item{background:rgba(10,10,35,0.65);border-radius:14px;padding:5px 12px;border:1.5px solid rgba(255,255,255,0.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.hud-timer{color:#fff;font-size:16px;font-weight:700;letter-spacing:1.5px;}
.hud-wave{color:#ffcc00;font-size:12px;font-weight:700;}
.hud-level{color:#4488ff;font-size:14px;font-weight:700;}
.hud-kills{color:#ff7099;font-size:11px;font-weight:700;}
.hud-boss-warn{color:#ff3355;font-size:12px;font-weight:700;animation:blink2 0.5s infinite;display:none;}
@keyframes blink2{50%{opacity:0.15;}}

/* ============ HP / XP BARS ============ */
#hp-bar-wrap{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:10;display:flex;align-items:center;gap:8px;}
#hp-bar-wrap .hp-icon svg{width:16px;height:16px;}
#hp-outer{width:180px;height:10px;background:rgba(0,0,0,0.5);border-radius:14px;overflow:hidden;border:1.5px solid rgba(255,255,255,0.2);}
#hp-inner{height:100%;background:linear-gradient(90deg,#ff5580,#ff7099);transition:width 0.25s ease;border-radius:14px;}

#xp-bar-wrap{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:10;display:flex;align-items:center;gap:8px;}
#xp-bar-wrap .xp-icon svg{width:12px;height:12px;}
#xp-outer{width:180px;height:6px;background:rgba(0,0,0,0.5);border-radius:14px;overflow:hidden;border:1.5px solid rgba(255,255,255,0.15);}
#xp-inner{height:100%;background:linear-gradient(90deg,#ffcc00,#ffaa00);transition:width 0.25s ease;border-radius:14px;}

/* ============ MOBILE JOYSTICK ============ */
#joystick-zone{position:absolute;bottom:60px;left:60px;width:120px;height:120px;z-index:50;pointer-events:all;}
#joystick-base{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.1);border:2.5px solid rgba(255,255,255,0.25);position:relative;}
#joystick-thumb{width:52px;height:52px;border-radius:50%;background:rgba(68,136,255,0.45);position:absolute;top:34px;left:34px;box-shadow:0 0 16px rgba(68,136,255,0.3);transition:transform 0.06s;}

/* ============ LEVEL UP MODAL ============ */
#levelup-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(8,8,28,0.82);justify-content:center;align-items:center;flex-direction:column;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
#levelup-modal.active{display:flex;}

.levelup-title{color:#ffcc00;font-size:28px;margin-bottom:18px;text-shadow:0 0 18px rgba(255,204,0,0.4);letter-spacing:4px;font-weight:800;}

.levelup-choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:700px;}

.choice-card{width:152px;background:rgba(18,18,50,0.92);border:2px solid rgba(255,255,255,0.12);border-radius:16px;padding:12px 10px;cursor:pointer;transition:all 0.18s ease;text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.choice-card:active,.choice-card:hover{border-color:#4488ff;box-shadow:0 0 24px rgba(68,136,255,0.45);transform:scale(1.06);background:rgba(24,24,62,0.94);}
.choice-icon{width:46px;height:46px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;}
.choice-icon svg{width:40px;height:40px;}
.choice-name{color:#fff;font-size:13px;font-weight:700;margin-bottom:3px;}
.choice-tag{display:inline-block;font-size:8px;padding:2px 8px;border-radius:14px;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.choice-tag.active{background:rgba(68,136,255,0.25);color:#4488ff;}
.choice-tag.passive{background:rgba(255,204,0,0.22);color:#ffcc00;}
.choice-desc{color:#b0b0c0;font-size:9px;line-height:1.4;margin-bottom:5px;}
.choice-lvl{color:#22cc77;font-size:10px;font-weight:700;}

/* ============ BOSS ANNOUNCE ============ */
#boss-announce{display:none;position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:150;pointer-events:none;text-align:center;}
#boss-announce.active{display:block;animation:bossFade 2.5s forwards;}
#boss-announce .ba-text{color:#ff3355;font-size:40px;font-weight:800;text-shadow:0 0 30px rgba(255,51,85,0.7),0 0 60px rgba(255,0,0,0.4);letter-spacing:6px;}
#boss-announce .ba-sub{color:#ffcc00;font-size:16px;font-weight:700;margin-top:8px;}
@keyframes bossFade{0%{opacity:0;transform:translate(-50%,-50%) scale(0.4);}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}25%{transform:translate(-50%,-50%) scale(1);}70%{opacity:1;}100%{opacity:0;}}

/* ============ GAME OVER ============ */
#gameover-screen{display:none;position:fixed;inset:0;z-index:200;background:rgba(8,8,26,0.88);justify-content:center;align-items:center;flex-direction:column;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);}
#gameover-screen.active{display:flex;}
.go-title{font-size:36px;font-weight:800;letter-spacing:6px;margin-bottom:14px;}
.go-title.win{color:#ffcc00;text-shadow:0 0 28px rgba(255,204,0,0.5);}
.go-title.lose{color:#ff5580;text-shadow:0 0 28px rgba(255,85,128,0.5);}
.go-stats{color:#c0c0d0;font-size:14px;margin-bottom:20px;text-align:center;line-height:2;}
.go-stats b{color:#4488ff;font-weight:700;}
.go-btn{background:linear-gradient(180deg,#4488ff,#3366dd);border:none;color:#fff;padding:12px 36px;font-family:inherit;font-size:16px;cursor:pointer;border-radius:14px;font-weight:700;letter-spacing:2px;box-shadow:0 4px 16px rgba(68,136,255,0.4);transition:transform 0.1s ease;}
.go-btn:active{transform:scale(0.96);}

/* ============ PAUSE ============ */
#pause-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,0.35);font-size:14px;pointer-events:none;z-index:5;display:none;font-weight:700;letter-spacing:2px;}

/* ============ WEAPON SLOTS ============ */
#weapon-slots{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:10;pointer-events:none;}
.wpn-slot{width:30px;height:30px;border-radius:10px;background:rgba(10,10,35,0.6);border:1.5px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.wpn-slot svg{width:22px;height:22px;}
.wpn-slot .lvl{position:absolute;bottom:-2px;right:-2px;background:#ffcc00;color:#0e0e2a;font-size:7px;font-weight:800;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,0.2);}
</style>
</head>
<body>

<div id="landscape-warning">
  <div class="lw-icon">
    <svg viewBox="0 0 48 48" fill="none"><rect x="6" y="10" width="36" height="28" rx="6" stroke="#4488ff" stroke-width="2.5"/><path d="M26 10V8a4 4 0 0 0-8 0v2" stroke="#ff7099" stroke-width="2.5" stroke-linecap="round"/><path d="M24 20v8M24 32v1" stroke="#ffcc00" stroke-width="3" stroke-linecap="round"/></svg>
  </div>

  <div id="hp-bar-wrap">

    </span>
    <div id="xp-outer"><div id="xp-inner" style="width:0%"></div></div>
  </div>

  <div id="pause-hint">暂停中</div>

  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-thumb"></div>
    </div>
  </div>
</div>

<div id="levelup-modal">
  <div class="levelup-title">升级!</div>
  <div class="levelup-choices" id="levelup-choices"></div>
</div>

<div id="boss-announce">
  <div class="ba-text" id="ba-text"></div>
  <div class="ba-sub" id="ba-sub"></div>
</div>

<div id="gameover-screen">
  <div class="go-title" id="go-title"></div>
  <div class="go-stats" id="go-stats"></div>
  <button class="go-btn" id="go-restart">再来一局</button>
</div>

const playerSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">

// Touch joystick
const joystickBase=document.getElementById('joystick-base');
const joystickThumb=document.getElementById('joystick-thumb');
const joystickZone=document.getElementById('joystick-zone');

joystickZone.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(joystickActive)return;
  const touch=e.changedTouches[0];
  joystickId=touch.identifier;
  joystickActive=true;
  updateJoystick(touch);
},{passive:false});

joystickZone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===joystickId){
      updateJoystick(e.changedTouches[i]);
      break;
    }
  }
},{passive:false});

joystickZone.addEventListener('touchend',e=>{
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===joystickId){
      joystickActive=false;
      joystickId=null;
      joystickDX=0;joystickDY=0;
      joystickThumb.style.transform='translate(0px,0px)';
      break;
    }
  }
},{passive:false});

function updateJoystick(touch){
  const rect=joystickBase.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  let dx=touch.clientX-cx,dy=touch.clientY-cy;
  const dist=Math.hypot(dx,dy);
  if(dist>JOYSTICK_MAX){dx=dx/dist*JOYSTICK_MAX;dy=dy/dist*JOYSTICK_MAX;}
  joystickDX=dx/JOYSTICK_MAX;joystickDY=dy/JOYSTICK_MAX;
  joystickThumb.style.transform=`translate(${dx}px,${dy}px)`;
}

    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    cards.forEach((card,i)=>{
      const cr=card.getBoundingClientRect();
      const crx=cr.left-rect.left,cry=cr.top-rect.top;
      if(mx>=crx&&mx<=crx+cr.width&&my>=cry&&my<=cr.height)selectUpgrade(i);
    });
  }
});

// ============ HELPERS ============
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function angle(a,b){return Math.atan2(b.y-a.y,b.x-a.x);}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function rand(min,max){return Math.random()*(max-min)+min;}
function randInt(min,max){return Math.floor(rand(min,max+1));}

function randomEdgePos(){
  const m=60;
  const s=randInt(0,3);
  if(s===0)return{x:rand(m,MAP_W-m),y:-m};
  if(s===1)return{x:MAP_W+m,y:rand(m,MAP_H-m)};
  if(s===2)return{x:rand(m,MAP_W-m),y:MAP_H+m};
  return{x:-m,y:rand(m,MAP_H-m)};
}

function spawnMonster(type){
  const pos=randomEdgePos();

  monsters.push({x:pos.x,y:pos.y,hp:t.hp,maxHp:t.hp,dmg:t.dmg,speed:t.speed*(1+waveNum*0.05),size:t.size,color:t.color,xpValue:t.xp,type:type,hitFlash:0});
}
function spawnWave(){
  const count=6+waveNum*3;
  const types=Object.keys(monsterTypes);
  for(let i=0;i<count;i++)spawnMonster(types[randInt(0,Math.min(waveNum-1,types.length-1))]);
}
function spawnBoss(num){
  const bk=Object.keys(bossTypes);
  const k=bk[Math.min(num-1,bk.length-1)];
  const b=bossTypes[k];
  const pos=randomEdgePos();
  const boss={x:pos.x,y:pos.y,hp:b.hp*(1+(num-1)*0.3),maxHp:b.hp*(1+(num-1)*0.3),dmg:b.dmg,speed:b.speed,size:b.size,color:b.color,xpValue:b.xp,type:k,isBoss:true,hitFlash:0,name:b.name};
  monsters.push(boss);bossActive=boss;
  const ba=document.getElementById('boss-announce');
  document.getElementById('ba-text').textContent=b.name;
  document.getElementById('ba-sub').textContent='第 '+num+' 只 BOSS';
  ba.classList.remove('active');void ba.offsetWidth;ba.classList.add('active');
  bossAnnounceTimer=2.5;
}

// ============ WEAPON LOGIC ============
function getWpnCd(id){let cd=weaponDefs[id].cd;cd*=(1-player.cdReduction);return Math.max(cd,0.1);}
function getWpnRange(id){let r=weaponDefs[id].type==='melee'?80:400;return r*(1+player.rangeBonus);}
function getWpnDmg(id,level){let d=10+level*5;d*=(1+player.atkBonus);if(level>=6)d*=1.5;return d;}

function fireWeapon(w){
  const def=weaponDefs[w.id];
  const range=getWpnRange(w.id);
  const dmg=getWpnDmg(w.id,w.level);
  const isSuper=w.level>=6;

  switch(w.id){
    case 'katana':{
      const dir=player.lastDir;const ang=Math.atan2(dir.y,dir.x);
      const count=isSuper?8:3;
      for(let i=0;i<count;i++){
        const a=ang-Math.PI/3+(Math.PI*2/3)*i/(count-1);
        effects.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,dx:Math.cos(a),dy:Math.sin(a),life:0.15,range:range,dmg:dmg,color:'#e8e8e8',type:'slash'});
      }
      break;
    }
    case 'kunai':{
      let nearest=null,nd=Infinity;
      monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nearest=m;nd=d;}});
      if(nearest){const a=angle(player,nearest);const count=isSuper?3:1;
      for(let i=0;i<count;i++){const sp=(i-(count-1)/2)*0.15;
        projectiles.push({x:player.x,y:player.y,dx:Math.cos(a+sp)*500,dy:Math.sin(a+sp)*500,dmg,life:isSuper?2:1.2,color:'#ccc',size:4,penetrate:isSuper});}}
      break;
    }
    case 'staff':{
      const dir=player.lastDir;const ang=Math.atan2(dir.y,dir.x);
      const count=isSuper?12:5;
      for(let i=0;i<count;i++){const a=ang-Math.PI/2+Math.PI*i/(count-1);
        effects.push({x:player.x,y:player.y,dx:Math.cos(a),dy:Math.sin(a),life:0.2,range:range*0.8,dmg,color:'#f77',type:'slash'});}
      break;
    }
    case 'revolver':{
      const count=isSuper?12:6;
      for(let i=0;i<count;i++)setTimeout(()=>{
        if(gameState!=='playing'&&gameState!=='levelup')return;
        let nn=null,nd=Infinity;monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nn=m;nd=d;}});
        if(nn){const a=angle(player,nn)+rand(-0.1,0.1);
          projectiles.push({x:player.x,y:player.y,dx:Math.cos(a)*600,dy:Math.sin(a)*600,dmg,life:1.5,color:'#fe0',size:3,penetrate:false});}
      },i*80);
      break;
    }
    case 'thunderSpear':{
      let nn=null,nd=Infinity;monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nn=m;nd=d;}});
      if(nn){const a=angle(player,nn);
        projectiles.push({x:player.x,y:player.y,dx:Math.cos(a)*450,dy:Math.sin(a)*450,dmg,life:1.5,color:'#0dd',size:5,penetrate:true});
        const sc=isSuper?5:1;
        for(let i=0;i<sc;i++)setTimeout(()=>{
          if(gameState!=='playing'&&gameState!=='levelup')return;
          if(monsters.length>0){const t=monsters[randInt(0,monsters.length-1)];
            effects.push({x:t.x,y:t.y-30,life:0.3,range:40,dmg:dmg*0.8,color:'#0dd',type:'lightning'});}
        },i*150);
      }
      break;
    }
    case 'lightning':{
      const count=isSuper?8:2;
      for(let i=0;i<count;i++)setTimeout(()=>{
        if(gameState!=='playing'&&gameState!=='levelup')return;
        if(monsters.length>0){const t=monsters[randInt(0,monsters.length-1)];
          effects.push({x:t.x,y:t.y-30,life:0.3,range:50,dmg,color:'#fd0',type:'lightning'});}
      },i*100);
      break;
    }
    case 'timeField':{
      const sz=isSuper?200:120;
      effects.push({x:player.x,y:player.y,life:5*(1+player.durationBonus),range:sz,dmg:dmg*0.5,color:'#0dd',type:'timeField'});
      break;
    }
    case 'bomb':{
      let nn=null,nd=Infinity;monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nn=m;nd=d;}});
      const t=nn||{x:player.x+rand(-100,100),y:player.y+rand(-100,100)};
      projectiles.push({x:player.x,y:player.y-20,dx:(t.x-player.x)*3,dy:(t.y-player.y)*3,dmg,life:0.8,color:'#f90',size:6,penetrate:false,explode:isSuper?120:80});
      break;
    }
    case 'poison':{
      effects.push({x:player.x+rand(-100,100),y:player.y+rand(-100,100),life:3*(1+player.durationBonus),range:isSuper?120:70,dmg:dmg*0.3,color:'#4a4',type:'poison'});
      break;
    }
    case 'volleyball':{
      const count=isSuper?3:1;
      for(let i=0;i<count;i++){const a=rand(0,Math.PI*2);
        projectiles.push({x:player.x,y:player.y,dx:Math.cos(a)*300,dy:Math.sin(a)*300,dmg,life:3,color:'#f80',size:8,penetrate:false,bounce:isSuper?5:3});}
      break;
    }
    case 'spear':{
      const dir=player.lastDir;const count=isSuper?6:1;
      for(let i=0;i<count;i++){const a=Math.atan2(dir.y,dir.x)+(i-(count-1)/2)*0.4;
        effects.push({x:player.x+Math.cos(a)*30,y:player.y+Math.sin(a)*30,dx:Math.cos(a),dy:Math.sin(a),life:0.15,range:100,dmg,color:'#d90',type:'thrust'});}
      break;
    }
    case 'hammer':{
      let nn=null,nd=Infinity;monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nn=m;nd=d;}});
      if(nn||isSuper){const count=isSuper?4:1;
      for(let i=0;i<count;i++){const a=nn?angle(player,nn):rand(0,Math.PI*2);
        projectiles.push({x:player.x,y:player.y,dx:Math.cos(a)*350,dy:Math.sin(a)*350,dmg:dmg*1.5,life:1.5,color:'#b97',size:7,penetrate:false,spin:true});}}
      break;
    }
    case 'brick':{
      let nn=null,nd=Infinity;monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nn=m;nd=d;}});
      const target=nn||{x:player.x+rand(-200,200),y:player.y+rand(-200,200)};
      const count=isSuper?3:1;
      for(let i=0;i<count;i++){const a=angle(player,target)+rand(-0.2,0.2);
        projectiles.push({x:player.x,y:player.y-15,dx:Math.cos(a)*400,dy:Math.sin(a)*400,dmg,life:1.2,color:'#d55',size:6,penetrate:false,crit:isSuper&&Math.random()<0.4});}
      break;
    }
    case 'fireWheel':{
      const count=isSuper?4:1;
      for(let i=0;i<count;i++){const a=rand(0,Math.PI*2);
        projectiles.push({x:player.x+Math.cos(a)*30,y:player.y+Math.sin(a)*30,dx:Math.cos(a)*250,dy:Math.sin(a)*250,dmg,life:4,color:'#f40',size:8,penetrate:true,bounce:999});}
      break;
    }
  }
}

// ============ UPGRADE SYSTEM ============
function getAvailableUpgrades(){
  const choices=[];
  const awids=player.weapons.map(w=>w.id);
  const pids=player.passiveItems.map(p=>p.id);
  player.weapons.forEach(w=>{choices.push({type:'weapon_upgrade',weaponId:w.id,weapon:w});});
  if(player.weapons.length<6){const avail=Object.keys(weaponDefs).filter(id=>!awids.includes(id));if(avail.length>0)choices.push({type:'new_weapon',weaponId:avail[randInt(0,avail.length-1)]});}
  if(player.passiveItems.length<6){const avail=Object.keys(passiveDefs).filter(id=>!pids.includes(id));if(avail.length>0)choices.push({type:'new_passive',passiveId:avail[randInt(0,avail.length-1)]});}
  player.passiveItems.forEach(p=>{if(p.level<5)choices.push({type:'passive_upgrade',passiveId:p.id,passive:p});});
  for(let i=choices.length-1;i>0;i--){const j=randInt(0,i);[choices[i],choices[j]]=[choices[j],choices[i]];}
  return choices.slice(0,3);
}

function renderLevelUpChoices(){
  const ctr=document.getElementById('levelup-choices');ctr.innerHTML='';
  levelUpChoices=getAvailableUpgrades();
  levelUpChoices.forEach((c,i)=>{
    const card=document.createElement('div');card.className='choice-card';
    let isvg='',name='',tag='',tagCls='',desc='',lvl='';
    if(c.type==='weapon_upgrade'){
      const w=c.weapon;const d=weaponDefs[w.id];isvg=icons[d.icon];name=d.name;tag='主动技能';tagCls='active';
      desc=w.level+1>=6?`超武: ${d.superName}`:`Lv${w.level+1} - ${d.desc}`;
      lvl=w.level+1>=6?'✦ 超武':`Lv${w.level} → Lv${w.level+1}`;
    }else if(c.type==='new_weapon'){
      const d=weaponDefs[c.weaponId];isvg=icons[d.icon];name=d.name;tag='新主动';tagCls='active';desc=d.desc;lvl='获得新技能';
    }else if(c.type==='new_passive'){
      const d=passiveDefs[c.passiveId];isvg=icons[d.icon];name=d.name;tag='被动道具';tagCls='passive';desc=d.desc;lvl='获得新道具';
    }else if(c.type==='passive_upgrade'){
      const p=c.passive;const d=passiveDefs[p.id];isvg=icons[d.icon];name=d.name;tag='被动升级';tagCls='passive';
      desc=`效果提升至 ${Math.round(d.value*(p.level+1)*100)}%`;lvl=`Lv${p.level} → Lv${p.level+1}`;
    }
    card.innerHTML=`<div class="choice-icon">${isvg}</div><span class="choice-tag ${tagCls}">${tag}</span><div class="choice-name">${name}</div><div class="choice-desc">${desc}</div><div class="choice-lvl">${lvl}</div>`;
    card.addEventListener('click',()=>selectUpgrade(i));
    ctr.appendChild(card);
  });
}

function selectUpgrade(index){
  if(index>=levelUpChoices.length)return;
  const c=levelUpChoices[index];
  if(c.type==='weapon_upgrade'){const w=player.weapons.find(w=>w.id===c.weaponId);if(w)w.level++;}
  else if(c.type==='new_weapon')player.weapons.push({id:c.weaponId,level:1,cd:0});
  else if(c.type==='new_passive'){player.passiveItems.push({id:c.passiveId,level:1});applyPassive(c.passiveId,1);}
  else if(c.type==='passive_upgrade'){const p=player.passiveItems.find(p=>p.id===c.passiveId);if(p){applyPassive(p.id,-p.level);p.level++;applyPassive(p.id,p.level);}}
  levelUpChoices=[];document.getElementById('levelup-modal').classList.remove('active');
  gameState='playing';paused=false;
}

function applyPassive(id,lm){
  const d=passiveDefs[id];const v=d.value*lm;
  switch(d.effect){
    case 'xpBonus':player.xpBonus+=v;break;
    case 'dmgReduction':player.dmgReduction+=v;break;
    case 'atkBonus':player.atkBonus+=v;break;
    case 'cdReduction':player.cdReduction+=v;break;
    case 'rangeBonus':player.rangeBonus+=v;break;
    case 'durationBonus':player.durationBonus+=v;break;
    case 'pickupRange':player.pickupRange+=80*v;break;
    case 'regen':player.regen+=v;break;
    case 'speedBonus':player.speedBonus+=v;break;
    case 'bulletSpeed':player.bulletSpeedBonus+=v;break;
    case 'maxHpBonus':player.maxHpBonus+=v;player.maxHp=100*(1+player.maxHpBonus);player.hp=Math.min(player.hp,player.maxHp);break;
  }
}

function levelUp(){
  player.level++;player.xp-=player.xpToNext;
  player.xpToNext=Math.floor(player.xpToNext*1.18+5);
  player.hp=Math.min(player.hp+20,player.maxHp);
  gameState='levelup';paused=true;
  renderLevelUpChoices();
  document.getElementById('levelup-modal').classList.add('active');
}

function damagePlayer(dmg){
  if(player.invuln>0)return;
  dmg*=(1-player.dmgReduction);player.hp-=dmg;player.invuln=0.3;
  if(player.hp<=0){player.hp=0;endGame(false);}
}

function endGame(won){
  gameState='over';gameOver=true;victory=won;
  const s=document.getElementById('gameover-screen');
  document.getElementById('go-title').textContent=won?'胜利!':'阵亡';
  document.getElementById('go-title').className='go-title '+(won?'win':'lose');
  document.getElementById('go-stats').innerHTML=`存活: <b>${formatTime(timer)}</b><br>等级: <b>Lv${player.level}</b><br>击杀: <b>${player.kills}</b><br>击败BOSS: <b>${bossDefeated}</b>`;
  s.classList.add('active');
}
document.getElementById('go-restart').addEventListener('click',restartGame);

function formatTime(t){const m=Math.floor(t/60),s=Math.floor(t%60);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}

// ============ GAME LOOP ============
function update(dt){
  if(gameState!=='playing')return;if(paused)return;if(gameOver)return;
  dt=Math.min(dt,0.1);timer+=dt;
  if(timer>=TOTAL_TIME){endGame(true);return;}

  const ew=Math.floor(timer/WAVE_INTERVAL)+1;
  if(ew>waveNum){waveNum=ew;spawnWave();if(Math.random()<0.3)chests.push({x:rand(100,MAP_W-100),y:rand(100,MAP_H-100)});}

  const eb=Math.floor(timer/BOSS_INTERVAL);
  if(eb>bossDefeated&&eb<=BOSS_COUNT&&!bossActive)spawnBoss(eb);

  if(bossAnnounceTimer>0){bossAnnounceTimer-=dt;if(bossAnnounceTimer<=0)document.getElementById('boss-announce').classList.remove('active');}

  // Movement: keyboard + joystick
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;

  // Joystick input
  if(joystickActive){mx=joystickDX;my=joystickDY;}

  if(mx!==0||my!==0){const len=Math.hypot(mx,my);mx/=len;my/=len;player.lastDir={x:mx,y:my};}
  const spd=player.speed*(1+player.speedBonus);
  player.x+=mx*spd*dt;player.y+=my*spd*dt;
  player.x=clamp(player.x,20,MAP_W-20);player.y=clamp(player.y,20,MAP_H-20);

  if(player.invuln>0)player.invuln-=dt;
  if(player.regen>0)player.hp=Math.min(player.hp+player.regen*dt,player.maxHp);

  // Weapon CDs
  player.weapons.forEach(w=>{if(w.cd===undefined)w.cd=0;w.cd-=dt;while(w.cd<=0){fireWeapon(w);w.cd+=getWpnCd(w.id);}});

  // Projectiles
  projectiles=projectiles.filter(p=>{
    p.x+=p.dx*dt;p.y+=p.dy*dt;p.life-=dt;
    if(p.life<=0){if(p.explode){effects.push({x:p.x,y:p.y,life:0.3,range:p.explode,dmg:p.dmg*0.8,color:'#f90',type:'explosion'});}return false;}
    if(p.bounce&&p.bounce>0){let b=false;if(p.x<10||p.x>MAP_W-10){p.dx*=-1;b=true;}if(p.y<10||p.y>MAP_H-10){p.dy*=-1;b=true;}if(b)p.bounce--;}
    if(p.x<-100||p.x>MAP_W+100||p.y<-100||p.y>MAP_H+100)return false;return true;
  });

  effects=effects.filter(e=>{e.life-=dt;return e.life>0;});
  particles=particles.filter(p=>{p.life-=dt;return p.life>0;});

  // Collision
  for(let p of projectiles){if(p.life<=0)continue;
    for(let i=monsters.length-1;i>=0;i--){const m=monsters[i];if(dist(p,m)<m.size+5){
      let dmg=p.dmg;if(p.crit)dmg*=2;m.hp-=dmg;m.hitFlash=0.1;
      if(!p.penetrate){p.life=0;if(p.explode){effects.push({x:p.x,y:p.y,life:0.3,range:p.explode,dmg:p.dmg*0.8,color:'#f90',type:'explosion'});}break;}
    }}
  }
  for(let e of effects){if(e.life<=0||e.type==='timeField'||e.type==='poison')continue;
    for(let m of monsters){if(dist(e,m)<m.size+e.range*0.7){m.hp-=e.dmg*dt*5;m.hitFlash=0.05;}}
  }
  for(let e of effects){
    if(e.type==='timeField'){for(let m of monsters){if(dist(e,m)<e.range)m.speed*=0.5;}}
    if(e.type==='poison'){for(let m of monsters){if(dist(e,m)<e.range){m.hp-=e.dmg*dt;m.hitFlash=0.02;}}}
  }

  // Kill monsters
  for(let i=monsters.length-1;i>=0;i--){const m=monsters[i];
    if(m.hp<=0){
      const xc=m.isBoss?15:randInt(1,3);
      for(let j=0;j<xc;j++)xpOrbs.push({x:m.x+rand(-20,20),y:m.y+rand(-20,20),value:m.isBoss?m.xpValue/xc:5});
      if(m.isBoss){bossActive=null;bossDefeated++;chests.push({x:m.x,y:m.y,bossChest:true});}
      player.kills++;player.xp+=m.xpValue*(1+player.xpBonus);
      monsters.splice(i,1);
    }
  }

  // Monster AI
  monsters.forEach(m=>{const a=angle(m,player);let spd=m.speed;for(let e of effects){if(e.type==='timeField'&&dist(e,m)<e.range)spd*=0.5;}m.x+=Math.cos(a)*spd*dt*60;m.y+=Math.sin(a)*spd*dt*60;});

  // Damage player
  monsters.forEach(m=>{if(dist(m,player)<m.size+12)damagePlayer(m.dmg*dt);});

  // XP pickup
  for(let i=xpOrbs.length-1;i>=0;i--){const o=xpOrbs[i];const d=dist(player,o);
    if(d<player.pickupRange){const a=angle(o,player);o.x+=Math.cos(a)*300*dt;o.y+=Math.sin(a)*300*dt;if(d<15){player.xp+=o.value*(1+player.xpBonus);xpOrbs.splice(i,1);}}}

  // Chests
  for(let i=chests.length-1;i>=0;i--){const c=chests[i];
    if(dist(player,c)<30){const pids=Object.keys(passiveDefs);const pid=pids[randInt(0,pids.length-1)];
      const ex=player.passiveItems.find(p=>p.id===pid);
      if(ex&&ex.level<5){applyPassive(pid,-ex.level);ex.level++;applyPassive(pid,ex.level);}
      else if(!ex&&player.passiveItems.length<6){player.passiveItems.push({id:pid,level:1});applyPassive(pid,1);}
      chests.splice(i,1);
    }
  }

  while(player.xp>=player.xpToNext)levelUp();
  updateHUD();
}

function updateHUD(){
  document.getElementById('hud-timer').textContent=formatTime(timer);
  document.getElementById('hud-wave').textContent=`波次 ${waveNum}`;
  document.getElementById('hud-kills').textContent=`击杀 ${player.kills}`;
  document.getElementById('hud-level').textContent=`Lv.${player.level}`;
  document.getElementById('hp-inner').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('xp-inner').style.width=(player.xp/player.xpToNext*100)+'%';
  document.getElementById('hud-boss-warn').style.display=bossActive?'block':'none';
  updateWeaponSlots();
}

function updateWeaponSlots(){
  const slots=document.getElementById('weapon-slots');
  let html='';
  player.weapons.forEach(w=>{
    const d=weaponDefs[w.id];
    html+=`<div class="wpn-slot">${icons[d.icon]}<span class="lvl">${w.level>=6?'S':w.level}</span></div>`;
  });
  slots.innerHTML=html;
}

// ============ RENDER ============
function drawBackground(){
  // Colorful space background
  const grad=ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,'#0e0e30');grad.addColorStop(0.5,'#18184a');grad.addColorStop(1,'#0e0e2a');
  ctx.fillStyle=grad;ctx.fillRect(0,0,canvas.width,canvas.height);

  // Stars
  ctx.fillStyle='#fff';
  for(let i=0;i<80;i++){
    const sx=(i*137.5+500)%canvas.width,sy=(i*97.3+300)%canvas.height;
    const twinkle=Math.sin(Date.now()*0.002+i)*0.5+0.5;
    ctx.globalAlpha=0.3+twinkle*0.5;
    ctx.beginPath();ctx.arc(sx,sy,(i%3)+1,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Grid (subtle)
  ctx.save();ctx.translate(-camera.x,-camera.y);
  ctx.strokeStyle='rgba(100,150,255,0.06)';ctx.lineWidth=1;
  const sx=Math.floor(camera.x/TILE)*TILE,sy=Math.floor(camera.y/TILE)*TILE;
  for(let x=sx;x<camera.x+canvas.width+TILE;x+=TILE){ctx.beginPath();ctx.moveTo(x,camera.y);ctx.lineTo(x,camera.y+canvas.height);ctx.stroke();}
  for(let y=sy;y<camera.y+canvas.height+TILE;y+=TILE){ctx.beginPath();ctx.moveTo(camera.x,y);ctx.lineTo(camera.x+canvas.width,y);ctx.stroke();}

  // Map border - cartoon purple
  ctx.strokeStyle='rgba(120,80,255,0.35)';ctx.lineWidth=4;ctx.strokeRect(2,2,MAP_W-4,MAP_H-4);

  // Decorative space elements
  ctx.fillStyle='rgba(100,80,255,0.03)';
  for(let i=0;i<6;i++){
    const dx=(i*250+100)%MAP_W,dy=(i*180+200)%MAP_H;
    ctx.fillRect(dx,dy,rand(40,100),rand(30,80));
  }
  ctx.restore();
}

function drawMonster(m){
  if(!monsterImg)return;
  ctx.save();ctx.translate(m.x-camera.x,m.y-camera.y);
  const s=m.size;
  const scale=m.isBoss?s*2.5/500:s*2/500;
  const w=500*scale,h=500*scale;
  if(m.hitFlash>0&&Math.floor(m.hitFlash*30)%2===0)ctx.globalAlpha=0.5;
  ctx.drawImage(monsterImg,-w/2,-h/2,w,h);
  ctx.globalAlpha=1;
  if(m.isBoss){
    const bw=100,bh=7,bx=-bw/2,by=-h/2-12;
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#ff3355';ctx.fillRect(bx,by,bw*(m.hp/m.maxHp),bh);
    ctx.fillStyle='#fff';ctx.font='bold 9px Game,PingFang SC,sans-serif';ctx.textAlign='center';
    ctx.fillText(m.name,bx+bw/2,by-4);
  }
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  camera.x=player.x-canvas.width/2;camera.y=player.y-canvas.height/2;
  drawBackground();

  // XP orbs
  xpOrbs.forEach(o=>{
    ctx.fillStyle='#ffcc00';ctx.shadowColor='#ffcc00';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(o.x-camera.x,o.y-camera.y,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  });

  // Chests
  chests.forEach(c=>{
    const cx=c.x-camera.x,cy=c.y-camera.y;
    ctx.fillStyle='#ffcc00';ctx.shadowColor='#ffcc00';ctx.shadowBlur=10;
    ctx.fillRect(cx-14,cy-10,28,20);ctx.fillStyle='#cc8800';
    ctx.fillRect(cx-12,cy-6,24,6);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(cx-8,cy-8,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+8,cy-4,1.5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  // Effects
  effects.forEach(e=>{
    const ex=e.x-camera.x,ey=e.y-camera.y;
    ctx.save();
    switch(e.type){
      case 'slash':case 'thrust':
        ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.shadowColor=e.color;ctx.shadowBlur=6;
        ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+e.dx*e.range,ey+e.dy*e.range);ctx.stroke();break;
      case 'lightning':
        ctx.strokeStyle=e.color;ctx.lineWidth=2;ctx.shadowColor=e.color;ctx.shadowBlur=8;
        ctx.beginPath();ctx.moveTo(ex,ey);let lx=ex,ly=ey;
        for(let j=0;j<5;j++){lx+=rand(-15,15);ly+=e.range/5;ctx.lineTo(lx,ly);}ctx.stroke();break;
      case 'timeField':
        ctx.strokeStyle=e.color;ctx.lineWidth=2;ctx.setLineDash([8,5]);ctx.shadowColor=e.color;ctx.shadowBlur=14;
        ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='rgba(0,200,220,0.06)';ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.fill();break;
      case 'poison':
        ctx.fillStyle='rgba(60,180,60,0.2)';ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#4a4';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);break;
      case 'explosion':
        const a=e.life/0.3;ctx.fillStyle=`rgba(255,150,20,${a*0.3})`;ctx.beginPath();ctx.arc(ex,ey,e.range*(1-a),0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=`rgba(255,200,60,${a})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ey,e.range*(1-a*0.5),0,Math.PI*2);ctx.stroke();break;
    }
    ctx.shadowBlur=0;ctx.restore();
  });

  // Projectiles
  projectiles.forEach(p=>{
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.beginPath();
    if(p.spin){ctx.save();ctx.translate(p.x-camera.x,p.y-camera.y);ctx.rotate(Date.now()*0.015);ctx.fillRect(-p.size,-p.size/2,p.size*2,p.size);ctx.restore();}
    else ctx.arc(p.x-camera.x,p.y-camera.y,p.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  });

  // Monsters
  monsters.forEach(m=>drawMonster(m));

  // Particles
  particles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=p.life/0.5;ctx.beginPath();ctx.arc(p.x-camera.x+rand(-2,2),p.y-camera.y+rand(-2,2),p.size*p.life*2,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  // ===== PLAYER =====
  const px=player.x-camera.x,py=player.y-camera.y;
  if(player.invuln>0&&Math.floor(player.invuln*20)%2===0)ctx.globalAlpha=0.4;
  if(playerImg){
    const pScale=0.16;
    const pw=500*pScale,ph=500*pScale;
    ctx.save();ctx.translate(px,py);
    const angle=Math.atan2(player.lastDir.y,player.lastDir.x);
    ctx.rotate(angle+Math.PI/2);
    ctx.drawImage(playerImg,-pw/2,-ph/2,pw,ph);
    ctx.restore();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

// ============ MAIN LOOP ============
function gameLoop(ts){
  if(!lastTime)lastTime=ts;
  let dt=(ts-lastTime)/1000;if(dt>0.1)dt=0.1;lastTime=ts;
  if(gameState==='playing')update(dt);
  render();requestAnimationFrame(gameLoop);
}

function startGame(){
  if(!monsterImg||!playerImg)loadSprites();
  player.x=MAP_W/2;player.y=MAP_H/2;
  player.hp=100;player.maxHp=100;
  player.xp=0;player.xpToNext=30;player.level=1;player.speed=180;
  player.weapons=[{id:'katana',level:1,cd:0}];player.passiveItems=[];
  player.pickupRange=80;
  player.atkBonus=0;player.dmgReduction=0;player.cdReduction=0;player.rangeBonus=0;
  player.durationBonus=0;player.speedBonus=0;player.bulletSpeedBonus=0;player.xpBonus=0;
  player.regen=0;player.maxHpBonus=0;player.invuln=0;player.kills=0;
  player.lastDir={x:0,y:-1};
  monsters=[];projectiles=[];effects=[];xpOrbs=[];chests=[];particles=[];
  timer=0;waveNum=1;bossDefeated=0;bossActive=null;
  gameOver=false;victory=false;paused=false;gameState='playing';
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('levelup-modal').classList.remove('active');
  updateHUD();spawnWave();
}
function restartGame(){startGame();}

// Start
startGame();
requestAnimationFrame(gameLoop);
</script>
