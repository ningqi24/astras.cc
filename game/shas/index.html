<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<title>鲨鲨幸存者</title>
<style>
/* ============ FOUNDATION ============ */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#1b1c2b;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;}

#game-container{width:100vw;height:100vh;position:relative;display:flex;justify-content:center;align-items:center;}

canvas{display:block;position:absolute;inset:0;}

/* ============ LANDSCAPE WARNING ============ */
/* Loading Screen */
#loading-screen{display:flex;position:fixed;inset:0;background:#1b1c2b;z-index:9999;flex-direction:column;justify-content:center;align-items:center;}
#loading-logo{color:#fca311;font-size:48px;font-weight:900;letter-spacing:6px;text-shadow:3px 3px 0 #000;margin-bottom:30px;font-family:'Noto Sans SC','PingFang SC',sans-serif;}
#loading-bar-wrap{width:60%;max-width:400px;height:14px;background:#3a3d5c;border:3px solid #000;border-radius:12px;overflow:hidden;}
#loading-bar-fill{height:100%;background:#fca311;width:0%;transition:width 0.3s ease;border-radius:12px;}
#loading-ver{color:#6c757d;font-size:12px;margin-top:12px;font-weight:700;}

/* Lobby Screen */
#lobby-screen{display:none;position:fixed;inset:0;background:#1b1c2b;z-index:9998;flex-direction:column;justify-content:center;align-items:center;}
#lobby-screen.active{display:flex;}
#lobby-title{color:#fca311;font-size:36px;font-weight:900;letter-spacing:4px;margin-bottom:8px;text-shadow:3px 3px 0 #000;font-family:'Noto Sans SC','PingFang SC',sans-serif;}
#lobby-sub{color:#4cc9f0;font-size:14px;font-weight:700;margin-bottom:30px;}
#lobby-start-btn{border:5px solid #000;padding:12px 40px;font-size:18px;font-weight:900;cursor:pointer;border-radius:24px;background:#fca311;color:#000;letter-spacing:2px;transition:transform 0.06s;font-family:'Noto Sans SC','PingFang SC',sans-serif;}
#lobby-start-btn:active{transform:scale(0.94);}
#lobby-ver{color:#6c757d;font-size:11px;margin-top:40px;font-weight:700;}

/* ============ SHARED BLOB ART TOKENS ============ */
/* 6-10px black outline on all UI, no gradients, big rounded corners 20-30px */

/* ============ HUD - TOP BAR ============ */

/* Progress bar - top center */
#progress-bar-wrap{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:60%;max-width:500px;z-index:20;pointer-events:none;}
#progress-bar{width:100%;height:14px;background:#3a3d5c;border:3px solid #000;border-radius:12px;overflow:hidden;position:relative;}
#progress-fill{height:100%;background:#fca311;transition:width 0.3s ease;border-radius:12px;}
.progress-boss-marker{position:absolute;top:-3px;width:2.5px;height:20px;background:#e63946;z-index:2;}
.progress-boss-label{position:absolute;top:18px;font-size:9px;font-weight:900;color:#e63946;transform:translateX(-50%);text-shadow:1px 1px 0 #000;white-space:nowrap;}

#hud{position:absolute;top:22px;left:10px;right:10px;pointer-events:none;z-index:10;display:flex;justify-content:flex-end;align-items:flex-start;}

.hud-panel{background:#f8f9fa;border:6px solid #000;border-radius:24px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px;}

/* Right cluster */
#hud-right{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
#hud-right .info-text{font-size:14px;font-weight:900;color:#1b1c2b;}

/* Wave announcement - center top */
#wave-announce{position:absolute;top:90px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:15;font-size:18px;font-weight:900;color:#fff;letter-spacing:3px;display:none;text-shadow:2px 2px 0 #000;}
#wave-announce.show{display:block;animation:waveIn 0.4s ease-out;}
@keyframes waveIn{0%{transform:translateX(-50%) scale(0.5);opacity:0;}100%{transform:translateX(-50%) scale(1);opacity:1;}}

/* XP Bar */
#xp-bar{position:absolute;top:23px;left:16px;width:120px;z-index:10;pointer-events:none;}
#xp-outer{width:100%;height:10px;background:#444;border-radius:20px;overflow:hidden;}
#xp-inner{height:100%;background:#fca311;transition:width 0.2s ease;border-radius:20px;}
#hp-bar{position:absolute;top:38px;left:16px;width:120px;z-index:10;pointer-events:none;}
#hp-outer{width:100%;height:10px;background:#444;border-radius:20px;overflow:hidden;}
#hp-inner{height:100%;background:#e63946;transition:width 0.2s ease;border-radius:20px;}

/* ============ WEAPON SLOTS - BOTTOM ============ */
#weapon-slots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10;pointer-events:none;}
.wpn-slot{width:38px;height:38px;border-radius:14px;border:5px solid #000;background:#f8f9fa;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.wpn-slot svg{width:26px;height:26px;}
.wpn-slot .lvl{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;border:2.5px solid #000;background:#fca311;color:#000;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.wpn-slot .cd-mask{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);pointer-events:none;}
.wpn-slot.super{border-color:#fca311;box-shadow:0 0 14px rgba(252,163,17,0.8),inset 0 0 8px rgba(252,163,17,0.3);animation:wpn-glow 1.2s ease-in-out infinite;}
.wpn-slot.super .lvl{background:#ffd700;color:#000;width:18px;height:18px;bottom:-3px;right:-3px;font-size:9px;box-shadow:0 0 6px rgba(255,215,0,0.8);}
@keyframes wpn-glow{0%,100%{box-shadow:0 0 10px rgba(252,163,17,0.6),inset 0 0 4px rgba(252,163,17,0.2);}50%{box-shadow:0 0 22px rgba(252,163,17,1),inset 0 0 12px rgba(252,163,17,0.5);}}

/* Passive buff icons - right side middle */
#passive-buffs{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:10;pointer-events:none;}
.passive-icon{padding:3px 8px;border:3px solid #000;border-radius:10px;background:#4cc9f0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;white-space:nowrap;}
.passive-lvl{color:#fca311;font-size:9px;margin-left:2px;text-shadow:1px 1px 0 #000;}

/* ============ MOBILE JOYSTICK ============ */
#joystick-zone{position:absolute;bottom:10px;left:10px;width:130px;height:130px;z-index:50;pointer-events:all;}
#joystick-base{width:130px;height:130px;border-radius:50%;border:5px solid rgba(0,0,0,0.3);background:rgba(255,255,255,0.08);position:relative;}
#joystick-thumb{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.15);border:4px solid rgba(0,0,0,0.25);position:absolute;top:38px;left:38px;transition:transform 0.04s;}

/* Slide Button */
#slide-btn{position:absolute;bottom:10px;right:10px;width:72px;height:72px;z-index:50;border-radius:50%;border:5px solid rgba(0,0,0,0.3);background:rgba(76,201,240,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;transition:background 0.15s;font-size:26px;font-weight:900;color:#4cc9f0;text-shadow:2px 2px 0 #000;font-family:'Noto Sans SC','PingFang SC',sans-serif;padding:0;line-height:1;}
#slide-btn:active{background:rgba(76,201,240,0.4);}
#slide-btn.on-cd{background:rgba(100,100,100,0.2);color:#555;}

/* ============ LEVEL UP MODAL ============ */
#levelup-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(27,28,43,0.85);justify-content:center;align-items:center;flex-direction:column;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
#levelup-modal.active{display:flex;}

.levelup-title{font-size:24px;font-weight:900;color:#fca311;margin-bottom:12px;letter-spacing:4px;text-shadow:2px 2px 0 #000;}

.levelup-choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

.choice-card{width:130px;background:#31344e;border:6px solid #000;border-radius:22px;padding:10px 8px;cursor:pointer;transition:all 0.12s ease;text-align:center;position:relative;}
.choice-card:hover,.choice-card:active{border-color:#4cc9f0;box-shadow:0 0 18px rgba(76,201,240,0.7);transform:scale(1.08);}
.choice-card.chosen{border-color:#4cc9f0;box-shadow:0 0 18px rgba(76,201,240,0.7);}
.choice-card.selected{border-color:#fca311;background:#4a3d1a;}
.choice-icon{width:36px;height:36px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;}
.choice-icon svg{width:32px;height:32px;}
.choice-name{color:#fff;font-size:11px;font-weight:900;margin-bottom:2px;}
.choice-tag{display:inline-block;font-size:8px;padding:2px 8px;border-radius:12px;margin-bottom:4px;font-weight:900;text-transform:uppercase;letter-spacing:1px;border:2.5px solid #000;}
.choice-tag.active{background:#4cc9f0;color:#000;}
.choice-tag.passive{background:#fca311;color:#000;}
.choice-card.super{border-color:#fca311;box-shadow:0 0 22px rgba(252,163,17,0.9);background:#3a2f1a;animation:card-glow 0.8s ease-in-out infinite;}
.choice-card.super:hover,.choice-card.super:active{border-color:#ffd700;box-shadow:0 0 30px rgba(255,215,0,1);}
@keyframes card-glow{0%,100%{box-shadow:0 0 16px rgba(252,163,17,0.7);}50%{box-shadow:0 0 28px rgba(252,163,17,1);}}
.choice-desc{color:#ccc;font-size:9px;line-height:1.3;margin-bottom:3px;}
.choice-lvl{color:#4cc9f0;font-size:10px;font-weight:900;}

/* Selected state overlay */
.choice-card .check-mark{display:none;position:absolute;inset:0;border-radius:20px;background:rgba(76,201,240,0.2);justify-content:center;align-items:center;font-size:28px;color:#4cc9f0;font-weight:900;}
.choice-card.chosen .check-mark{display:flex;}

/* ============ BOSS ANNOUNCE ============ */
#boss-announce{display:none;position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);z-index:150;pointer-events:none;text-align:center;}
#boss-announce.active{display:block;animation:bossFade 2.5s forwards;}
#boss-announce .ba-text{color:#e63946;font-size:42px;font-weight:900;letter-spacing:6px;text-shadow:4px 4px 0 #000;}
#boss-announce .ba-sub{color:#fca311;font-size:18px;font-weight:900;margin-top:8px;text-shadow:2px 2px 0 #000;}
@keyframes bossFade{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3);}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}25%{transform:translate(-50%,-50%) scale(1);}70%{opacity:1;}100%{opacity:0;}}

/* ============ LOW HP WARNING ============ */
#hp-warning{display:none;position:fixed;inset:0;z-index:90;pointer-events:none;border:8px solid transparent;transition:border-color 0.3s;}
#hp-warning.active{border-color:rgba(230,57,70,0.7);animation:hpFlash 0.5s infinite;}
@keyframes hpFlash{50%{border-color:rgba(230,57,70,0.15);}}

/* ============ GAME OVER ============ */
#gameover-screen{display:none;position:fixed;inset:0;z-index:200;background:rgba(27,28,43,0.9);justify-content:center;align-items:center;flex-direction:column;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);}
#gameover-screen.active{display:flex;}
.go-shark{font-size:36px;margin-bottom:4px;animation:sharkBounce 0.6s ease-in-out infinite alternate;}
@keyframes sharkBounce{0%{transform:translateY(0);}100%{transform:translateY(-10px);}}
.go-title{font-size:22px;font-weight:900;letter-spacing:3px;margin-bottom:8px;text-shadow:2px 2px 0 #000;}
.go-title.win{color:#fca311;}
.go-title.lose{color:#e63946;}
.go-stats{font-size:11px;font-weight:700;margin-bottom:12px;text-align:center;line-height:1.8;color:#f8f9fa;}
.go-stats b{color:#fca311;font-weight:900;}
.go-buttons{display:flex;gap:12px;}
.go-btn{border:4px solid #000;padding:8px 18px;font-family:inherit;font-size:13px;cursor:pointer;border-radius:20px;font-weight:900;letter-spacing:1px;transition:transform 0.08s ease;min-width:80px;}
.go-btn:active{transform:scale(0.94);}
.go-btn.restart{background:#fca311;color:#000;}
.go-btn.home{background:#4cc9f0;color:#000;}

/* ============ PAUSE ============ */
#pause-panel{display:none;position:fixed;inset:0;z-index:180;background:rgba(27,28,43,0.75);justify-content:center;align-items:center;flex-direction:column;}
#pause-panel.active{display:flex;}
#pause-inner{background:#f8f9fa;border:8px solid #000;border-radius:32px;padding:30px 40px;text-align:center;width:min(400px,80vw);}
#pause-inner .pause-title{font-size:28px;font-weight:900;color:#1b1c2b;margin-bottom:20px;letter-spacing:4px;}
.pause-btn{display:block;width:100%;margin-bottom:10px;padding:12px;border:6px solid #000;border-radius:22px;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;background:#4cc9f0;color:#000;transition:transform 0.06s;letter-spacing:2px;}
.pause-btn:active{transform:scale(0.95);}
.pause-btn.quit{background:#e63946;color:#fff;}
.pause-shark{margin-top:14px;animation:sharkRun 0.3s steps(4) infinite;}
@keyframes sharkRun{0%{transform:translateX(-20px);}100%{transform:translateX(20px);}}

/* ============ DAMAGE FLOAT ============ */
#dmg-floats{position:fixed;inset:0;pointer-events:none;z-index:80;}
.dmg-float{position:absolute;font-size:22px;font-weight:900;color:#e63946;text-shadow:3px 3px 0 #000;animation:dmgUp 0.8s ease-out forwards;}
@keyframes dmgUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-40px);}}
</style>
</head>
<body>

<div id="loading-screen">
  <div id="loading-logo">鲨鲨幸存者</div>
  <div id="loading-bar-wrap">
    <div id="loading-bar-fill" style="width:0%"></div>
  </div>
  <div id="loading-ver">v3.0</div>
</div>

<div id="lobby-screen">
  <div id="lobby-title">鲨鲨幸存者</div>
  <div id="lobby-sub">— 在太空杀中存活下去 —</div>
  <button id="lobby-start-btn">开始游戏</button>
  <div id="lobby-ver">v3.0</div>
</div>

<div id="game-container">
  <canvas id="game"></canvas>

  <!-- Progress Bar -->
  <div id="progress-bar-wrap">
    <div id="progress-bar">
      <div id="progress-fill" style="width:0%"></div>
      <div id="progress-markers"></div>
    </div>
  </div>

  <!-- HUD Top Bar -->
  <div id="hud">
    <div id="hud-right">
      <div class="hud-panel">
        <span class="info-text" id="hud-timer">00:00</span>
      </div>
      <div class="hud-panel">
        <span class="info-text" style="font-size:12px;" id="hud-energy">0</span>
      </div>
    </div>
  </div>

  <!-- Wave Announcement -->
  <div id="wave-announce">
    <div id="wave-text"></div>
    <div id="wave-sub" style="font-size:13px;margin-top:4px;"></div>
  </div>

  <!-- XP Bar -->
  <div id="xp-bar"><div id="xp-outer"><div id="xp-inner" style="width:0%"></div></div></div>
  <div id="hp-bar"><div id="hp-outer"><div id="hp-inner" style="width:100%"></div></div></div>

  <!-- Weapon Slots -->
  <div id="weapon-slots"></div>

  <!-- Passive Buffs -->
  <div id="passive-buffs"></div>

  <!-- Joystick -->
  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-thumb"></div>
    </div>
  </div>

  <!-- Slide Button -->
  <button id="slide-btn">滑</button>

  <!-- HP Warning Border -->
  <div id="hp-warning"></div>

  <!-- Damage Floats -->
  <div id="dmg-floats"></div>

  <!-- Level Up Modal -->
  <div id="levelup-modal">
    <div class="levelup-title">升级!</div>
    <div class="levelup-choices" id="levelup-choices"></div>
  </div>

  <!-- Boss Announce -->
  <div id="boss-announce">
    <div class="ba-text" id="ba-text"></div>
    <div class="ba-sub" id="ba-sub"></div>
  </div>

  <!-- Pause -->
  <div id="pause-panel">
    <div id="pause-inner">
      <div class="pause-title">暂停</div>
      <button class="pause-btn" id="pause-resume">继续游戏</button>
      <button class="pause-btn quit" id="pause-quit">退出本局</button>
      <div class="pause-shark">
        <svg viewBox="0 0 120 60" width="120" height="60"><ellipse cx="60" cy="35" rx="25" ry="18" fill="#4cc9f0" stroke="#000" stroke-width="5"/><circle cx="48" cy="28" r="5" fill="#fff" stroke="#000" stroke-width="3"/><circle cx="50" cy="26" r="2.5" fill="#000"/><polygon points="90,25 110,35 90,45" fill="#4cc9f0" stroke="#000" stroke-width="4"/><path d="M45 42 Q60 50 75 42" fill="none" stroke="#000" stroke-width="3"/></svg>
      </div>
    </div>
  </div>

  <!-- Game Over -->
  <div id="gameover-screen">
    <div class="go-shark" id="go-shark-emoji"></div>
    <div class="go-title" id="go-title"></div>
    <div class="go-stats" id="go-stats"></div>
    <div class="go-buttons">
      <button class="go-btn restart" id="go-restart">再来一局</button>
      <button class="go-btn home" id="go-home">返回大厅</button>
    </div>
  </div>
</div>

<script>
// ============ GAME CONSTANTS ============
const MAP_W=1500,MAP_H=500;
const TILE=40;
const TOTAL_TIME=480;
const WAVE_INTERVAL=35;
const BOSS_INTERVAL=150;
const BOSS_COUNT=3;

// ============ SVG ICONS ============
const icons={
  katana:`<svg viewBox="0 0 48 48"><rect x="22" y="2" width="4" height="28" rx="2" fill="#e8e8e8" stroke="#000" stroke-width="2"/><rect x="20" y="28" width="8" height="4" rx="2" fill="#b0b0b0" stroke="#000" stroke-width="2"/><circle cx="24" cy="42" r="3" fill="#888" stroke="#000" stroke-width="2"/><rect x="7" y="3" width="5" height="18" rx="2" fill="#ccc" stroke="#000" stroke-width="2"/></svg>`,
  kunai:`<svg viewBox="0 0 48 48"><polygon points="24,2 19,12 24,8 29,12" fill="#d0d0d0" stroke="#000" stroke-width="2"/><rect x="22" y="12" width="4" height="18" rx="1" fill="#aaa" stroke="#000" stroke-width="2"/><rect x="10" y="26" width="28" height="10" rx="4" fill="#777" stroke="#000" stroke-width="2"/></svg>`,
  revolver:`<svg viewBox="0 0 48 48"><rect x="26" y="12" width="16" height="12" rx="4" fill="#999" stroke="#000" stroke-width="3"/><rect x="8" y="15" width="18" height="6" rx="2" fill="#bbb" stroke="#000" stroke-width="2"/><circle cx="42" cy="18" r="6" fill="#777" stroke="#000" stroke-width="3"/><circle cx="42" cy="18" r="3" fill="#555"/></svg>`,
  thunder:`<svg viewBox="0 0 48 48"><polygon points="25,2 18,22 26,18 20,44 32,24 23,28" fill="#00dddd" stroke="#000" stroke-width="2"/><rect x="6" y="40" width="36" height="5" rx="2" fill="#00aaaa" stroke="#000" stroke-width="2"/></svg>`,
  lightning:`<svg viewBox="0 0 48 48"><polygon points="25,2 13,24 23,20 15,44 36,22 24,26" fill="#ffdd00" stroke="#000" stroke-width="2"/></svg>`,
  timeField:`<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="#00dddd" stroke-width="3" stroke-dasharray="8,5"/><circle cx="24" cy="24" r="8" fill="rgba(0,221,221,0.15)" stroke="#00dddd" stroke-width="2"/><line x1="24" y1="24" x2="24" y2="12" stroke="#00dddd" stroke-width="3" stroke-linecap="round"/><line x1="24" y1="24" x2="30" y2="24" stroke="#00dddd" stroke-width="3" stroke-linecap="round"/></svg>`,
  bomb:`<svg viewBox="0 0 48 48"><circle cx="24" cy="26" r="16" fill="#555" stroke="#000" stroke-width="3"/><circle cx="24" cy="26" r="10" fill="#666"/><rect x="22" y="4" width="4" height="8" rx="1" fill="#888" stroke="#000" stroke-width="2"/><circle cx="24" cy="4" r="5" fill="#ff9900" stroke="#000" stroke-width="2"/></svg>`,
  poison:`<svg viewBox="0 0 48 48"><rect x="12" y="22" width="24" height="22" rx="5" fill="#44aa44" stroke="#000" stroke-width="2"/><rect x="8" y="12" width="32" height="14" rx="4" fill="#33aa33" stroke="#000" stroke-width="2"/></svg>`,
  volleyball:`<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="14" fill="#ff8800" stroke="#000" stroke-width="3"/><path d="M11,14 Q24,8 37,14" fill="none" stroke="#fff" stroke-width="2"/><path d="M11,34 Q24,40 37,34" fill="none" stroke="#fff" stroke-width="2"/></svg>`,
  spear:`<svg viewBox="0 0 48 48"><rect x="22" y="16" width="4" height="30" rx="2" fill="#8B4513" stroke="#5a2d0c" stroke-width="1.5"/><rect x="20" y="14" width="8" height="6" rx="2" fill="#cc0000"/><rect x="22" y="13" width="4" height="5" rx="1" fill="#dd2222"/><polygon points="24,0 17,14 24,6 31,14" fill="#ffd700" stroke="#b8860b" stroke-width="2"/><polygon points="24,2 19,10 24,6 29,10" fill="#ffec80"/><polygon points="24,48 22,42 26,42" fill="#999" stroke="#777" stroke-width="1"/></svg>`,

// Touch joystick
const joystickBase=document.getElementById('joystick-base');
const joystickThumb=document.getElementById('joystick-thumb');
const joystickZone=document.getElementById('joystick-zone');

joystickZone.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(joystickActive)return;
  const touch=e.changedTouches[0];
  joystickId=touch.identifier;
  joystickActive=true;
  updateJoystick(touch);
},{passive:false});

joystickZone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===joystickId){
      updateJoystick(e.changedTouches[i]);
      break;
    }
  }
},{passive:false});

joystickZone.addEventListener('touchend',e=>{
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===joystickId){
      joystickActive=false;joystickId=null;
      joystickDX=0;joystickDY=0;
      joystickThumb.style.transform='translate(0px,0px)';
      break;
    }
  }
},{passive:false});

function updateJoystick(touch){
  const rect=joystickBase.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  let dx=touch.clientX-cx,dy=touch.clientY-cy;
  const dist=Math.hypot(dx,dy);
  if(dist>JOYSTICK_MAX){dx=dx/dist*JOYSTICK_MAX;dy=dy/dist*JOYSTICK_MAX;}
  joystickDX=dx/JOYSTICK_MAX;joystickDY=dy/JOYSTICK_MAX;
  joystickThumb.style.transform=`translate(${dx}px,${dy}px)`;
}

// Levelup card click
canvas.addEventListener('click',e=>{
  if(gameState==='levelup'){
    const cards=document.querySelectorAll('.choice-card');
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    cards.forEach((card,i)=>{
      const cr=card.getBoundingClientRect();
      const crx=cr.left-rect.left,cry=cr.top-rect.top;
      if(mx>=crx&&mx<=crx+cr.width&&my>=cry&&my<=cr.height)selectUpgrade(i);
    });
  }
});

// ============ HELPERS ============
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function angle(a,b){return Math.atan2(b.y-a.y,b.x-a.x);}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function rand(min,max){return Math.random()*(max-min)+min;}
function randInt(min,max){return Math.floor(rand(min,max+1));}

function randomEdgePos(){
  const m=60;
  const s=randInt(0,3);
  if(s===0)return{x:rand(m,MAP_W-m),y:-m};
  if(s===1)return{x:MAP_W+m,y:rand(m,MAP_H-m)};
  if(s===2)return{x:rand(m,MAP_W-m),y:MAP_H+m};
  return{x:-m,y:rand(m,MAP_H-m)};
}

  const pos=randomEdgePos();

  monsters.push({x:pos.x,y:pos.y,hp:t.hp,maxHp:t.hp,dmg:t.dmg,speed:t.speed*(1+waveNum*0.05),size:t.size,color:t.color,xpValue:t.xp,type:type,behavior:t.behavior,behaviorCD:rand(1,3),hitFlash:0});
}
function spawnWave(){
  const count=6+waveNum*3;
  const types=Object.keys(monsterTypes);
  for(let i=0;i<count;i++)spawnMonster(types[randInt(0,Math.min(waveNum-1,types.length-1))]);
  showWaveAnnounce(`怪物即将来袭!  Wave ${waveNum}`);
}
function spawnBoss(num){
  const bk=Object.keys(bossTypes);
  const k=bk[Math.min(num-1,bk.length-1)];
  const b=bossTypes[k];
  const pos=randomEdgePos();
  const boss={x:pos.x,y:pos.y,hp:b.hp*(1+(num-1)*0.3),maxHp:b.hp*(1+(num-1)*0.3),dmg:b.dmg,speed:b.speed,size:b.size,color:b.color,xpValue:b.xp,type:k,isBoss:true,behavior:b.behavior,behaviorCD:1.5,hitFlash:0,name:b.name};
  monsters.push(boss);bossActive=boss;
  document.getElementById('ba-text').textContent=b.name;

// ============ WEAPON LOGIC ============
function getWpnCd(id){let cd=weaponDefs[id].cd;cd*=(1-player.cdReduction);return Math.max(cd,0.1);}
function getWpnRange(id){let r=weaponDefs[id].type==='melee'?80:400;return r*(1+player.rangeBonus);}
function getWpnDmg(id,level){let d=10+level*5;d*=(1+player.atkBonus);if(level>=6)d*=1.5;return d;}

function fireWeapon(w){
  playSound('fire');
  const def=weaponDefs[w.id];
  const range=getWpnRange(w.id);
  const dmg=getWpnDmg(w.id,w.level)*(def.dmgMul||1);
  const isSuper=w.level>=6;

  switch(w.id){
    case 'katana':{
      // Auto-aim: target nearest monster
      let ang;
      if(monsters.length>0){
        let nearest=null,bestDist=Infinity;
        for(const m of monsters){
          const d2=(m.x-player.x)**2+(m.y-player.y)**2;
          if(d2<bestDist){bestDist=d2;nearest=m;}
        }
        ang=Math.atan2(nearest.y-player.y,nearest.x-player.x);
      }else{
        ang=Math.atan2(player.lastDir.y,player.lastDir.x);
      }
      
      projectiles.push({
        x: player.x + Math.cos(ang) * 40,
        y: player.y + Math.sin(ang) * 40,
        dx: Math.cos(ang) * 250,
        dy: Math.sin(ang) * 250,
        dmg: dmg * 0.6,
        life: 0.4, maxLife: 0.4,
        size: 22,
        color: '#a8d8ea',
        type: 'crescent',
        penetrate: true
      });
      // reverse crescent
      projectiles.push({
        x: player.x - Math.cos(ang) * 40,
        y: player.y - Math.sin(ang) * 40,
        dx: -Math.cos(ang) * 350,
        dy: -Math.sin(ang) * 350,
        dmg: dmg,
        life: 0.7, maxLife: 0.7,
        size: 30,
        color: '#e8e8e8',
        type: 'crescent',
        penetrate: true
      });
      break;
    }
    case 'kunai':{
      let nearest=null,nd=Infinity;
      monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nearest=m;nd=d;}});
      if(nearest){const a=angle(player,nearest);const count=isSuper?3:1;
      for(let i=0;i<count;i++){const sp=(i-(count-1)/2)*0.15;
        projectiles.push({x:player.x,y:player.y,dx:Math.cos(a+sp)*500,dy:Math.sin(a+sp)*500,dmg,life:isSuper?2:1.2,color:'#ccc',size:4,penetrate:isSuper});}}
      break;
    }
    case 'staff':{
      const dir=player.lastDir;const ang=Math.atan2(dir.y,dir.x);
      const count=isSuper?12:5;
      for(let i=0;i<count;i++){const a=ang-Math.PI/2+Math.PI*i/(count-1);
        effects.push({x:player.x,y:player.y,dx:Math.cos(a),dy:Math.sin(a),life:0.2,range:range*0.8,dmg,color:'#f77',type:'slash'});}
      break;
    }
    case 'revolver':{
      const count=isSuper?12:6;
      for(let i=0;i<count;i++)setTimeout(()=>{
        if(gameState!=='playing'&&gameState!=='levelup')return;
        let nn=null,nd=Infinity;monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nn=m;nd=d;}});
        if(nn){const a=angle(player,nn)+rand(-0.1,0.1);
          projectiles.push({x:player.x,y:player.y,dx:Math.cos(a)*600,dy:Math.sin(a)*600,dmg,life:1.5,color:'#fe0',size:3,penetrate:false});}
      },i*80);
      break;
    }
    case 'thunderSpear':{
      let nn=null,nd=Infinity;monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nn=m;nd=d;}});
      if(nn){const a=angle(player,nn);
        projectiles.push({x:player.x,y:player.y,dx:Math.cos(a)*450,dy:Math.sin(a)*450,dmg,life:1.5,color:'#0dd',size:5,penetrate:true});
        const sc=isSuper?5:1;
        for(let i=0;i<sc;i++)setTimeout(()=>{
          if(gameState!=='playing'&&gameState!=='levelup')return;
          if(monsters.length>0){const t=monsters[randInt(0,monsters.length-1)];
            effects.push({x:t.x,y:t.y-30,life:0.3,range:80,dmg:dmg*0.8,color:'#0dd',type:'lightning'});}
        },i*150);
      }
      break;
    }
    case 'lightning':{
      const count=isSuper?8:2;
      for(let i=0;i<count;i++)setTimeout(()=>{
        if(gameState!=='playing'&&gameState!=='levelup')return;
        if(monsters.length>0){const t=monsters[randInt(0,monsters.length-1)];
          effects.push({x:t.x,y:t.y-30,life:0.3,range:90,dmg,color:'#fd0',type:'lightning'});}
      },i*100);
      break;
    }
    case 'timeField':{
      const sz=isSuper?200:50+(w.level-1)*18;
      effects.push({x:player.x,y:player.y,life:Infinity,range:sz,dmg:dmg*0.8,color:'#0dd',type:'timeField',followPlayer:true});
      break;
    }
    case 'bomb':{
      let nn=null,nd=Infinity;monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nn=m;nd=d;}});
      const t=nn||{x:player.x+rand(-100,100),y:player.y+rand(-100,100)};
      projectiles.push({x:player.x,y:player.y-20,dx:(t.x-player.x)*3,dy:(t.y-player.y)*3,dmg,life:0.8,color:'#f90',size:6,penetrate:false,explode:isSuper?120:80});
      break;
    }
    case 'poison':{
      effects.push({x:player.x+rand(-100,100),y:player.y+rand(-100,100),life:3*(1+player.durationBonus),range:isSuper?120:70,dmg:dmg*0.3,color:'#4a4',type:'poison'});
      break;
    }
    case 'volleyball':{
      const count=isSuper?3:1;
      for(let i=0;i<count;i++){const a=rand(0,Math.PI*2);
        projectiles.push({x:player.x,y:player.y,dx:Math.cos(a)*300,dy:Math.sin(a)*300,dmg,life:3,color:'#f80',size:8,penetrate:false,bounce:isSuper?5:3});}
      break;
    }
    case 'spear':{
      effects=effects.filter(e=>e.type!=='spearHead');
      const count=isSuper?w.level*2:w.level;
      for(let i=0;i<count;i++){
        effects.push({type:'spearHead',followPlayer:true,angleOffset:i/count*Math.PI*2,orbitRadius:isSuper?80:60,range:isSuper?40:32,dmg:dmg*0.35,life:def.cd+0.5,color:'#d90',idx:i,total:count});
      }
      break;
    }
    case 'hammer':{
      let nn=null,nd=Infinity;monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nn=m;nd=d;}});
      if(nn||isSuper){const count=isSuper?4:1;
      for(let i=0;i<count;i++){const a=nn?angle(player,nn):rand(0,Math.PI*2);
        projectiles.push({x:player.x,y:player.y,dx:Math.cos(a)*350,dy:Math.sin(a)*350,dmg:dmg*1.5,life:1.5,color:'#b97',size:14,penetrate:false,spin:true,shape:'hammer'});}}
      break;
    }
    case 'brick':{
      let nn=null,nd=Infinity;monsters.forEach(m=>{const d=dist(player,m);if(d<nd&&d<range){nn=m;nd=d;}});
      const target=nn||{x:player.x+rand(-200,200),y:player.y+rand(-200,200)};
      const count=isSuper?3:1;
      for(let i=0;i<count;i++){const a=angle(player,target)+rand(-0.2,0.2);
        projectiles.push({x:player.x,y:player.y-15,dx:Math.cos(a)*400,dy:Math.sin(a)*400,dmg,life:1.2,color:'#d55',size:10,penetrate:false,crit:isSuper&&Math.random()<0.4,shape:'brick'});}
      break;
    }
    case 'fireWheel':{
      const count=isSuper?4:1;
      for(let i=0;i<count;i++){const a=rand(0,Math.PI*2);
        projectiles.push({x:player.x+Math.cos(a)*30,y:player.y+Math.sin(a)*30,dx:Math.cos(a)*250,dy:Math.sin(a)*250,dmg,life:4,color:'#f40',size:8,penetrate:true,bounce:999});}
      break;
    }
  }
}

// ============ UPGRADE SYSTEM ============
function getAvailableUpgrades(){
  const choices=[];
  const awids=player.weapons.map(w=>w.id);
  const pids=player.passiveItems.map(p=>p.id);
  player.weapons.forEach(w=>{if(w.level<6)choices.push({type:'weapon_upgrade',weaponId:w.id,weapon:w});});
  if(player.weapons.length<6){const avail=Object.keys(weaponDefs).filter(id=>!awids.includes(id));if(avail.length>0)choices.push({type:'new_weapon',weaponId:avail[randInt(0,avail.length-1)]});}
  if(player.passiveItems.length<6){const avail=Object.keys(passiveDefs).filter(id=>!pids.includes(id));if(avail.length>0)choices.push({type:'new_passive',passiveId:avail[randInt(0,avail.length-1)]});}
  player.passiveItems.forEach(p=>{if(p.level<5)choices.push({type:'passive_upgrade',passiveId:p.id,passive:p});});
  for(let i=choices.length-1;i>0;i--){const j=randInt(0,i);[choices[i],choices[j]]=[choices[j],choices[i]];}
  return choices.slice(0,3);
}

function renderLevelUpChoices(){
  const ctr=document.getElementById('levelup-choices');ctr.innerHTML='';
  levelUpChoices=getAvailableUpgrades();
  levelUpChoices.forEach((c,i)=>{
    const card=document.createElement('div');card.className='choice-card';
    let isvg='',name='',tag='',tagCls='',desc='',lvl='',isSuper=false;
    if(c.type==='weapon_upgrade'){
      const w=c.weapon;const d=weaponDefs[w.id];isvg=icons[d.icon];name=d.name;tag='主动';tagCls='active';
      isSuper=w.level+1>=6;
      desc=isSuper?`超武: ${d.superName}`:`Lv${w.level+1} - ${d.desc}`;
      lvl=isSuper?'✦ S':`${w.level}→${w.level+1}`;
      if(isSuper)card.className+=' super';
    }else if(c.type==='new_weapon'){
      const d=weaponDefs[c.weaponId];isvg=icons[d.icon];name=d.name;tag='新技能';tagCls='active';desc=d.desc;lvl='获得';
    }else if(c.type==='new_passive'){
      const d=passiveDefs[c.passiveId];isvg=icons[d.icon];name=d.name;tag='被动';tagCls='passive';desc=d.desc;lvl='获得';
    }else if(c.type==='passive_upgrade'){
      const p=c.passive;const d=passiveDefs[p.id];isvg=icons[d.icon];name=d.name;tag='被动';tagCls='passive';
      desc=`效果提升至 ${Math.round(d.value*(p.level+1)*100)}%`;lvl=`${p.level}→${p.level+1}`;
    }
    card.innerHTML=`<div class="choice-icon">${isvg}</div><span class="choice-tag ${tagCls}">${tag}</span><div class="choice-name">${name}</div><div class="choice-desc">${desc}</div><div class="choice-lvl">${lvl}</div><div class="check-mark">✓</div>`;
    card.addEventListener('click',()=>selectUpgrade(i));
    ctr.appendChild(card);
  });
}

function selectUpgrade(index){
  if(index>=levelUpChoices.length)return;
  const c=levelUpChoices[index];
  // Mark chosen card
  const cards=document.querySelectorAll('.choice-card');
  if(cards[index]){cards[index].classList.add('chosen');}
  setTimeout(()=>{
    if(c.type==='weapon_upgrade'){const w=player.weapons.find(w=>w.id===c.weaponId);if(w)w.level++;}
    else if(c.type==='new_weapon')player.weapons.push({id:c.weaponId,level:1,cd:0});
    else if(c.type==='new_passive'){player.passiveItems.push({id:c.passiveId,level:1});applyPassive(c.passiveId,1);}
    else if(c.type==='passive_upgrade'){const p=player.passiveItems.find(p=>p.id===c.passiveId);if(p){applyPassive(p.id,-p.level);p.level++;applyPassive(p.id,p.level);}}
    levelUpChoices=[];document.getElementById('levelup-modal').classList.remove('active');
    gameState='playing';paused=false;
  },150);
}

function applyPassive(id,lm){
  const d=passiveDefs[id];const v=d.value*lm;
  switch(d.effect){
    case 'xpBonus':player.xpBonus+=v;break;
    case 'dmgReduction':player.dmgReduction+=v;break;
    case 'atkBonus':player.atkBonus+=v;break;
    case 'cdReduction':player.cdReduction+=v;break;
    case 'rangeBonus':player.rangeBonus+=v;break;
    case 'durationBonus':player.durationBonus+=v;break;
    case 'pickupRange':player.pickupRange+=80*v;break;
    case 'regen':player.regen+=v;break;
    case 'speedBonus':player.speedBonus+=v;break;
    case 'bulletSpeed':player.bulletSpeedBonus+=v;break;
    case 'maxHpBonus':player.maxHpBonus+=v;player.maxHp=100*(1+player.maxHpBonus);player.hp=Math.min(player.hp,player.maxHp);break;
  }
}

function levelUp(){
  player.level++;player.xp-=player.xpToNext;
  player.xpToNext=Math.floor(player.xpToNext*1.18+5);
  player.hp=Math.min(player.hp+20,player.maxHp);
  gameState='levelup';paused=true;
  renderLevelUpChoices();
  document.getElementById('levelup-modal').classList.add('active');
}

function damagePlayer(dmg){
  if(player.invuln>0)return;
  playSound('playerHit');
  dmg*=(1-player.dmgReduction);const actual=Math.ceil(dmg*10)/10;
  if(actual<=0)return;
  player.hp-=actual;player.invuln=0.3;player.hitFlash=0.1;shakeAmount=Math.max(shakeAmount,Math.min(actual*0.6,8));
  // Vibration with cooldown (prevent 60fps spam; iOS Safari doesn't support Vibration API)
  const now=Date.now();
  if(navigator.vibrate && window._vibratePrimed && now-(window._lastVibrate||0)>250){window._lastVibrate=now;navigator.vibrate([20,40,20]);}

  // Floating damage number
  const dmgEl=document.createElement('div');dmgEl.className='dmg-float';
  dmgEl.textContent='-'+Math.round(actual);
  dmgEl.style.left=(canvas.width/2+rand(-30,30))+'px';
  dmgEl.style.top=(canvas.height/2-60+rand(-20,0))+'px';
  document.getElementById('dmg-floats').appendChild(dmgEl);
  setTimeout(()=>dmgEl.remove(),800);

  if(player.hp<=0){player.hp=0;endGame(false);}
}

function endGame(won){
  gameState='over';gameOver=true;victory=won;
  const s=document.getElementById('gameover-screen');
  document.getElementById('go-title').textContent=won?'鲨鲨 吞噬者':won?'鲨鲨 吞噬者':'鲨鲨 陨落...';
  document.getElementById('go-title').className='go-title '+(won?'win':'lose');
  document.getElementById('go-shark-emoji').textContent=won?'🦈':'😭';
  document.getElementById('go-stats').innerHTML=`存活时间 <b>${formatTime(timer)}</b><br>击杀数 <b>${player.kills}</b><br>升级次数 <b>${player.level-1}</b><br>击败BOSS <b>${bossDefeated}</b><br>能量块 <b>${Math.floor(timer*2+player.kills*3)}</b>`;
  s.classList.add('active');
  document.getElementById('hp-warning').classList.remove('active');
}
document.getElementById('go-restart').addEventListener('click',restartGame);
document.getElementById('go-home').addEventListener('click',()=>{document.getElementById('gameover-screen').classList.remove('active');document.getElementById('lobby-screen').classList.add('active');});

function formatTime(t){const m=Math.floor(t/60),s=Math.floor(t%60);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}

// ============ GAME LOOP ============
function update(dt){
  if(gameState!=='playing')return;if(paused)return;if(gameOver)return;
  dt=Math.min(dt,0.1);timer+=dt;
  if(timer>=TOTAL_TIME){endGame(true);return;}

  const ew=Math.floor(timer/WAVE_INTERVAL)+1;
  if(ew>waveNum){waveNum=ew;spawnWave();if(Math.random()<0.3)chests.push({x:rand(100,MAP_W-100),y:rand(100,MAP_H-100)});}

  // Continuous spawn when monster count low
  const minAlive=5+waveNum*2;
  if(!bossActive&&monsters.filter(m=>!m.isBoss).length<minAlive){
    const types=Object.keys(monsterTypes);
    const t=types[randInt(0,Math.min(waveNum-1,types.length-1))];
    for(let i=0;i<randInt(2,4);i++)spawnMonster(t);
  }

  const eb=Math.floor(timer/BOSS_INTERVAL);
  if(eb>bossDefeated&&eb<=BOSS_COUNT&&!bossActive)spawnBoss(eb);

  if(bossAnnounceTimer>0){bossAnnounceTimer-=dt;if(bossAnnounceTimer<=0)document.getElementById('boss-announce').classList.remove('active');}

  // Movement
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;
  if(joystickActive){mx=joystickDX;my=joystickDY;}

  if(mx!==0||my!==0){const len=Math.hypot(mx,my);mx/=len;my/=len;player.lastDir={x:mx,y:my};player.animT+=dt;}
  const spd=player.speed*(1+player.speedBonus);
  if(player.slideCD>0){player.slideCD-=dt;updateSlideUI();}
  if(player.sliding){
    player.slideDur-=dt;
    player.invuln=0.1;
    const slideSpd=spd*3;
    player.x+=player.lastDir.x*slideSpd*dt;
    player.y+=player.lastDir.y*slideSpd*dt;
    player.x=clamp(player.x,20,MAP_W-20);player.y=clamp(player.y,20,MAP_H-20);
    if(player.slideDur<=0){player.sliding=false;updateSlideUI();}
  }else{
    player.x+=mx*spd*dt;player.y+=my*spd*dt;
    player.x=clamp(player.x,20,MAP_W-20);player.y=clamp(player.y,20,MAP_H-20);
  }

  if(player.invuln>0)player.invuln-=dt;
  if(player.hitFlash>0)player.hitFlash-=dt;
  if(shakeAmount>0){shakeAmount=Math.max(0,shakeAmount-dt*30);}
  if(player.regen>0)player.hp=Math.min(player.hp+player.regen*dt,player.maxHp);

  // HP Warning
  const hpWarn=document.getElementById('hp-warning');
  if(player.hp/player.maxHp<0.2)hpWarn.classList.add('active');else hpWarn.classList.remove('active');

  // Weapon CDs with attack stagger
  atkTimer-=dt;
  if(atkTimer<=0){
    player.weapons.some(w=>{if(w.cd===undefined)w.cd=0;w.cd-=dt;if(w.cd<=0){fireWeapon(w);w.cd=getWpnCd(w.id);atkTimer=0.08;return true;}return false;});
  }else{
    player.weapons.forEach(w=>{if(w.cd===undefined)w.cd=0;w.cd-=dt;});
  }

  // Projectiles
  projectiles=projectiles.filter(p=>{
    p.x+=p.dx*dt;p.y+=p.dy*dt;p.life-=dt;
    if(p.life<=0){if(p.explode){effects.push({x:p.x,y:p.y,life:0.3,range:p.explode,dmg:p.dmg*0.8,color:'#f90',type:'explosion'});playSound('explosion');}return false;}
    if(p.bounce&&p.bounce>0){let b=false;const m=10;const cl=Math.max(m,camera.x+m),cr=Math.min(MAP_W-m,camera.x+canvas.width-m);const ct=Math.max(m,camera.y+m),cb=Math.min(MAP_H-m,camera.y+canvas.height-m);if(p.x<cl&&p.dx<0){p.x=cl;p.dx*=-1;b=true;}if(p.x>cr&&p.dx>0){p.x=cr;p.dx*=-1;b=true;}if(p.y<ct&&p.dy<0){p.y=ct;p.dy*=-1;b=true;}if(p.y>cb&&p.dy>0){p.y=cb;p.dy*=-1;b=true;}if(b)p.bounce--;}
    if(p.x<-100||p.x>MAP_W+100||p.y<-100||p.y>MAP_H+100)return false;return true;
  });

  effects=effects.filter(e=>{e.life-=dt;return e.life>0;});
  particles=particles.filter(p=>{p.life-=dt;return p.life>0;});

  // Collision
  for(let p of projectiles){if(p.life<=0)continue;
    if(p.isEnemy){if(dist(p,player)<12+p.size*0.6){damagePlayer(p.dmg);p.life=0;}continue;}
    for(let i=monsters.length-1;i>=0;i--){const m=monsters[i];if(m.invuln)continue;const hitR=m.size+Math.max(p.size*0.6,5);if(dist(p,m)<hitR){
      let dmg=p.dmg;if(p.crit)dmg*=2;m.hp-=dmg;m.hitFlash=0.1;const rd=Math.round(dmg);if(rd>0)dmgFloats.push({x:m.x,y:m.y,text:rd,life:0.8,vy:-40,color:p.crit?'#ff0':'#fff'});playSound('hit');
      if(!p.penetrate){p.life=0;if(p.explode){effects.push({x:p.x,y:p.y,life:0.3,range:p.explode,dmg:p.dmg*0.8,color:'#f90',type:'explosion'});playSound('explosion');}break;}
    }}
  }
  // Follow-player effects
  let hasSpearHead=false;
  for(let e of effects){if(e.followPlayer){e.x=player.x;e.y=player.y;if(e.type==='spearHead')hasSpearHead=true;}}
  if(hasSpearHead){orbitalAngle+=dt*5;for(let e of effects){if(e.type==='spearHead'){e.x=player.x+Math.cos(orbitalAngle+e.angleOffset)*e.orbitRadius;e.y=player.y+Math.sin(orbitalAngle+e.angleOffset)*e.orbitRadius;}}}
  for(let e of effects){if(e.life<=0||e.type==='timeField'||e.type==='poison'||e.type==='teleport')continue;
    for(let m of monsters){if(m.invuln)continue;if(dist(e,m)<m.size+e.range*0.7){const dd=e.dmg*dt*5;m.hp-=dd;m.hitFlash=0.05;const rd=Math.round(dd);if(rd>0)dmgFloats.push({x:m.x,y:m.y,text:rd,life:0.6,vy:-25,color:'#f90'});}}
    if((e.type==='slamAoE'||e.type==='darkPulse')&&dist(e,player)<player.size+20+e.range*0.7)damagePlayer(e.dmg*dt*3);
  }
  for(let e of effects){
    if(e.type==='timeField'){for(let m of monsters){if(dist(e,m)<e.range){const dd=e.dmg*dt;m.hp-=dd;m.hitFlash=0.02;const rd=Math.round(dd);if(rd>0)dmgFloats.push({x:m.x,y:m.y,text:rd,life:0.5,vy:-20,color:'#0ff'});}}}
    if(e.type==='poison'){for(let m of monsters){if(dist(e,m)<e.range){const dd=e.dmg*dt;m.hp-=dd;m.hitFlash=0.02;const rd=Math.round(dd);if(rd>0)dmgFloats.push({x:m.x,y:m.y,text:rd,life:0.5,vy:-20,color:'#0f0'});}}}
  }

  // Kill monsters
  for(let i=monsters.length-1;i>=0;i--){const m=monsters[i];
    if(m.hp<=0){
      const xc=m.isBoss?15:randInt(1,3);
      for(let j=0;j<xc;j++)xpOrbs.push({x:m.x+rand(-20,20),y:m.y+rand(-20,20),value:m.isBoss?m.xpValue/xc:5});
      if(m.isBoss){bossActive=null;bossDefeated++;chests.push({x:m.x,y:m.y,bossChest:true});}
      player.kills++;player.xp+=m.xpValue*(1+player.xpBonus);playSound('kill');
      const pc=m.isBoss?20:6;for(let j=0;j<pc;j++){const a=rand(0,Math.PI*2),s=rand(40,120);particles.push({x:m.x,y:m.y,color:m.color,size:rand(2,5),life:0.3+rand(0,0.3),vx:Math.cos(a)*s,vy:Math.sin(a)*s});}
      monsters.splice(i,1);
    }
  }

  // Monster AI with behaviors
  dmgFloats=dmgFloats.filter(f=>{f.y+=f.vy*dt;f.life-=dt;return f.life>0&&f.text>0;});
  monsters.forEach(m=>{
    if(m.behaviorCD===undefined)m.behaviorCD=rand(1,3);
    m.behaviorCD-=dt;
    let spd=m.speed;
    const a=angle(m,player);
    if(!m.isBoss){
      switch(m.behavior){
        case 'charger':
          if(m.behaviorCD<=0){m.charging=true;m.chargeSpeed=spd*2.5;m.behaviorCD=2.5;m.chargeTime=0.4;}
          if(m.charging){m.chargeTime-=dt;spd=m.chargeSpeed;if(m.chargeTime<=0)m.charging=false;}
          break;
        case 'swarmer':{
          const d=dist(m,player);if(d>150){spd*=1.3;}else if(d<60){spd*=0.6;}
          const orbitA=a+1.57;m.x+=Math.cos(orbitA)*spd*dt*60;m.y+=Math.sin(orbitA)*spd*dt*60;
          return;
        }
        case 'slammer':
          if(m.behaviorCD<=0&&dist(m,player)<120){
            m.slamming=true;m.behaviorCD=4;m.slamTimer=0.6;
            effects.push({x:m.x,y:m.y,life:0.4,range:80,dmg:m.dmg*1.5,color:'#f80',type:'slamAoE'});
          }
          break;
        case 'phaser':
          if(m.behaviorCD<=0){m.phasing=true;m.phaseTimer=1.5;m.behaviorCD=4;}
          if(m.phasing){m.phaseTimer-=dt;spd*=2;m.invuln=true;if(m.phaseTimer<=0){m.phasing=false;m.invuln=false;}}
          break;
        default:break;
      }
    } else {
      switch(m.behavior){
        case 'ranged':
          if(m.behaviorCD<=0&&dist(m,player)<350){
            const ba=angle(m,player);projectiles.push({x:m.x,y:m.y,dx:Math.cos(ba)*200,dy:Math.sin(ba)*200,size:8,dmg:m.dmg*0.7,life:2,color:'#f33',isEnemy:true});
            if(waveNum>=5){const b2=ba+0.4,b3=ba-0.4;projectiles.push({x:m.x,y:m.y,dx:Math.cos(b2)*180,dy:Math.sin(b2)*180,size:8,dmg:m.dmg*0.7,life:2,color:'#f33',isEnemy:true});projectiles.push({x:m.x,y:m.y,dx:Math.cos(b3)*180,dy:Math.sin(b3)*180,size:8,dmg:m.dmg*0.7,life:2,color:'#f33',isEnemy:true});}
            m.behaviorCD=1.8;playSound('bossAtk');
          }
          break;
        case 'teleporter':
          if(m.behaviorCD<=0){
            const tx=player.x+rand(-100,100),ty=player.y+rand(-100,100);
            effects.push({x:m.x,y:m.y,life:0.4,range:60,dmg:0,color:'#909',type:'teleport'});
            m.x=clamp(tx,20,MAP_W-20);m.y=clamp(ty,20,MAP_H-20);
            effects.push({x:m.x,y:m.y,life:0.4,range:60,dmg:0,color:'#909',type:'teleport'});
            effects.push({x:m.x,y:m.y,life:0.5,range:120,dmg:m.dmg*1.2,color:'#70f',type:'darkPulse'});
            m.behaviorCD=3+rand(0,2);
            playSound('teleport');
          }
          break;
        case 'artillery':
          if(m.behaviorCD<=0){
            for(let j=0;j<5;j++){const ba=angle(m,player)+rand(-0.4,0.4);projectiles.push({x:m.x+rand(-20,20),y:m.y+rand(-20,20),dx:Math.cos(ba)*250,dy:Math.sin(ba)*250,size:5,dmg:m.dmg*0.5,life:3,color:'#aaa',isEnemy:true});}
            m.behaviorCD=3;playSound('bossAtk');
          }
          break;
      }
    }
    if(!m.charging||m.behavior==='swarmer'){m.x+=Math.cos(a)*spd*dt*60;m.y+=Math.sin(a)*spd*dt*60;}
  });

  // Damage player
  monsters.forEach(m=>{if(dist(m,player)<m.size+12)damagePlayer(m.dmg*dt*60);});

  // XP pickup
  for(let i=xpOrbs.length-1;i>=0;i--){const o=xpOrbs[i];const d=dist(player,o);
    if(d<player.pickupRange){const a=angle(o,player);o.x+=Math.cos(a)*300*dt;o.y+=Math.sin(a)*300*dt;if(d<15){player.xp+=o.value*(1+player.xpBonus);xpOrbs.splice(i,1);}}}

  // Chests
  for(let i=chests.length-1;i>=0;i--){const c=chests[i];
    if(dist(player,c)<30){const pids=Object.keys(passiveDefs);const pid=pids[randInt(0,pids.length-1)];
      const ex=player.passiveItems.find(p=>p.id===pid);
      if(ex&&ex.level<5){applyPassive(pid,-ex.level);ex.level++;applyPassive(pid,ex.level);}
      else if(!ex&&player.passiveItems.length<6){player.passiveItems.push({id:pid,level:1});applyPassive(pid,1);}
      chests.splice(i,1);
    }
  }

  while(player.xp>=player.xpToNext)levelUp();
  updateHUD();
}

function updateHUD(){
  document.getElementById('hud-timer').textContent=formatTime(timer);
  document.getElementById('hud-energy').textContent=Math.floor(timer*2+player.kills*3);
  document.getElementById('xp-inner').style.width=(player.xp/player.xpToNext*100)+'%';
  document.getElementById('hp-inner').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('progress-fill').style.width=(timer/TOTAL_TIME*100)+'%';

  updateWeaponSlots();
  updatePassiveBuffs();
}

function updateWeaponSlots(){
  const slots=document.getElementById('weapon-slots');
  let html='';
  player.weapons.forEach(w=>{
    const d=weaponDefs[w.id];
    const cdPct=Math.min(1,Math.max(0,1-(w.cd/getWpnCd(w.id))));
    html+=`<div class="wpn-slot${w.level>=6?' super':''}">${icons[d.icon]}<span class="lvl">${w.level>=6?'S':w.level}</span>${cdPct>0?`<div class="cd-mask" style="height:${Math.round(cdPct*100)}%"></div>`:''}</div>`;
  });
  slots.innerHTML=html;
}

function updatePassiveBuffs(){
  const buffs=document.getElementById('passive-buffs');
  let html='';
  player.passiveItems.forEach(p=>{
    const d=passiveDefs[p.id];
    html+=`<div class="passive-icon">${d.name} <span class="passive-lvl">Lv${p.level}</span></div>`;
  });
  buffs.innerHTML=html;
}

// ============ RENDER ============
function drawBackground(){
  // Deep space purple gradient
  const grad=ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,'#2b2e4a');grad.addColorStop(0.5,'#232540');grad.addColorStop(1,'#1b1c2b');
  ctx.fillStyle=grad;ctx.fillRect(0,0,canvas.width,canvas.height);

  // Clip to map bounds - hide outside area
  ctx.save();
  ctx.beginPath();
  const mapLeft=Math.max(0,-camera.x);
  const mapTop=Math.max(0,-camera.y);
  const mapRight=Math.min(canvas.width,MAP_W-camera.x);
  const mapBottom=Math.min(canvas.height,MAP_H-camera.y);
  ctx.rect(mapLeft,mapTop,mapRight-mapLeft,mapBottom-mapTop);
  ctx.clip();

  // Grid
  ctx.save();ctx.translate(-camera.x,-camera.y);
  ctx.strokeStyle='rgba(76,201,240,0.05)';ctx.lineWidth=1;
  const sx=Math.floor(camera.x/TILE)*TILE,sy=Math.floor(camera.y/TILE)*TILE;
  for(let x=sx;x<camera.x+canvas.width+TILE;x+=TILE){ctx.beginPath();ctx.moveTo(x,camera.y);ctx.lineTo(x,camera.y+canvas.height);ctx.stroke();}
  for(let y=sy;y<camera.y+canvas.height+TILE;y+=TILE){ctx.beginPath();ctx.moveTo(camera.x,y);ctx.lineTo(camera.x+canvas.width,y);ctx.stroke();}

  // Map border
  ctx.strokeStyle='rgba(76,201,240,0.4)';ctx.lineWidth=4;ctx.strokeRect(2,2,MAP_W-4,MAP_H-4);

  ctx.restore(); // Grid translate
  ctx.restore(); // Clip
}

function drawMonster(m){
  if(!monsterImg)return;
  ctx.save();ctx.translate(m.x-camera.x,m.y-camera.y);
  const scale=m.isBoss?0.5:0.22;
  const w=500*scale,h=500*scale;
  if(m.phasing)ctx.globalAlpha=0.3;
  if(m.hitFlash>0&&Math.floor(m.hitFlash*30)%2===0)ctx.globalAlpha=0.5;
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(monsterImg,-w/2,-h/2,w,h);
  ctx.imageSmoothingEnabled=true;
  if(m.charging){ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,w*0.6,0,Math.PI*2);ctx.stroke();}
  ctx.globalAlpha=1;

  // HP bar above monster
  if(m.isBoss||m.hp<m.maxHp){
    const bw=m.isBoss?90:30,bh=5,bx=-bw/2,by=-h/2-14;
    ctx.fillStyle='#000';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    ctx.fillStyle='#e63946';ctx.fillRect(bx,by,bw*(m.hp/m.maxHp),bh);
  }
  if(m.isBoss){
    ctx.fillStyle='#fff';ctx.font='bold 10px "Noto Sans SC","PingFang SC",sans-serif';ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(m.name,0,-h/2-20);ctx.fillText(m.name,0,-h/2-20);
  }
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  camera.x=clamp(player.x-canvas.width/2,0,MAP_W-canvas.width);
  camera.y=clamp(player.y-canvas.height/2,0,MAP_H-canvas.height);
  const shakeX=shakeAmount>0?(Math.random()-0.5)*shakeAmount*2:0;
  const shakeY=shakeAmount>0?(Math.random()-0.5)*shakeAmount*2:0;
  camera.x+=shakeX;camera.y+=shakeY;
  drawBackground();

  // XP orbs
  xpOrbs.forEach(o=>{
    ctx.fillStyle='#fca311';
    ctx.strokeStyle='#000';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(o.x-camera.x,o.y-camera.y,4,0,Math.PI*2);ctx.fill();ctx.stroke();
  });

  // Chests
  chests.forEach(c=>{
    const cx=c.x-camera.x,cy=c.y-camera.y;
    ctx.fillStyle='#fca311';ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.fillRect(cx-14,cy-10,28,20);ctx.strokeRect(cx-14,cy-10,28,20);
    ctx.fillStyle='#cc8800';ctx.fillRect(cx-12,cy-6,24,6);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-8,cy-8,2,0,Math.PI*2);ctx.fill();
  });

  // Effects
  effects.forEach(e=>{
    const ex=e.x-camera.x,ey=e.y-camera.y;
    ctx.save();
    switch(e.type){
      case 'slash':{
        const sLen = e.range * Math.min(e.life / 0.15, 1);
        ctx.save();
        // 计算法线方向，使月牙朝向攻击方向
        const len = Math.sqrt(e.dx*e.dx + e.dy*e.dy) || 1;
        const pnx = -e.dy / len, pny = e.dx / len; 
        const h = sLen * 0.6; // 剑气高度系数

        // 三个点：头部、尾部（根据法线平移）
        const cx = ex + e.dx * sLen * 0.3; // 月牙质心向前偏移
        const cy = ey + e.dy * sLen * 0.3;
        
        ctx.translate(cx, cy);
        const rot = Math.atan2(e.dy, e.dx);
        ctx.rotate(rot); 

        // 1. 残影 1（半透明蓝白）
        ctx.fillStyle = `rgba(200, 240, 255, ${0.5 * Math.min(e.life/0.15,1)})`;
        ctx.strokeStyle = `rgba(0,0,0,${0.5 * Math.min(e.life/0.15,1)})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, -h * 0.8);
        ctx.bezierCurveTo(-h*0.8, -h*0.8, -h*0.8, h*0.8, 0, h*0.8);
        ctx.bezierCurveTo(-h*0.4, h*0.8, -h*0.4, -h*0.8, 0, -h*0.8);
        ctx.fill(); ctx.stroke();

        // 2. 残影 2（亮白主拖尾）
        ctx.fillStyle = `rgba(255, 255, 255, ${0.9 * Math.min(e.life/0.15,1)})`;
        ctx.strokeStyle = `rgba(0,0,0,${0.8 * Math.min(e.life/0.15,1)})`;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(0, -h);
        ctx.bezierCurveTo(-h, -h, -h, h, 0, h);
        ctx.bezierCurveTo(-h*0.5, h, -h*0.5, -h, 0, -h);
        ctx.fill(); ctx.stroke();

        // 3. 主月牙（纯白实心 + 极粗黑边、右侧深度内凹）
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(e.life/0.15,1)})`;
        ctx.strokeStyle = `rgba(0,0,0,${Math.min(e.life/0.15,1)})`;
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(0, -h * 1.15);
        ctx.bezierCurveTo(-h*1.15, -h*1.15, -h*1.15, h*1.15, 0, h*1.15);
        ctx.bezierCurveTo(-h*0.65, h*1.15, -h*0.65, -h*1.15, 0, -h*1.15);
        ctx.fill(); ctx.stroke();

        ctx.restore();
        break;
      }
      case 'thrust':
        ctx.save();ctx.globalAlpha=e.life/0.2;
        ctx.strokeStyle=e.color;ctx.lineWidth=6-(e.life*20);
        ctx.beginPath();
        const tSweepLen=e.range*(e.life/0.2);
        ctx.moveTo(ex,ey);
        ctx.lineTo(ex+e.dx*tSweepLen,ey+e.dy*tSweepLen);
        ctx.stroke();
        ctx.strokeStyle='#fff';ctx.lineWidth=2-(e.life*8);
        ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+e.dx*tSweepLen,ey+e.dy*tSweepLen);ctx.stroke();
        ctx.restore();break;
      case 'lightning':
        ctx.strokeStyle=e.color;ctx.lineWidth=5;
        ctx.beginPath();ctx.moveTo(ex,ey);let lx=ex,ly=ey;
        for(let j=0;j<7;j++){lx+=rand(-25,25);ly+=e.range/7;ctx.lineTo(lx,ly);}ctx.stroke();break;
      case 'timeField':
        ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.setLineDash([8,5]);
        ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='rgba(76,201,240,0.08)';ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.fill();break;
      case 'poison':
        ctx.fillStyle='rgba(68,170,68,0.2)';ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#4a4';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(ex,ey,e.range,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);break;
      case 'spearHead':{
        const a=orbitalAngle+e.angleOffset;
        ctx.save();ctx.translate(ex,ey);ctx.rotate(a-Math.PI/2);
        // glow
        ctx.fillStyle='rgba(255,200,50,0.15)';ctx.beginPath();ctx.arc(0,0,e.range,0,Math.PI*2);ctx.fill();
        // trail ring
        ctx.strokeStyle='rgba(255,180,0,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(0,0,e.orbitRadius||60,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
        // spear head - golden blade
        ctx.fillStyle='#ffd700';ctx.strokeStyle='#b8860b';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(-7,-6);ctx.lineTo(0,-12);ctx.lineTo(7,-6);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle='#ffec80';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-4,-8);ctx.lineTo(0,-12);ctx.lineTo(4,-8);ctx.closePath();ctx.fill();
        // shaft
        ctx.fillStyle='#8B4513';ctx.strokeStyle='#5a2d0c';ctx.lineWidth=1;
        ctx.fillRect(-2,-6,4,16);ctx.strokeRect(-2,-6,4,16);
        // red tassel
        ctx.fillStyle='#cc0000';ctx.beginPath();ctx.arc(0,2,4,0,Math.PI*2);ctx.fill();
        ctx.restore();break;
      }
      case 'slamAoE':{
        const sr=e.range*(e.life/0.4);ctx.fillStyle='rgba(255,136,0,0.3)';ctx.beginPath();ctx.arc(ex,ey,sr,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#f80';ctx.lineWidth=4;ctx.globalAlpha=e.life/0.4;ctx.beginPath();ctx.arc(ex,ey,sr,0,Math.PI*2);ctx.stroke();
        break;}
      case 'darkPulse':{
        const dr=e.range*(e.life/0.5);ctx.fillStyle='rgba(112,0,255,0.25)';ctx.beginPath();ctx.arc(ex,ey,dr,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#70f';ctx.lineWidth=5;ctx.setLineDash([10,5]);ctx.globalAlpha=e.life/0.5;ctx.beginPath();ctx.arc(ex,ey,dr,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
        break;}
      case 'teleport':{
        ctx.fillStyle='rgba(153,0,153,0.5)';ctx.beginPath();ctx.arc(ex,ey,e.range*(1-e.life/0.4),0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#909';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ex,ey,e.range*(e.life/0.4),0,Math.PI*2);ctx.stroke();
        break;}
      case 'explosion':
        const a=e.life/0.3;ctx.fillStyle=`rgba(252,163,17,${a*0.4})`;ctx.beginPath();ctx.arc(ex,ey,e.range*(1-a),0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=`rgba(252,163,17,${a})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(ex,ey,e.range*(1-a*0.5),0,Math.PI*2);ctx.stroke();break;
    }
    ctx.restore();
  });

  // Projectiles
  projectiles.forEach(p=>{
    if (p.type === 'crescent') {
      ctx.save();
      ctx.translate(p.x - camera.x, p.y - camera.y);
      const rot = Math.atan2(p.dy, p.dx);
      ctx.rotate(rot);
      const lifeFade = p.maxLife ? Math.max(0, p.life / p.maxLife) : Math.min(p.life / 1.0, 1);
      const h = p.size * 1.2;

      ctx.fillStyle = `rgba(200, 240, 255, ${0.5 * lifeFade})`;
      ctx.strokeStyle = `rgba(0,0,0,${0.5 * lifeFade})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.8);
      ctx.bezierCurveTo(h*0.8, -h*0.8, h*0.8, h*0.8, 0, h*0.8);
      ctx.bezierCurveTo(h*0.4, h*0.8, h*0.4, -h*0.8, 0, -h*0.8);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = `rgba(255, 255, 255, ${0.9 * lifeFade})`;
      ctx.strokeStyle = `rgba(0,0,0,${0.8 * lifeFade})`;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, -h);
      ctx.bezierCurveTo(h, -h, h, h, 0, h);
      ctx.bezierCurveTo(h*0.5, h, h*0.5, -h, 0, -h);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = `rgba(255, 255, 255, ${lifeFade})`;
      ctx.strokeStyle = `rgba(0,0,0, ${lifeFade})`;
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(0, -h * 1.15);
      ctx.bezierCurveTo(h*1.15, -h*1.15, h*1.15, h*1.15, 0, h*1.15);
      ctx.bezierCurveTo(h*0.65, h*1.15, h*0.65, -h*1.15, 0, -h*1.15);
      ctx.fill(); ctx.stroke();

      ctx.restore();
    } else if (p.shape === 'hammer') {
      ctx.save();ctx.translate(p.x-camera.x,p.y-camera.y);ctx.rotate(Date.now()*0.015);
      const s=p.size;ctx.fillStyle='#888';ctx.strokeStyle='#000';ctx.lineWidth=3;
      ctx.beginPath();ctx.roundRect(-s,-s*0.3,s*2.5,s*0.6,3);ctx.fill();ctx.stroke();
      ctx.fillStyle='#665';ctx.beginPath();ctx.roundRect(-s*0.9,s*0.1,s*0.6,s*1.5,2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#555';ctx.beginPath();ctx.roundRect(-s*0.65,s*1.3,s*0.3,s*1.2,2);ctx.fill();ctx.stroke();
      ctx.restore();
    } else if (p.shape === 'brick') {
      ctx.save();ctx.translate(p.x-camera.x,p.y-camera.y);
      const s=p.size;ctx.fillStyle='#c44';ctx.strokeStyle='#000';ctx.lineWidth=4;
      ctx.beginPath();ctx.roundRect(-s*1.4,-s*0.5,s*2.8,s*1.0,3);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#000';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(-s*0.5,-s*0.5);ctx.lineTo(-s*0.5,s*0.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(s*0.5,-s*0.5);ctx.lineTo(s*0.5,s*0.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-s*1.4,0);ctx.lineTo(s*1.4,0);ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillStyle=p.color;ctx.strokeStyle='#000';ctx.lineWidth=2;
      ctx.beginPath();
      if(p.spin){ctx.save();ctx.translate(p.x-camera.x,p.y-camera.y);ctx.rotate(Date.now()*0.015);ctx.fillRect(-p.size,-p.size/2,p.size*2,p.size);ctx.strokeRect(-p.size,-p.size/2,p.size*2,p.size);ctx.restore();}
      else{ctx.arc(p.x-camera.x,p.y-camera.y,p.size,0,Math.PI*2);ctx.fill();ctx.stroke();}
    }
  });

  // Monsters
  monsters.forEach(m=>drawMonster(m));

  // Particles
  particles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=p.life/0.5;ctx.beginPath();if(p.vx!==undefined){ctx.arc(p.x+p.vx*(1-p.life*2)-camera.x,p.y+p.vy*(1-p.life*2)-camera.y,p.size*p.life*2,0,Math.PI*2);}else{ctx.arc(p.x-camera.x,p.y-camera.y,p.size*p.life*2,0,Math.PI*2);}ctx.fill();});
  ctx.globalAlpha=1;

  // Damage floats
  dmgFloats.forEach(f=>{
    ctx.save();ctx.globalAlpha=Math.min(1,f.life/0.3);
    ctx.fillStyle=f.color;ctx.font='bold 16px "Noto Sans SC","PingFang SC",sans-serif';ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.strokeText(f.text,f.x-camera.x,f.y-camera.y);ctx.fillText(f.text,f.x-camera.x,f.y-camera.y);
    ctx.restore();
  });

  // ===== PLAYER =====
  const px=player.x-camera.x,py=player.y-camera.y;
  if(player.invuln>0&&Math.floor(player.invuln*20)%2===0)ctx.globalAlpha=0.4;
  if(player.hitFlash>0)ctx.globalAlpha=0.6;
  if(playerImg){
    const pScale=0.22;
    const pw=500*pScale,ph=500*pScale;
    const bob=Math.sin(player.animT*12)*4;
    ctx.save();ctx.translate(px,py+bob);
    ctx.drawImage(playerImg,-pw/2,-ph/2,pw,ph);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// ============ AUDIO ============
let audioCtx=null;
function getAudioCtx(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}return audioCtx;}
function playSound(type){
  try{const ctx=getAudioCtx();const now=ctx.currentTime;const g=ctx.createGain();g.connect(ctx.destination);
  switch(type){
    case 'hit':{const o=ctx.createOscillator();o.type='square';o.frequency.setValueAtTime(220,now);o.frequency.exponentialRampToValueAtTime(80,now+0.08);o.connect(g);g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.1);o.start(now);o.stop(now+0.1);break;}
    case 'playerHit':{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(40,now+0.15);o.connect(g);g.gain.setValueAtTime(0.12,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);o.start(now);o.stop(now+0.15);break;}
    case 'fire':{const o=ctx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(600,now);o.frequency.exponentialRampToValueAtTime(200,now+0.06);o.connect(g);g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.06);o.start(now);o.stop(now+0.06);break;}
    case 'kill':{const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(300,now);o.frequency.exponentialRampToValueAtTime(600,now+0.1);o.connect(g);g.gain.setValueAtTime(0.1,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.12);o.start(now);o.stop(now+0.12);break;}
    case 'bossAtk':{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(100,now);o.frequency.linearRampToValueAtTime(50,now+0.3);o.connect(g);g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);o.start(now);o.stop(now+0.35);break;}
    case 'teleport':{const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(800,now);o.frequency.exponentialRampToValueAtTime(200,now+0.2);o.connect(g);g.gain.setValueAtTime(0.1,now);g.gain.setValueAtTime(0.05,now+0.1);g.gain.exponentialRampToValueAtTime(0.001,now+0.25);o.start(now);o.stop(now+0.25);break;}
    case 'levelUp':{for(let i=0;i<3;i++){const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(400+i*150,now+i*0.08);o.connect(g);const g2=ctx.createGain();o.connect(g2);g2.connect(g);g2.gain.setValueAtTime(0.08,now+i*0.08);g2.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.15);o.start(now+i*0.08);o.stop(now+i*0.08+0.15);}break;}
    case 'explosion':{const o=ctx.createOscillator();o.type='square';o.frequency.setValueAtTime(80,now);o.frequency.exponentialRampToValueAtTime(20,now+0.2);o.connect(g);g.gain.setValueAtTime(0.12,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.25);const n=ctx.createOscillator();n.type='triangle';n.frequency.setValueAtTime(50,now);n.frequency.exponentialRampToValueAtTime(10,now+0.25);n.connect(g);g.gain.value=0.1;n.start(now);n.stop(now+0.25);o.start(now);o.stop(now+0.25);break;}
  }}catch(e){}
}

// ============ MAIN LOOP ============
function gameLoop(ts){
  if(!lastTime)lastTime=ts;
  let dt=(ts-lastTime)/1000;if(dt>0.1)dt=0.1;lastTime=ts;
  if(gameState==='playing')update(dt);
  render();requestAnimationFrame(gameLoop);
}

function startGame(){
  if(!monsterImg||!playerImg)loadSprites();
  player.x=MAP_W/2;player.y=MAP_H/2;
  player.hp=100;player.maxHp=100;
  player.xp=0;player.xpToNext=30;player.level=1;player.speed=180;
  player.weapons=[{id:'katana',level:1,cd:0}];player.passiveItems=[];
  player.pickupRange=80;player.hitFlash=0;
  player.atkBonus=0;player.dmgReduction=0;player.cdReduction=0;player.rangeBonus=0;
  player.durationBonus=0;player.speedBonus=0;player.bulletSpeedBonus=0;player.xpBonus=0;
  player.regen=0;player.maxHpBonus=0;player.invuln=0;player.kills=0;
  shakeAmount=0;
  player.lastDir={x:0,y:-1};
  player.slideCD=0;player.sliding=false;player.slideDur=0;
  updateSlideUI();
  monsters=[];projectiles=[];effects=[];xpOrbs=[];chests=[];particles=[];dmgFloats=[];
  timer=0;waveNum=1;bossDefeated=0;bossActive=null;atkTimer=0;orbitalAngle=0;
  gameOver=false;victory=false;paused=false;gameState='playing';
  // Prime vibration API (requires user gesture; startGame only runs from button clicks)
  if(navigator.vibrate){navigator.vibrate(10);window._vibratePrimed=true;}
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('levelup-modal').classList.remove('active');
  document.getElementById('lobby-screen').classList.remove('active');
  document.getElementById('pause-panel').classList.remove('active');
  document.getElementById('hp-warning').classList.remove('active');
  // Init boss markers on progress bar
  const markers=document.getElementById('progress-markers');
  markers.innerHTML='';
  for(let i=1;i<=BOSS_COUNT;i++){
    const pct=(BOSS_INTERVAL*i)/TOTAL_TIME*100;
    markers.innerHTML+=`<div class="progress-boss-marker" style="left:${pct}%"></div><div class="progress-boss-label" style="left:${pct}%">BOSS${i}</div>`;
  }
  updateHUD();spawnWave();
}
function restartGame(){startGame();}

function doSlide(){
  if(player.sliding||player.slideCD>0||gameState!=='playing'||paused||gameOver)return;
  player.sliding=true;
  player.slideDur=0.2;
  player.slideCD=player.slideMaxCD;
  updateSlideUI();
}
function updateSlideUI(){
  const btn=document.getElementById('slide-btn');
  if(player.slideCD>0){
    btn.classList.add('on-cd');
    btn.textContent=Math.ceil(player.slideCD);
  }else{
    btn.classList.remove('on-cd');
    btn.textContent='滑';
  }
}

// Loading simulation → Lobby
(function(){
  const fill=document.getElementById('loading-bar-fill');
  let p=0;
  const t=setInterval(()=>{
    p+=Math.random()*25+10;
    if(p>=100){p=100;clearInterval(t);
      setTimeout(()=>{
        document.getElementById('loading-screen').style.display='none';
        document.getElementById('lobby-screen').classList.add('active');
      },300);
    }
    fill.style.width=p+'%';
  },200);
})();

document.getElementById('lobby-start-btn').addEventListener('click',()=>{startGame();});

requestAnimationFrame(gameLoop);
</script>
